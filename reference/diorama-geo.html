<!DOCTYPE html>
<html lang="ko">
<head>

<title>도쿄 산책 · 규빈 &amp; 아내 10.17–22</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#3a352e; --ink2:#7a7266; --cream:#faf7f0; --card:#ffffff;
  --acc:#e8734a; --acc2:#c0392b; --leaf:#7fb069; --sky:#8fb4d9; --gold:#c9a24b;
}
html,body{height:100%;overflow:hidden;background:var(--cream);
  font-family:'Zen Maru Gothic',sans-serif;color:var(--ink)}
canvas{display:block}
#scene{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}

/* ---------- 스팟 라벨 칩 ---------- */
.pinChip{pointer-events:auto;cursor:pointer;transform:translate(-50%,-130%);white-space:nowrap;
  background:#fff;border-radius:20px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 4px 14px rgba(58,53,46,.18);
  border:1.5px solid rgba(58,53,46,.06);transition:transform .15s, box-shadow .15s}
.pinChip:hover{box-shadow:0 6px 18px rgba(58,53,46,.28)}
.pinChip .no{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px}
.pinChip.eat .no{background:var(--acc2)}
.pinChip.sel{background:var(--ink);color:#fff}
.pinChip.sel .no{background:var(--gold)}
.lmChip{pointer-events:none;transform:translate(-50%,-140%);white-space:nowrap;
  background:var(--ink);color:#fff;border-radius:18px;padding:6px 14px;font-size:12px;font-weight:700;
  box-shadow:0 4px 14px rgba(58,53,46,.3)}

/* ---------- 좌상단 타이틀 카드 ---------- */
#head{position:fixed;top:20px;left:20px;z-index:10;width:min(420px,calc(100vw - 40px));
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:20px;
  padding:20px 22px 16px;box-shadow:0 10px 34px rgba(58,53,46,.12)}
#head .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--ink2);margin-bottom:8px}
#head .titleRow{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
#head .dayNo{font-family:'Shippori Mincho',serif;font-size:40px;font-weight:800;color:var(--acc);line-height:1}
#head h1{font-family:'Shippori Mincho',serif;font-size:21px;font-weight:800;letter-spacing:.02em}
#head .region{font-size:12px;color:var(--ink2);margin-bottom:12px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1.5px solid rgba(58,53,46,.14);background:#fff;border-radius:16px;
  padding:5px 11px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .t{color:var(--ink2);font-weight:400;margin-right:4px}
.chip.sel .t{color:rgba(255,255,255,.6)}

/* ---------- 우측 상세 패널 ---------- */
#panel{position:fixed;top:20px;right:20px;bottom:86px;z-index:10;width:min(320px,calc(100vw - 40px));
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:20px;
  box-shadow:0 10px 34px rgba(58,53,46,.12);display:flex;flex-direction:column;overflow:hidden}
#panel .ph{padding:16px 20px 12px;border-bottom:1px solid rgba(58,53,46,.08);
  display:flex;align-items:center;justify-content:space-between}
#panel .ph b{font-family:'Shippori Mincho',serif;font-size:15px}
#panel .ph span{font-size:11px;color:var(--ink2)}
#panel .body{padding:18px 20px;overflow-y:auto;flex:1}
#panel .plno{font-size:11px;letter-spacing:.18em;color:var(--acc);margin-bottom:6px}
#panel h2{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:800;margin-bottom:4px}
#panel .meta{font-size:12px;color:var(--ink2);margin-bottom:14px;display:flex;gap:8px;align-items:center}
#panel .tag{font-size:10px;background:rgba(192,57,43,.12);color:var(--acc2);border-radius:10px;padding:2px 8px;font-weight:700}
#panel .desc{font-size:13px;line-height:1.8;color:var(--ink);background:var(--cream);
  border-radius:14px;padding:14px 15px;margin-bottom:14px}
#panel .list{border-top:1px dashed rgba(58,53,46,.15);padding-top:12px}
#panel .list .lt{font-size:11px;letter-spacing:.14em;color:var(--ink2);margin-bottom:8px}
.row{display:flex;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;align-items:baseline;transition:.15s}
.row:hover{background:var(--cream)}
.row.sel{background:rgba(232,115,74,.12)}

.row .nm{font-size:12.5px;font-weight:700}

  padding:1px 6px;border-radius:8px;margin-left:6px;font-weight:700}

  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:40px;
  padding:8px 14px;display:flex;gap:4px;align-items:center;box-shadow:0 10px 30px rgba(58,53,46,.14);

.pbtn{cursor:pointer;border:none;background:transparent;font-family:'Shippori Mincho',serif;

.pbtn:hover{color:var(--acc)}
.pbtn.on{background:var(--ink);color:#fff}
#pager .sep{width:1px;height:18px;background:rgba(58,53,46,.14);margin:0 4px;flex:none}
#pager .lbl{font-size:10.5px;color:var(--ink2);white-space:nowrap;padding:0 6px}

/* ---------- 미니맵 (실측) ---------- */
#mini{position:fixed;left:20px;bottom:20px;z-index:10;width:196px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:16px;
  padding:12px 14px 10px;box-shadow:0 10px 30px rgba(58,53,46,.14)}
#mini .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#mini .mt{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink)}
#mini .north{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
#mini .north svg{display:block;transition:transform .1s linear}
#mini svg.map{display:block;width:100%;height:auto;background:var(--cream);border-radius:10px}
#mini .ms{font-size:10px;color:var(--ink2);margin-top:6px;text-align:right}
#mini .mdot{cursor:pointer}
@media(max-width:900px){#mini{display:none}}

/* ---------- 안내 ---------- */
#hint{position:fixed;right:20px;bottom:20px;z-index:9;font-size:11px;color:var(--ink2);
  background:rgba(255,255,255,.85);border-radius:12px;padding:8px 12px;line-height:1.7;
  box-shadow:0 6px 20px rgba(58,53,46,.1)}
#hint b{color:var(--ink)}

@media(max-width:900px){
  #head{top:12px;left:12px;padding:14px 16px 12px;width:min(320px,calc(100vw - 24px))}
  #head .dayNo{font-size:30px}
  #head h1{font-size:16px}
  #chips{display:none}
  #panel{display:none}
  #hint{display:none}
  #pager{bottom:12px}
}
</style>

function haversineKm(a, b) {
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLat = toR(b[0] - a[0]), dLng = toR(b[1] - a[1]);
  const s = Math.sin(dLat/2)**2 + Math.cos(toR(a[0])) * Math.cos(toR(b[0])) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

/* 위경도 → 디오라마 평면 (북=-z, 동=+x). 장거리는 sqrt 압축 + 겹침 방지 */
function layoutStopsGeo(di) {
  const geo = GEO[di];
  const cLat = geo.reduce((s, g) => s + g[0], 0) / geo.length;
  const cLng = geo.reduce((s, g) => s + g[1], 0) / geo.length;
  const kx = 111.32 * Math.cos(cLat * Math.PI / 180), kz = 110.54;
  let pts = geo.map(g => ({x: (g[1] - cLng) * kx, z: -(g[0] - cLat) * kz}));
  const maxR = Math.max(...pts.map(p => Math.hypot(p.x, p.z)), 1e-6);
  // 방향 유지 + 거리 sqrt 압축 → 반경 22 안으로
  pts = pts.map(p => {
    const r = Math.hypot(p.x, p.z);
    if (r < 1e-9) return {x: 0, z: 0};
    const nr = Math.sqrt(r / maxR) * 22;
    return {x: p.x / r * nr, z: p.z / r * nr};
  });
  // 최소 간격 확보 (실제 방향은 유지하며 살짝 밀어냄)
  const MIN = 5.2;
  for (let it = 0; it < 80; it++) {
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      let dx = pts[j].x - pts[i].x, dz = pts[j].z - pts[i].z;
      let d = Math.hypot(dx, dz);
      if (d >= MIN) continue;
      if (d < 1e-6) { dx = Math.cos(i + j); dz = Math.sin(i + j); d = 1; }
      const push = (MIN - d) / 2 / d;
      pts[i].x -= dx * push; pts[i].z -= dz * push;
      pts[j].x += dx * push; pts[j].z += dz * push;
    }
  }
  // 중심 재정렬
  const mx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
  const mz = pts.reduce((s, p) => s + p.z, 0) / pts.length;
  return pts.map(p => new THREE.Vector3(p.x - mx, 0, p.z - mz));
}

function disposeWorld() {
  world.traverse(n => {
    if (n.isCSS2DObject) n.element.remove();
    if (n.geometry && !Object.values(G).includes(n.geometry)) n.geometry.dispose();
    if (n.material) (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => m.dispose());
  });
  world.clear();
  markers = [];
  peoples = [];
  landmarkGroup = null;
}

/* 랜드마크 자리: 스팟들과 가장 먼 방향 자동 선택 */
function findLandmarkPos(stopPts, radius) {
  let best = null, bestScore = -1;
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * Math.PI * 2;
    const x = Math.cos(a) * radius, z = Math.sin(a) * radius;
    const score = Math.min(...stopPts.map(p => Math.hypot(x - p.x, z - p.z)));
    if (score > bestScore) { bestScore = score; best = new THREE.Vector3(x, 0, z); }
  }
  return best;
}

function buildRoad(points) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => p.clone()));
  const samples = curve.getPoints(220);
  const W = 2.4;
  const pos = [], idx = [];
  for (let i = 0; i < samples.length; i++) {
    const p = samples[i];
    const t2 = samples[Math.min(i + 1, samples.length - 1)].clone().sub(samples[Math.max(i - 1, 0)]).normalize();
    const nx = -t2.z, nz = t2.x;
    pos.push(p.x + nx * W, 0.06, p.z + nz * W, p.x - nx * W, 0.06, p.z - nz * W);
  }
  for (let i = 0; i < samples.length - 1; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const road = new THREE.Mesh(g, mat(0xf8f4ea));
  road.receiveShadow = true;
  world.add(road);
  return curve;
}

function addTree(x, z, s = 1) {
  const g = new THREE.Group();
  g.add(mesh(G.cyl, mat(0x9a7350), 0.16 * s, 0.9 * s, 0.16 * s, 0, 0.45 * s, 0));
  const fol = mesh(G.ico, mat(pick(GREENS), {flatShading: true}), 0.95 * s, 1.15 * s, 0.95 * s, 0, 1.55 * s, 0);
  g.add(fol);
  g.position.set(x, 0, z);
  g.rotation.y = rnd(0, Math.PI * 2);
  world.add(g);
}

function addBuilding(x, z, big = false) {
  const w = rnd(2.4, 4.2) * (big ? 1.4 : 1);
  const d = rnd(2.4, 4.2) * (big ? 1.4 : 1);
  const h = big ? rnd(4, 9) : rnd(1.6, 4.2);
  const wall = pick(WALLS);
  const b = mesh(G.box, mat(wall), w, h, d, x, h / 2, z);
  world.add(b);
  if (Math.random() < 0.68) {
    const rh = rnd(0.8, 1.6);
    const roof = mesh(G.cone4, mat(pick(ROOFS), {flatShading: true}),
      Math.hypot(w, d) * 0.62, rh, Math.hypot(w, d) * 0.62, x, h + rh / 2, z);
    roof.rotation.y = Math.PI / 4;
    world.add(roof);
  } else {
    world.add(mesh(G.box, mat(0xcfc6b4), w + 0.25, 0.22, d + 0.25, x, h + 0.11, z));
  }
}

function addMarker(stop, i, p, total) {
  const g = new THREE.Group();
  const col = stop.eat ? 0xc0392b : 0xe8734a;
  const pin = new THREE.Group();
  const head = mesh(G.sph, mat(col, {roughness: 0.55}), 0.55, 0.55, 0.55, 0, 2.15, 0);
  const tip = mesh(G.cone, mat(col, {roughness: 0.55}), 0.34, 1.0, 0.34, 0, 1.35, 0);
  tip.rotation.x = Math.PI;
  pin.add(head, tip);
  pin.name = 'pin';
  g.add(pin);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.15, 26),
    new THREE.MeshBasicMaterial({color: col, transparent: true, opacity: 0.22, depthWrite: false}));
  disc.rotation.x = -Math.PI / 2;

  const lbl = new CSS2DObject(el);
  lbl.position.set(0, 3.1, 0);

  g.position.copy(p);
  world.add(g);
  markers.push({group: g, chipEl: el, stop, idx: i, pos: p.clone(), pin});
}

function buildDiorama(day) {
  disposeWorld();

  // 대지
  const ground = new THREE.Mesh(new THREE.CircleGeometry(85, 48), mat(0xcfe0c0));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  world.add(ground);
  for (let i = 0; i < 10; i++) {
    const patch = new THREE.Mesh(new THREE.CircleGeometry(rnd(5, 12), 22),
      mat(Math.random() < 0.5 ? 0xc4d8b2 : 0xd8e6c8));
    patch.rotation.x = -Math.PI / 2;
    patch.position.set(rnd(-55, 55), 0.02, rnd(-55, 55));
    patch.receiveShadow = true;
    world.add(patch);
  }

  const stopPts = layoutStopsGeo(dayIdx);
  roadCurve = buildRoad(stopPts);

  // 랜드마크 (후지산은 크기가 커서 더 멀리 · 스팟과 안 겹치는 방향 자동)
  landmarkGroup = new THREE.Group();
  LM[day.landmark](landmarkGroup);
  const isFuji = day.landmark === 'fuji';
  const lmPos = findLandmarkPos(stopPts, isFuji ? 34 : 21);
  const lmClear = isFuji ? 22 : 13;
  landmarkGroup.position.copy(lmPos);
  world.add(landmarkGroup);
  const lmEl = document.createElement('div');
  lmEl.className = 'lmChip';
  lmEl.textContent = day.lmName;
  const lmLbl = new CSS2DObject(lmEl);
  lmLbl.position.set(0, day.landmark === 'fuji' ? 11.5 : 14, 0);
  landmarkGroup.add(lmLbl);

  // 건물: 도로/랜드마크 피해서
  const roadSamples = roadCurve.getPoints(60);
  const clearOf = (x, z, r) => {
    if (Math.hypot(x - lmPos.x, z - lmPos.z) < lmClear) return false;
    for (const s of roadSamples) if (Math.hypot(x - s.x, z - s.z) < r) return false;
    return true;
  };
  for (let gx = -46; gx <= 46; gx += 6.2) {
    for (let gz = -46; gz <= 46; gz += 6.2) {
      const x = gx + rnd(-1.6, 1.6), z = gz + rnd(-1.6, 1.6);
      if (Math.hypot(x, z) > 62) continue;
      if (!clearOf(x, z, 5.4)) continue;
      const roll = Math.random();
      if (roll < 0.52) addBuilding(x, z, Math.random() < 0.12);
      else if (roll < 0.8) addTree(x, z, rnd(0.8, 1.5));
    }
  }
  // 도로변 나무
  for (let i = 0; i < 14; i++) {
    const s = roadSamples[(Math.random() * roadSamples.length) | 0];
    const a = rnd(0, Math.PI * 2);
    addTree(s.x + Math.cos(a) * rnd(3.4, 4.6), s.z + Math.sin(a) * rnd(3.4, 4.6), rnd(0.7, 1.1));
  }

  // 사람들
  for (let i = 0; i < 16; i++) addPerson(roadCurve);

  // 구름
  for (let i = 0; i < 6; i++) {
    const c = new THREE.Group();
    const n = 3 + (Math.random() * 3 | 0);
    for (let k = 0; k < n; k++) {
      c.add(mesh(G.sph, mat(0xffffff, {roughness: 1}), rnd(1.6, 2.8), rnd(1, 1.5), rnd(1.4, 2.2),
        k * rnd(1.4, 2.2) - n, rnd(-0.3, 0.3), rnd(-0.6, 0.6), false));
    }
    c.position.set(rnd(-45, 45), rnd(24, 34), rnd(-45, 45));
    c.name = 'cloud';
    c.userData.spd = rnd(0.3, 0.8);
    world.add(c);
  }

  // 마커
  day.stops.forEach((s, i) => addMarker(s, i, stopPts[i].clone().add(new THREE.Vector3(rnd(-0.5, 0.5), 0, 0)), day.stops.length));
}

const cam = {az: Math.PI * 0.28, el: 0.62, zoom: 1, focus: new THREE.Vector3(), focusTarget: new THREE.Vector3()};
function updateCamera() {
  const d = 90;
  const y = Math.sin(cam.el) * d;
  const r = Math.cos(cam.el) * d;
  camera.position.set(
    cam.focus.x + Math.cos(cam.az) * r,
    y,
    cam.focus.z + Math.sin(cam.az) * r
  );
  camera.lookAt(cam.focus.x, 0, cam.focus.z);
  camera.left = -viewSize * AR(); camera.right = viewSize * AR();
  camera.top = viewSize; camera.bottom = -viewSize;
  camera.zoom = cam.zoom;
  camera.updateProjectionMatrix();
}

let dragging = false, moved = 0, px = 0, py = 0;
sceneEl.addEventListener('pointerdown', e => { dragging = true; moved = 0; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  moved += Math.abs(dx) + Math.abs(dy);
  px = e.clientX; py = e.clientY;
  cam.az -= dx * 0.005;
  cam.el = Math.max(0.3, Math.min(1.15, cam.el + dy * 0.004));
});
addEventListener('wheel', e => {
  cam.zoom = Math.max(0.55, Math.min(2.6, cam.zoom * (1 - e.deltaY * 0.0011)));
}, {passive: true});

/* 실측 미니맵 (선형 축척 = 진짜 지도 비율) */
function buildMinimap(di) {
  const geo = GEO[di];
  const cLat = geo.reduce((s, g) => s + g[0], 0) / geo.length;
  const kx = 111.32 * Math.cos(cLat * Math.PI / 180), kz = 110.54;
  const cLng = geo.reduce((s, g) => s + g[1], 0) / geo.length;
  const pts = geo.map(g => ({x: (g[1] - cLng) * kx, y: -(g[0] - cLat) * kz}));
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX - minX, 0.001), spanY = Math.max(maxY - minY, 0.001);
  const W = 168, H = 118, pad = 16;
  const sc = Math.min((W - pad * 2) / spanX, (H - pad * 2) / spanY);
  const ox = (W - spanX * sc) / 2, oy = (H - spanY * sc) / 2;
  const P = pts.map(p => ({x: ox + (p.x - minX) * sc, y: oy + (p.y - minY) * sc}));

  let svg = `<polyline points="${P.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}"
    fill="none" stroke="#d8ccb8" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>`;
  P.forEach((p, k) => {
    svg += `<circle class="mdot" data-k="${k}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6.5" fill="#e8734a"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y + 3).toFixed(1)}" text-anchor="middle" font-size="8.5"
        font-weight="700" fill="#fff" pointer-events="none">${k + 1}</text>`;
  });
  document.getElementById('miniSvg').innerHTML = svg;
  document.querySelectorAll('#miniSvg .mdot').forEach(c =>
    c.addEventListener('click', () => selectStop(+c.dataset.k, true)));

  let total = 0;
  for (let k = 1; k < geo.length; k++) total += haversineKm(geo[k - 1], geo[k]);
  document.getElementById('miniScale').textContent =
    total >= 10 ? `하루 이동 약 ${Math.round(total)} km` : `하루 이동 약 ${total.toFixed(1)} km`;
}

function loadDay(i) {
  dayIdx = i;
  const day = DAYS[i];
  buildDiorama(day);

  document.getElementById('hNo').textContent = day.no;
  document.getElementById('hTitle').textContent = day.t;
  document.getElementById('hRegion').textContent = `${day.d} · ${day.region}`;
  document.getElementById('pCount').textContent = `${day.stops.length}곳`;
  plbl.textContent = day.d;

  document.getElementById('chips').innerHTML = day.stops.map((s, k) =>
    `<button class="chip" type="button"><span class="t">${s.time}</span>${s.name}</button>`).join('');
  document.querySelectorAll('#chips .chip').forEach((c, k) => c.onclick = () => selectStop(k, true));

  document.getElementById('pList').innerHTML = day.stops.map((s, k) =>
    `<div class="row ${s.eat ? 'eat' : ''}"><div class="tm">${s.time}</div><div class="nm">${s.name}</div></div>`).join('');
  document.querySelectorAll('#pList .row').forEach((r, k) => r.onclick = () => selectStop(k, true));

  document.querySelectorAll('.pbtn').forEach((b, k) => b.classList.toggle('on', k === i));

  buildMinimap(i);

  cam.focus.set(0, 0, 0);
  cam.focusTarget.set(0, 0, 0);
  cam.zoom = 1;
  selectStop(0, false);
}

addEventListener('keydown', e => {
  if (e.code === 'ArrowRight') selectStop(Math.min(selIdx + 1, DAYS[dayIdx].stops.length - 1), true);
  if (e.code === 'ArrowLeft') selectStop(Math.max(selIdx - 1, 0), true);
  if (e.code === 'ArrowUp') loadDay(Math.max(dayIdx - 1, 0));
  if (e.code === 'ArrowDown') loadDay(Math.min(dayIdx + 1, DAYS.length - 1));
});

/* ============ 루프 ============ */
const clock = new THREE.Clock();
const northArrow = document.getElementById('northArrow');
const _pa = new THREE.Vector3(), _pb = new THREE.Vector3();
function tick() {
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta ? 0.016 : 0.016, 0.05);

  cam.focus.lerp(cam.focusTarget, 0.06);
  updateCamera();

  // 나침반: 화면상 북쪽 방향
  _pa.set(cam.focus.x, 0, cam.focus.z).project(camera);
  _pb.set(cam.focus.x, 0, cam.focus.z - 1).project(camera);
  northArrow.style.transform = `rotate(${Math.atan2(_pb.x - _pa.x, _pb.y - _pa.y)}rad)`;

  // 핀 바운스
  markers.forEach((m, i) => {
    const isSel = i === selIdx;
    const bounce = isSel ? Math.abs(Math.sin(t * 3.2)) * 0.5 : Math.sin(t * 1.8 + i) * 0.08;
    m.pin.position.y = bounce;
    const s = isSel ? 1.25 : 1;
    m.pin.scale.set(s, s, s);
  });

  // 사람들 산책
  if (roadCurve) {
    peoples.forEach(p => {
      p.t = (p.t + p.spd * 0.016 + 1) % 1;
      const pos = roadCurve.getPointAt(p.t);
      const tan = roadCurve.getTangentAt(p.t);
      p.g.position.set(pos.x - tan.z * p.off * 0.5, 0, pos.z + tan.x * p.off * 0.5);
      p.g.rotation.y = Math.atan2(tan.x * Math.sign(p.spd), tan.z * Math.sign(p.spd));
      p.g.position.y = Math.abs(Math.sin(t * 9 + p.off * 10)) * 0.05;
    });
  }

  // 구름 & 관람차
  world.children.forEach(c => {
    if (c.name === 'cloud') {
      c.position.x += c.userData.spd * 0.016;
      if (c.position.x > 55) c.position.x = -55;
    }
  });
  if (landmarkGroup) {
    const w = landmarkGroup.getObjectByName('wheelSpin');
    if (w) w.rotation.z = t * 0.25;
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  updateCamera();
});

loadDay(1);
updateCamera();
tick();
</script>
