<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>도쿄 산책 · 스타듀 픽셀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --wood-dark:#5c3418;--wood-mid:#8a5528;--wood-light:#c48a48;
  --parchment:#fcebc4;--parchment-deep:#f0d49a;--ink:#3d2914;
  --leaf:#3d7a3c;--leaf-light:#6aaa58;--sky:#7eb6d8;--gold:#e8b848;
  --ember:#d06038;--cream:#fff6e0;
}
html,body{height:100%;overflow:hidden;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%,#c8e4f4 0%,transparent 55%),
    linear-gradient(180deg,#87b8d8 0%,#a8c878 38%,#6a9a58 72%,#4a7840 100%)}
body{font-family:'Galmuri11','Galmuri9',monospace;-webkit-user-select:none;user-select:none;color:var(--ink)}
canvas{display:block;image-rendering:pixelated}

/* 스타듀식 나무 프레임 패널 */
.panel{
  position:fixed;background:var(--parchment);
  border:5px solid var(--wood-dark);border-radius:0;
  box-shadow:
    inset 0 0 0 3px var(--wood-light),
    inset 0 0 0 6px var(--wood-mid),
    0 6px 0 rgba(60,40,20,.4);
}

#hud{top:14px;left:14px;padding:14px 16px 12px;max-width:260px;z-index:10}
#hud .day{
  font-size:11px;color:var(--cream);letter-spacing:1px;
  background:var(--wood-mid);display:inline-block;padding:3px 10px;
  border:2px solid var(--wood-dark);margin-bottom:2px;
  box-shadow:inset 0 1px 0 var(--wood-light)}
#hud h1{font-size:16px;color:var(--ink);margin:8px 0 10px;line-height:1.35}
#hud ol{list-style:none;display:flex;flex-direction:column;gap:4px}
#hud li{font-size:12px;color:#8a7060;display:flex;gap:7px;align-items:baseline;cursor:pointer;
  padding:3px 4px;border-radius:0}
#hud li:hover{background:rgba(196,138,72,.2)}
#hud li .tm{font-size:10px;width:34px;flex:none;color:var(--wood-mid)}
#hud li.cur{color:var(--ember);font-weight:700;background:rgba(224,96,56,.12)}
#hud li.done{color:var(--leaf)}
#hud li.done .nm::after{content:' ✓'}
#days{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;padding-top:10px;
  border-top:2px solid var(--wood-light)}
#days button{font-family:inherit;font-size:11px;padding:6px 10px;
  border:3px solid var(--wood-dark);border-radius:0;
  background:linear-gradient(180deg,var(--cream),var(--parchment-deep));
  cursor:pointer;color:var(--ink);
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(60,40,20,.3)}
#days button.cur{background:linear-gradient(180deg,#e07048,var(--ember));border-color:var(--wood-dark);color:#fff}
#days button:disabled{opacity:.35;cursor:default}

#topPill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px}
.pill{font-size:11px;background:var(--wood-mid);color:var(--gold);padding:8px 14px;
  border:3px solid var(--wood-dark);border-radius:0;text-decoration:none;
  box-shadow:inset 0 1px 0 var(--wood-light),0 3px 0 rgba(60,40,20,.35)}
a.pill.alt{background:var(--parchment);color:var(--ink)}

.wood-btn{
  font-family:inherit;cursor:pointer;border:4px solid var(--wood-dark);border-radius:0;
  box-shadow:inset 0 0 0 2px var(--wood-light),0 4px 0 rgba(60,40,20,.35);
  color:#fff}
.wood-btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--wood-light),0 2px 0 rgba(60,40,20,.35)}

#autoBtn{position:fixed;right:14px;top:14px;z-index:10;font-size:13px;padding:11px 16px;
  background:linear-gradient(180deg,#e07048,var(--ember))}
#autoBtn.on{background:linear-gradient(180deg,#6aaa58,var(--leaf))}
#bgmBtn{position:fixed;right:14px;top:66px;z-index:10;font-size:12px;padding:8px 12px;
  background:linear-gradient(180deg,var(--cream),var(--parchment-deep));color:var(--ink)}
#bgmBtn.off{opacity:.55}
#prog{position:fixed;top:116px;right:14px;z-index:10;font-size:11px;
  background:var(--parchment);color:var(--ink);padding:7px 12px;
  border:3px solid var(--wood-dark);border-radius:0;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--wood-light),0 3px 0 rgba(60,40,20,.3)}

/* 대화창 — 스타듀 하단 박스 */
#dlg{left:50%;transform:translateX(-50%);bottom:18px;width:min(660px,92vw);
  padding:18px 22px 16px;z-index:20;display:none;min-height:120px}
#dlg .name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;
  padding-bottom:6px;border-bottom:2px solid var(--wood-light)}
#dlg .name .tm{color:var(--ember);margin-right:8px}
#dlg .name .eat{font-size:10px;background:var(--ember);color:#fff;border-radius:0;
  padding:2px 7px;margin-left:8px;vertical-align:2px;border:2px solid var(--wood-dark)}
#dlg .body{font-size:14px;line-height:1.85;min-height:44px;color:var(--ink)}
#dlg .via{margin-top:10px;font-size:12px;line-height:1.55;color:#2a5a88;
  background:rgba(126,182,216,.18);border:2px solid #7eb6d8;padding:8px 10px;display:none}
#dlg .via.show{display:block}
#dlg .tip{margin-top:8px;font-size:12px;line-height:1.55;color:var(--leaf);
  background:rgba(61,122,60,.12);border:2px solid var(--leaf-light);padding:8px 10px;display:none}
#dlg .tip.show{display:block}
#dlg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#dlg .acts a,#dlg .acts button{font-family:inherit;font-size:12px;padding:9px 14px;border-radius:0;
  border:3px solid var(--wood-dark);text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,var(--cream),var(--parchment-deep));cursor:pointer;
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(60,40,20,.25);-webkit-tap-highlight-color:transparent}
#dlg .acts a.maps{background:linear-gradient(180deg,#6a9ec8,#3a6a98);color:#fff}
#dlg .acts button.ok{background:linear-gradient(180deg,#f0d060,var(--gold));font-weight:700}
#dlg .next{position:absolute;right:16px;bottom:12px;font-size:14px;color:var(--ember);
  animation:bob .7s infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(3px)}}

#sleep{position:fixed;inset:0;z-index:40;
  background:linear-gradient(180deg,#1a2840 0%,#3a2a48 40%,#8a4a38 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .7s}
#sleep.show{opacity:1;pointer-events:auto}
#sleep .z{font-size:46px;animation:bob 1.1s infinite}
#sleep .t{color:var(--gold);font-size:22px;text-align:center;text-shadow:0 2px 0 #3a2010}
#sleep .s{color:#e8d8c0;font-size:13px;text-align:center;line-height:1.8;padding:0 20px}

/* 지하철/버스/택시 탑승 컷신 */
#ride{position:fixed;inset:0;z-index:35;display:none;pointer-events:auto;
  background:#121820}
#ride.show{display:block}
#ride canvas{width:100%;height:100%;display:block;image-rendering:pixelated}

#hint{position:fixed;left:14px;bottom:14px;z-index:9;font-size:11px;color:var(--cream);
  background:rgba(92,52,24,.72);padding:8px 12px;border:2px solid var(--wood-light);line-height:1.7}

#toast{left:50%;transform:translateX(-50%);bottom:64px;z-index:18;padding:14px 20px;
  font-size:13px;color:var(--ink);text-align:center;animation:tpop .5s ease}
#toast b{color:var(--ember)}
@keyframes tpop{from{opacity:0;transform:translateX(-50%) translateY(10px)}}

#pad{position:fixed;left:0;right:0;bottom:0;z-index:16;display:none;pointer-events:none;
  padding:0 14px 14px;align-items:flex-end;justify-content:space-between}
#dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);
  gap:4px;pointer-events:auto}
#dpad button,#abtn{font-family:inherit;font-size:20px;
  background:linear-gradient(180deg,var(--cream),var(--parchment-deep));
  border:4px solid var(--wood-dark);border-radius:0;color:var(--ink);touch-action:none;
  -webkit-tap-highlight-color:transparent;
  box-shadow:inset 0 0 0 2px var(--wood-light),0 3px 0 rgba(60,40,20,.35);pointer-events:auto}
#dpad button:active,#abtn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--wood-light),0 1px 0 rgba(60,40,20,.35)}
#dpad .u{grid-area:1/2}#dpad .l{grid-area:2/1}#dpad .r{grid-area:2/3}#dpad .d{grid-area:3/2}
#abtn{width:72px;height:72px;border-radius:0;
  background:linear-gradient(180deg,#e07048,var(--ember));color:#fff;font-size:22px;font-weight:700;
  margin-bottom:28px}
#abtn small{display:block;font-size:10px;font-weight:400;opacity:.85}

#mStops{display:none;position:fixed;left:10px;right:10px;bottom:196px;z-index:12;
  overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:2px 0 4px}
#mStops::-webkit-scrollbar{display:none}
#mStops button{flex:none;font-family:inherit;font-size:11px;padding:8px 12px;border-radius:0;
  border:3px solid var(--wood-dark);background:var(--parchment);color:var(--ink);white-space:nowrap;
  box-shadow:inset 0 0 0 2px var(--wood-light),0 2px 0 rgba(60,40,20,.3)}
#mStops button.done{background:#a8d080;color:#1a3a1a}
#mStops button.cur{background:var(--ember);color:#fff}

@media (max-width:900px),(pointer:coarse){
  #pad{display:flex}
  #mStops{display:flex}
  #hint{display:none}
  #hud{max-width:min(230px,60vw);padding:10px 12px;top:52px;left:10px}
  #hud ol{display:none}
  #autoBtn{top:auto;bottom:248px;right:14px;font-size:12px;padding:10px 12px}
  #bgmBtn{top:auto;bottom:300px;right:14px}
  #prog{top:auto;bottom:344px;right:14px}
  #dlg{bottom:248px;width:min(92vw,520px);padding:12px 14px 12px}
  #toast{bottom:250px;font-size:12px;max-width:88vw}
  #topPill{top:8px;max-width:96vw;flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  #dlg .next,#sleep .z{animation:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="topPill">
  <span class="pill">🌾 도쿄 산책 데이</span>
  <a class="pill alt" href="/">디오라마 ↗</a>
  <a class="pill alt" href="/map">실제 지도 ↗</a>
</div>

<div id="hud" class="panel">
  <div class="day" id="hudDay"></div>
  <h1 id="hudTitle"></h1>
  <ol id="stopList"></ol>
  <div id="days"></div>
</div>

<button id="autoBtn" class="wood-btn">▶ 자동 여행</button>
<button id="bgmBtn" class="wood-btn" type="button" title="배경음악">♪ BGM</button>
<div id="prog">방문 0/0</div>

<div id="dlg" class="panel">
  <div class="name" id="dlgName"></div>
  <div class="body" id="dlgBody"></div>
  <div class="via" id="dlgVia"></div>
  <div class="tip" id="dlgTip"></div>
  <div class="acts" id="dlgActs" hidden>
    <a class="maps" id="dlgMaps" target="_blank" rel="noopener">Maps 길찾기</a>
    <button type="button" class="ok" id="dlgOk">다음 ▼</button>
    <button type="button" id="dlgCancel" hidden>나중에</button>
  </div>
  <div class="next" id="dlgNext" hidden>▼</div>
</div>

<div id="sleep"></div>
<div id="ride"><canvas id="rideCv"></canvas></div>

<div id="hint">방향키/WASD 이동 · 지도 클릭 이동 · 스페이스 = 확인/탑승/대화<br>마을 역에서 A → 목적지 선택 · 스팟에서 A → 일정 보기 · 주민 옆에서 A/스페이스 → 대화 · 하루 끝은 숙소에서</div>

<div id="toast" class="panel">주인공은 <b>규빈</b> · 뒤따라오는 파란 친구는 <b>작애</b>!<br>마을 역에서 <b>A</b> → 목적지 선택 · 스팟에서 <b>A</b> → 일정 보기 🌱</div>

<div id="pad">
  <div id="dpad">
    <button class="u" type="button" data-d="0,-1" aria-label="위">▲</button>
    <button class="l" type="button" data-d="-1,0" aria-label="왼쪽">◀</button>
    <button class="r" type="button" data-d="1,0" aria-label="오른쪽">▶</button>
    <button class="d" type="button" data-d="0,1" aria-label="아래">▼</button>
  </div>
  <button id="abtn" type="button" aria-label="확인">A<small>확인/탑승</small></button>
</div>
<div id="mStops"></div>

<script type="module">
import { DAYS, haversineKm, projectDay } from './js/data.js';

const TILE = 16, SCALE = 3, TS = TILE * SCALE;
const DUR = 165;
const NPC_DUR = 420; // 주민은 한 칸을 더 천천히
const LAST_DAY = DAYS.length - 1;

/* ═══ 스타듀×픽셀 팔레트 (밝은 목가) ═══ */
const PAL = {
  grassLight: '#90c050',
  grassDark:  '#6a9a38',
  grassHilite:'#b8e078',
  grassDeep:  '#4e7a28',
  pathLight:  '#e0c888',
  pathDark:   '#c4a868',
  pathEdge:   '#a88848',
  waterLight: '#58a8d0',
  waterDark:  '#3a80a8',
  waterHilite:'#a0d8f0',
  stoneLight: '#d0c8b0',
  stoneDark:  '#a09880',
  stoneMid:   '#b8b098',
  autumnLight:'#e8a838',
  autumnMid:  '#d87828',
  autumnDeep: '#b85018',
  treeDark:   '#2e6a30',
  treeMid:    '#3e8a40',
  treeLight:  '#58a850',
  treeHilite: '#88d070',
  trunk:      '#8a5a28',
  trunkDark:  '#5a3a18',
  outline:    '#2a2010',
  uiPaper:    '#fcebc4',
  uiBorder:   '#5c3418',
  accentRed:  '#d06038',
  roofRed:    '#a84828',
  roofDark:   '#6a2818',
  wallCream:  '#f0e0b8',
  wallShade:  '#d0b888',
  wood:       '#8a5a28',
  woodDark:   '#5a3a18',
  gold:       '#e8b848',
  winGlass:   '#3888a8',
  winHilite:  '#b0e0f0',
  fujiSnow:   '#f0f4f8',
  fujiMid:    '#7890a8',
  fujiBase:   '#486070',
  sky:        '#7eb6d8',
};

/* ═══ 시간대 (저장하지 않고 날짜 진입 시 설정) ═══ */
const TIME_TINTS = {
  midnight: { overlay: 'rgba(20,20,60,0.42)', ambient: 0.55 },
  dawn:     { overlay: 'rgba(255,170,120,0.18)', ambient: 0.8 },
  morning:  { overlay: 'rgba(255,255,255,0)', ambient: 1.0 },
  noon:     { overlay: 'rgba(255,255,255,0)', ambient: 1.05 },
  sunset:   { overlay: 'rgba(255,120,60,0.22)', ambient: 0.85 },
  evening:  { overlay: 'rgba(40,30,80,0.35)', ambient: 0.6 },
};
let currentTime = 'morning';

// 화면에 표시하는 DAY 번호 기준. save.day는 0부터 시작한다.
const START_TIME_BY_DAY = {
  1: 'midnight', // 하네다 심야 도착
  2: 'morning',
  3: 'morning',
  4: 'dawn', // 황거 새벽 러닝
  5: 'noon',
  6: 'dawn', // 후지산 새벽 조망
};

/* ═══ 저장 ═══ */
const SAVE_KEY = 'tokyo-pixel-v4';
let save;
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null') || {}; } catch { save = {}; }
save.day = Math.min(save.day || 0, LAST_DAY);
save.unlocked = LAST_DAY; // 일차는 언제든 자유롭게 이동
save.visited = save.visited || {};
function persist() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }

/* ═══ 현재 맵 상태 (loadDay가 채움) ═══ */
let dayIdx = 0, DAY = DAYS[0];
let W = 0, H = 0, g = null, BLD = [], TRIG = [], ZONES = [], STN_LABELS = [], STATIONS = [], RAILS = [];
let metroTrains = [];
let blocked = new Set(), bldCache = new Map();
let trees = [];
let npcs = [], npcBlocked = new Set();
let waterTiles = [], waterTileLookup = new Map();
let visited = new Set(), target = 0, lastTrig = -1;
let auto = false, queue = [], manualQueue = [], clickTarget = null, pendingWarp = null;
let boardPending = null; // 자동여행: 역으로 걸어간 뒤 탑승할 스팟 인덱스
let ride = null; // 탑승 컷신 상태
const rideEl = document.getElementById('ride');
const rideCv = document.getElementById('rideCv');
const rideCtx = rideCv.getContext('2d');
rideCtx.imageSmoothingEnabled = false;

const walkable = (x, y) => {
  if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) return false;
  const t = g[y][x];
  if (t === 3 || t === 4 || t === 6) return false;
  return !blocked.has(y * W + x) && !npcBlocked.has(y * W + x);
};

/* ═══ 맵 빌더 ═══ */
function grid(w, h) { return Array.from({ length: h }, () => new Array(w).fill(0)); }
function mkRect(gr, x, y, w, h, v) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (gr[j] && gr[j][i] !== undefined) gr[j][i] = v;
}
function borderTrees(gr, w, h) {
  for (let i = 0; i < w; i++) { gr[0][i] = 4; gr[h - 1][i] = 4; }
  for (let j = 0; j < h; j++) { gr[j][0] = 4; gr[j][w - 1] = 4; }
}
function scatter(gr, w, h, n, seed0) {
  let seed = seed0;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let k = 0; k < n; k++) {
    const x = 1 + (rnd() * (w - 2)) | 0, y = 1 + (rnd() * (h - 2)) | 0;
    if (gr[y][x] === 0) gr[y][x] = rnd() < .38 ? 4 : 5;
  }
}
const isTransit = (via, stop) => {
  if (stop && (stop.mode === 'bus' || stop.mode === 'taxi')) return true;
  return !!via && /선|JR|버스|환승|택시|지하철|전철|유리카모메|케이큐|게이큐|고속버스/.test(via);
};

/** via 문자열에서 실제 역 이름들 추출 (…역) */
function extractStations(via) {
  if (!via) return [];
  const out = [];
  const re = /([가-힣A-Za-z0-9]+)역/g;
  let m;
  while ((m = re.exec(via))) {
    const n = m[1];
    if (n && !out.includes(n)) out.push(n);
  }
  return out;
}
function extractLine(via) {
  if (!via) return '지하철';
  const m = via.match(/(히비야선|긴자선|야마노테|게이힌토호쿠|소부선|마루노우치선|치요다선|미타선|난보쿠선|오에도선|오이도선|유리카모메|케이큐|게이큐|도에이[^→\s]*선|도쿄메트로[^→\s]*선|JR\s*[^→]*|고속버스)/);
  if (!m) return /버스/.test(via) ? '버스' : /택시/.test(via) ? '택시' : '지하철';
  return m[1].replace(/\s*\/.*/, '').trim();
}
function stationLabel(via, fallback) {
  const names = extractStations(via);
  return (names[0] || fallback || '역') + '역';
}

/** 랜드마크별 건물 스타일 — 이름에서 특징 추출 */
function styleFor(name) {
  if (/공항|하네다/.test(name)) return { s: 'airport', w: 7, h: 3 };
  if (/택시/.test(name)) return { s: 'taxi', w: 3, h: 2 };
  if (/센소지|나카미세/.test(name)) return { s: 'temple', w: 6, h: 4 };
  if (/몬자/.test(name)) return { s: 'monja', w: 3, h: 3 };
  if (/스즈키|말차|젤라토/.test(name)) return { s: 'matcha', w: 3, h: 3 };
  if (/아메요코/.test(name)) return { s: 'market', w: 4, h: 2 };
  if (/아키하바라/.test(name)) return { s: 'akihabara', w: 4, h: 5 };
  if (/우에노 공원|공원/.test(name) && !/해변|아쿠아/.test(name)) return { s: 'park', w: 4, h: 3 };
  if (/황거|러닝/.test(name)) return { s: 'palace', w: 5, h: 3 };
  if (/해변|해안/.test(name)) return { s: 'beach', w: 4, h: 2 };
  if (/teamLab|플래닛/.test(name)) return { s: 'teamlab', w: 4, h: 3 };
  if (/조이폴리스/.test(name)) return { s: 'joypolis', w: 4, h: 4 };
  if (/아쿠아시티/.test(name)) return { s: 'mall', w: 4, h: 3 };
  if (/가조엔/.test(name)) return { s: 'gajoen', w: 4, h: 4 };
  if (/모리미술관|시티뷰/.test(name)) return { s: 'tower', w: 3, h: 6 };
  if (/야키니쿠|토도로키|히로키야/.test(name)) return { s: 'yakiniku', w: 3, h: 3 };
  if (/스시/.test(name)) return { s: 'sushi', w: 3, h: 3 };
  if (/AFURI|라멘/.test(name)) return { s: 'ramen', w: 3, h: 3 };
  if (/호토/.test(name)) return { s: 'hotspring', w: 3, h: 3 };
  if (/로손/.test(name)) return { s: 'lawson', w: 3, h: 2 };
  if (/로프웨이/.test(name)) return { s: 'ropeway', w: 3, h: 4 };
  if (/버스|→/.test(name)) return { s: 'bus', w: 4, h: 2 };
  if (/후지산|일출/.test(name)) return { s: 'fuji', w: 8, h: 5 };
  if (/Section|숙소|료칸|온천|가이세키/.test(name)) return { s: 'hotel', w: 5, h: 3 };
  if (/신주쿠|카와구치코/.test(name) && !/로손|로프|호토|일출|후지/.test(name)) return { s: 'station', w: 4, h: 2 };
  return { s: 'shopR', w: 2, h: 2 };
}

function shortStationFallback(name) {
  return (name || '역').replace(/\s*·.*/, '').replace(/^숙소 복귀\s*/, '')
    .replace(/^Section L\s*/, '').replace(/^점심\s*/, '').slice(0, 6) || '역';
}
/** 노선색 — 지도 위 안내선용으로 채도 낮춘 톤 */
function lineColor(line) {
  if (/히비야/.test(line)) return '#8a8878';
  if (/긴자/.test(line)) return '#b8905a';
  if (/야마노테/.test(line)) return '#7ea058';
  if (/소부|게이힌/.test(line)) return '#c0a060';
  if (/유리카모메/.test(line)) return '#68a8c0';
  if (/난보쿠|미타|오에도/.test(line)) return '#4a70a0';
  if (/버스|고속/.test(line)) return '#b86058';
  if (/택시/.test(line)) return '#c8b060';
  return '#5a78a0';
}
function vehicleKind(line) {
  if (/택시/.test(line || '')) return 'taxi';
  if (/버스|고속/.test(line || '')) return 'bus';
  return 'metro';
}
/** 일정 스팟 자체가 택시 승차 포인트인 경우 (별도 택시 정류장·라벨 중복 방지) */
function isVehicleStop(s) {
  if (!s) return false;
  if (s.mode === 'taxi') return true;
  return /(정액\s*)?택시/.test(s.name || '');
}
/** 정류장 라벨 — '택시 택시' 같은 중복 접미 제거 */
function stationTag(name, vk) {
  const n = (name || '').trim();
  if (vk === 'taxi') return /택시/.test(n) ? n : n + ' 택시';
  if (vk === 'bus') return /버스/.test(n) ? n : n + ' 버스';
  return /역$/.test(n) ? n : n + '역';
}
/** L자 선로 셀 목록 */
function railCells(x0, y0, x1, y1) {
  const pts = [];
  const seen = new Set();
  const add = (x, y) => {
    const k = y * 4096 + x;
    if (seen.has(k)) return;
    seen.add(k); pts.push([x, y]);
  };
  let x = x0, y = y0;
  add(x, y);
  const sx = Math.sign(x1 - x0) || 0;
  while (x !== x1) { x += sx; add(x, y); }
  const sy = Math.sign(y1 - y0) || 0;
  while (y !== y1) { y += sy; add(x, y); }
  return pts;
}

/** 위경도 → 타일 맵 (실측 상대 위치 유지, 플레이 가능하게 최소 간격) */
function buildGeoMap(di) {
  const day = DAYS[di], n = day.stops.length;
  const proj = projectDay(day);
  const rel = proj.stops.map(s => ({
    x: s.km.x - proj.center.x,
    z: s.km.z - proj.center.z
  }));

  let minX = Math.min(...rel.map(p => p.x));
  let maxX = Math.max(...rel.map(p => p.x));
  let minZ = Math.min(...rel.map(p => p.z));
  let maxZ = Math.max(...rel.map(p => p.z));
  if (maxX - minX < 0.08) { minX -= 0.2; maxX += 0.2; }
  if (maxZ - minZ < 0.08) { minZ -= 0.2; maxZ += 0.2; }

  const spanX = maxX - minX, spanZ = maxZ - minZ;
  // 포켓몬 마을·스타듀 타운처럼 한 화면에 밀도가 느껴지도록 압축
  const inner = Math.max(26, Math.min(40, Math.round(day.layoutSpan || 34)));
  const pad = 5;
  const w = inner + pad * 2, h = inner + pad * 2;
  const scale = inner / Math.max(spanX, spanZ);

  const pts = rel.map(p => ({
    x: pad + (p.x - minX) * scale,
    y: pad + (p.z - minZ) * scale
  }));

  // 스팟이 겹치지 않을 정도만 벌림 — 넓은 들판이 되지 않게
  const minGap = 6;
  for (let iter = 0; iter < 80; iter++) {
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
      let d = Math.hypot(dx, dy) || 0.01;
      if (d < minGap) {
        const push = (minGap - d) * 0.55;
        dx /= d; dy /= d;
        pts[i].x -= dx * push; pts[i].y -= dy * push;
        pts[j].x += dx * push; pts[j].y += dy * push;
      }
    }
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const spots = pts.map(p => ({
    x: clamp(Math.round(p.x), pad, w - pad - 1),
    y: clamp(Math.round(p.y), pad, h - pad - 1)
  }));
  // 같은 좌표(숙소 출발·복귀 등)는 살짝 벌려 트리거가 겹치지 않게
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < i; j++) {
      if (spots[i].x !== spots[j].x || spots[i].y !== spots[j].y) continue;
      const dx = (i % 2 === 0 ? 1 : -1) * (2 + (i % 3));
      const dy = (i % 2 === 0 ? -1 : 1) * (2 + ((i + 1) % 3));
      spots[i].x = clamp(spots[j].x + dx, pad, w - pad - 1);
      spots[i].y = clamp(spots[j].y + dy, pad, h - pad - 1);
    }
  }
  // 반올림 후에도 최소 타일 간격 유지
  for (let iter = 0; iter < 40; iter++) {
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = spots[j].x - spots[i].x, dy = spots[j].y - spots[i].y;
      let d = Math.hypot(dx, dy) || 0.01;
      if (d < 5) {
        const push = Math.ceil((5 - d) / 2);
        const sx = Math.sign(dx) || (i % 2 ? 1 : -1);
        const sy = Math.sign(dy) || (j % 2 ? 1 : -1);
        spots[i].x = clamp(spots[i].x - sx * push, pad, w - pad - 1);
        spots[i].y = clamp(spots[i].y - sy * push, pad, h - pad - 1);
        spots[j].x = clamp(spots[j].x + sx * push, pad, w - pad - 1);
        spots[j].y = clamp(spots[j].y + sy * push, pad, h - pad - 1);
      }
    }
  }

  const gr = grid(w, h);
  // 마을 큰길처럼 조금 더 두껍게
  const pave = (x0, y0, x1, y1) => {
    const mx = x0;
    mkRect(gr, Math.min(x0, mx), y0, Math.abs(mx - x0) + 1, 3, 1);
    mkRect(gr, mx, Math.min(y0, y1), 3, Math.abs(y1 - y0) + 1, 1);
    mkRect(gr, Math.min(mx, x1), y1, Math.abs(x1 - mx) + 1, 3, 1);
  };
  const paintedWater = new Map();
  const paintWater = (x0, y0, ww, hh) => {
    for (let j = y0; j < y0 + hh; j++) for (let i = x0; i < x0 + ww; i++) {
      if (!gr[j] || gr[j][i] === undefined) continue;
      if (gr[j][i] === 1 || gr[j][i] === 2) continue; // 도로는 유지
      gr[j][i] = 3;
      paintedWater.set(j * w + i, { x: i, y: j, w: 1, h: 1 });
    }
  };
  const covers = (b, tx, ty) => tx >= b.x && tx < b.x + b.w && ty >= b.y && ty < b.y + b.h;
  const placeBld = (bx, by, bw, bh, s) => {
    let x = clamp(bx, 1, w - bw - 1);
    let y = clamp(by, 1, h - bh - 1);
    const b = { x, y, w: bw, h: bh, s };
    // 트리거와 겹치면 위/아래로 밀어냄
    for (let guard = 0; guard < 8; guard++) {
      const hit = trig.find(([tx, ty]) => covers(b, tx, ty));
      if (!hit) break;
      const [tx, ty] = hit;
      if (ty - bh >= 1) b.y = ty - bh;
      else b.y = clamp(ty + 1, 1, h - bh - 1);
      b.x = clamp(b.x, 1, w - bw - 1);
    }
    bld.push(b);
    return b;
  };

  for (let i = 0; i < n; i++) {
    const { x, y } = spots[i];
    mkRect(gr, x - 1, y - 1, 3, 3, 2);
    if (i > 0) pave(spots[i - 1].x, spots[i - 1].y, x, y);
  }

  const bld = [], trig = [], stns = [], lbl = [], zones = [], rails = [];
  day.stops.forEach((s, i) => {
    const { x, y } = spots[i];
    trig.push([x, y]);
  });

  // 스팟 건물 배치
  day.stops.forEach((s, i) => {
    const { x, y } = spots[i];
    const st = styleFor(s.name);
    let by = y - st.h;
    if (by < 2) by = y + 2;
    const bx = x - (st.w >> 1);
    placeBld(bx, by, st.w, st.h, st.s);
  });

  // ── 하루 1개 허브 역: 시작 스팟 근처, 갈 수 있는 교통 일정을 모두 등록 ──
  const hops = [];
  day.stops.forEach((s, i) => {
    if (i === 0) return;
    if (isVehicleStop(s)) return;

    let fromStop = i - 1;
    let useVia = isTransit(s.via, s) ? s.via
      : ((day.stops[i - 1].mode === 'bus' || day.stops[i - 1].mode === 'taxi') ? day.stops[i - 1].via : s.via);
    if (isVehicleStop(day.stops[i - 1]) && i >= 2) {
      fromStop = i - 2;
      useVia = day.stops[i - 1].via || s.via || useVia;
    }
    const longHop = haversineKm(day.stops[fromStop], s) >= 3;
    if (!(isTransit(useVia, s) || (longHop && isTransit(useVia, day.stops[fromStop])))) return;
    const names = extractStations(useVia);
    const fromName = names[0] || shortStationFallback(day.stops[fromStop].name);
    const toName = names.length > 1 ? names[names.length - 1] : (names[0] || shortStationFallback(s.name));
    const line = extractLine(useVia);
    const vk = vehicleKind(line);
    hops.push({ from: fromName, to: toName, line, toStop: i, fromStop, kind: vk });
  });

  if (hops.length) {
    const kinds = hops.map(h => h.kind);
    const vk = kinds.every(k => k === 'bus') ? 'bus'
      : kinds.every(k => k === 'taxi') ? 'taxi' : 'metro';
    const hubName = (() => {
      const region = (day.region.split(/[·→]/)[0] || '').trim();
      if (region && region.length <= 6) return region;
      return shortStationFallback(day.stops[0].name) || '마을';
    })();

    let hall = null;
    if (vk === 'taxi') {
      const taxiBld = bld.find(b => b.s === 'taxi' || b.s === 'taxiStand');
      if (taxiBld) hall = taxiBld;
    }
    if (!hall) {
      const sp0 = spots[0];
      let ax = clamp(sp0.x + 4, pad, w - pad - 5);
      let ay = clamp(sp0.y - 5, pad, h - pad - 4);
      for (let guard = 0; guard < 24; guard++) {
        let hit = spots.some(sp => Math.hypot(ax + 2 - sp.x, ay + 1.5 - sp.y) < 5);
        if (!hit) break;
        ax = clamp(ax + ((guard & 1) ? 2 : -2), pad, w - pad - 5);
        ay = clamp(ay + ((guard & 2) ? 2 : -2), pad, h - pad - 4);
      }
      const style = vk === 'bus' ? 'busStop' : vk === 'taxi' ? 'taxiStand' : 'station';
      hall = placeBld(ax, ay, vk === 'metro' ? 4 : 3, vk === 'metro' ? 3 : 2, style);
      mkRect(gr, hall.x, hall.y + hall.h, hall.w, 2, 2);
      // 허브만 라벨
      if (vk === 'metro') lbl.push([hall.x + hall.w / 2, hall.y - 0.45, hubName + '역']);
      else if (vk === 'bus') lbl.push([hall.x + hall.w / 2, hall.y - 0.45, hubName + ' 버스']);
    } else {
      mkRect(gr, hall.x, hall.y + hall.h, hall.w, 2, 2);
    }
    hall.name = hubName;
    hall.routes = [];
    hall.lines = new Set();
    hall.vKind = vk;
    stns.push(hall);

    // 허브 → 스팟 짧은 보도 + 장식용 안내선(역↔역 복수 선로 없음)
    const hubDoor = [hall.x + (hall.w >> 1), hall.y + hall.h];
    mkRect(gr, Math.min(spots[0].x, hubDoor[0]), Math.min(spots[0].y, hubDoor[1]), 1, Math.abs(spots[0].y - hubDoor[1]) + 1, 1);
    mkRect(gr, Math.min(spots[0].x, hubDoor[0]), hubDoor[1], Math.abs(spots[0].x - hubDoor[0]) + 1, 1, 1);

    const seenDest = new Set();
    for (const hop of hops) {
      if (seenDest.has(hop.toStop)) continue;
      seenDest.add(hop.toStop);
      hall.routes.push({
        toStop: hop.toStop, toName: hop.to, line: hop.line,
        fromStop: hop.fromStop, kind: hop.kind
      });
      hall.lines.add(hop.line);
    }
    hall.lines = [...hall.lines];
    // 허브 앞 짧은 안내선 1개만 (여러 역↔역 선로 대신)
    const tip = spots[hops[0].toStop] || spots[0];
    const short = railCells(hubDoor[0], hubDoor[1], tip.x, tip.y).slice(0, 5);
    if (short.length >= 2) {
      rails.push({
        cells: short, line: hops[0].line, color: lineColor(hops[0].line),
        kind: vk, from: hubName, to: hops[0].to,
        fromPos: hubDoor, toPos: [tip.x, tip.y]
      });
    }
  }

  // 포켓몬식 중간 건물 — 길 옆에 촘촘히, 들판 랜덤 배치는 최소
  {
    let seed = 91 + di * 17;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const styles = ['house', 'houseB', 'shopR', 'shopG', 'house'];
    const blocked = (bx, by, bw, bh) => {
      for (const b of bld) {
        if (bx < b.x + b.w + 1 && bx + bw + 1 > b.x && by < b.y + b.h + 1 && by + bh + 1 > b.y) return true;
      }
      for (const [tx, ty] of trig) {
        if (tx >= bx - 1 && tx < bx + bw + 1 && ty >= by - 1 && ty < by + bh + 1) return true;
      }
      return false;
    };
    const tryPlace = (bx, by, style) => {
      bx = clamp(bx | 0, 2, w - 4); by = clamp(by | 0, 2, h - 4);
      if (blocked(bx, by, 2, 2)) return;
      if (gr[by] && (gr[by][bx] === 3 || gr[by][bx] === 4)) return;
      placeBld(bx, by, 2, 2, style);
    };
    for (let i = 1; i < n; i++) {
      const path = railCells(spots[i - 1].x, spots[i - 1].y, spots[i].x, spots[i].y);
      for (let k = 4; k < path.length - 4; k += 5) {
        const [px, py] = path[k];
        const side = (k + i) % 2 ? 1 : -1;
        tryPlace(px + side * 2, py - 2, styles[(k + i) % styles.length]);
        if (rnd() < 0.3) tryPlace(px - side * 2, py + 1, styles[(k + 2) % styles.length]);
      }
    }
    for (let t = 0; t < 6; t++) {
      const bx = 3 + (rnd() * (w - 8)) | 0;
      const by = 3 + (rnd() * (h - 8)) | 0;
      if (gr[by] && gr[by][bx] !== 0) continue;
      tryPlace(bx, by, styles[t % styles.length]);
    }
  }

  if (day.landmark === 'fuji' || day.theme === 'fuji') {
    placeBld((w >> 1) - 4, 1, 8, 5, 'fuji');
    paintWater(2, h - 5, w - 4, 3);
  }
  if (day.theme === 'odaiba' || day.landmark === 'wheel') {
    paintWater(1, h - 4, w - 2, 3);
    placeBld(w - 8, h - 10, 5, 6, 'wheel');
  }
  if (day.theme === 'asakusa') {
    paintWater(w - 5, 2, 3, h - 8);
  }
  if (day.landmark === 'pagoda' && !bld.some(b => b.s === 'pagoda')) {
    const t = bld.find(b => b.s === 'temple');
    if (t) placeBld(t.x - 3, t.y, 3, 4, 'pagoda');
  }
  if (day.landmark === 'tower' && !bld.some(b => b.s === 'tower')) {
    placeBld((w >> 1) - 1, 2, 3, 6, 'tower');
  }

  // 트리거·도로 위 나무/물 제거 후 발판 재포장
  for (let i = 0; i < n; i++) {
    const { x, y } = spots[i];
    mkRect(gr, x - 1, y - 1, 3, 3, 2);
    if (i > 0) pave(spots[i - 1].x, spots[i - 1].y, x, y);
  }
  // 건물이 트리거를 덮으면 최종 한 번 더 밀어냄
  for (const [tx, ty] of trig) {
    for (const b of bld) {
      if (!covers(b, tx, ty)) continue;
      if (ty - b.h >= 1) b.y = ty - b.h;
      else b.y = clamp(ty + 1, 1, h - b.h - 1);
      b.x = clamp(b.x, 1, w - b.w - 1);
    }
  }

  const regionLabel = (day.region.split(/[·→]/)[0] || day.jp).trim();
  zones.push([regionLabel, spots[0]?.x ?? (w >> 1), Math.max(3, (spots[0]?.y ?? 8) - 4)]);

  borderTrees(gr, w, h);
  scatter(gr, w, h, 16, 13 + di);
  // 스폰/트리거 발판은 나무에 덮이지 않게
  for (const [x, y] of trig) mkRect(gr, x - 1, y - 1, 3, 3, 2);
  for (let i = 1; i < n; i++) pave(spots[i - 1].x, spots[i - 1].y, spots[i].x, spots[i].y);

  return {
    W: w, H: h, g: gr, BLD: bld, TRIG: trig, ZONES: zones,
    STN_LABELS: lbl, STATIONS: stns, RAILS: rails,
    // 최종 도로·발판으로 덮인 물 칸은 반짝임에서도 제외한다.
    waterTiles: [...paintedWater.values()].filter(tile => gr[tile.y][tile.x] === 3),
    spawn: [trig[0][0], trig[0][1]]
  };
}

/* ═══ 일차별 주민 — 화면의 DAY 번호 기준, stop은 일정의 0 기반 인덱스 ═══ */
/* DAY 1 한산. DAY 2~ 등장. roam:true → 맵 배회.
 * bags는 잡담·이야기·팁을 모아 두고, 말 걸 때마다 풀에서 랜덤으로 한 줄만 꺼낸다. */
const NPC_BY_DAY = {
  2: [
    { stop: 1, name: '나카미세 상인', bags: [

/* ═══ 나무 — 16px 안에 들어가는 계단식 잎 덩어리 ═══ */
function renderTree(q, x, y, variant = 0) {
  const r = (dx, dy, w, h, col) => {
    q.fillStyle = col;
    q.fillRect((x + dx) | 0, (y + dy) | 0, w, h);
  };
  const autumn = variant < 7; // 10종 중 7종은 단풍, 3종은 초록
  const dark = autumn ? PAL.autumnDeep : PAL.treeDark;
  const mid = autumn ? PAL.autumnMid : PAL.treeMid;
  const light = autumn ? PAL.autumnLight : PAL.treeHilite;
  // 정수 좌표의 가로줄로 원을 채워 안티앨리어싱을 피한다.
  const blob = (cx, cy, radius, col) => {
    for (let dy = -radius; dy <= radius; dy++) {
      const half = Math.floor(Math.sqrt(radius * radius - dy * dy));
      r(cx - half, cy + dy, half * 2 + 1, 1, col);
    }
  };
  r(6, 10, 3, 6, PAL.trunk);
  r(6, 10, 1, 6, PAL.trunkDark);
  const lift = variant % 2;
  blob(7, 6, 5, dark);
  blob(4, 8 - lift, 4, dark);
  blob(11, 8, 4, dark);
  blob(7 + lift, 4, 4, mid);
  blob(4, 6 - lift, 3, mid);
  blob(11, 6, 3, mid);
  blob(6, 3, 2, light);
  r(3, 5, 2, 1, light);
  r(10, 5 + variant % 3, 2, 1, light);
}

// 작은 투명 스프라이트를 재사용해 매 프레임 나무를 다시 만들지 않는다.
const treeSprites = Array.from({ length: 10 }, (_, variant) => {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  renderTree(c.getContext('2d'), 0, 0, variant);
  return c;
});

  } else if (b.s === 'fuji') {
    // GBC식 3단 색 밴드 (눈 → 산허리 → 기슭)
    q.clearRect(0, 0, WPX, HPX);
    const bands = [
      { t0: 0, t1: .28, col: PAL.fujiSnow },
      { t0: .28, t1: .62, col: PAL.fujiMid },
      { t0: .62, t1: 1, col: PAL.fujiBase },
    ];
    for (let y = 0; y < HPX; y++) {
      const t = y / HPX;
      const half = (WPX / 2) * Math.max(t, 0.04);
      const band = bands.find(bd => t >= bd.t0 && t < bd.t1) || bands[2];
      q.fillStyle = band.col;
      q.fillRect(WPX / 2 - half, y, half * 2, 1);
    }
    for (const edge of [.28, .62]) {
      const y = (edge * HPX) | 0;
      const half = (WPX / 2) * edge;
      q.fillStyle = '#3a4858';
      q.fillRect(WPX / 2 - half, y, half * 2, 1);
    }
    r(WPX / 2 - 4, 0, 8, 3, '#f0f4f8');
    r(WPX / 2 - 2, 0, 4, 1, '#fff');

  strokeOuterOutline(q, WPX, HPX);
  return c;
}

/** 바깥 실루엣만 1px outline (창문은 내부 구멍이라 제외) */
function strokeOuterOutline(q, WPX, HPX) {
  const src = q.getImageData(0, 0, WPX, HPX);
  const s = src.data;
  const opaque = (x, y) => {
    if (x < 0 || y < 0 || x >= WPX || y >= HPX) return false;
    return s[(y * WPX + x) * 4 + 3] > 10;
  };
  const ext = new Uint8Array(WPX * HPX);
  const stack = [];
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= WPX || y >= HPX) return;
    const i = y * WPX + x;
    if (ext[i] || opaque(x, y)) return;
    ext[i] = 1;
    stack.push(i);
  };
  for (let x = 0; x < WPX; x++) { push(x, 0); push(x, HPX - 1); }
  for (let y = 0; y < HPX; y++) { push(0, y); push(WPX - 1, y); }
  while (stack.length) {
    const i = stack.pop();
    const x = i % WPX, y = (i / WPX) | 0;
    push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
  }
  for (let y = 0; y < HPX; y++) {
    for (let x = 0; x < WPX; x++) {
      if (!opaque(x, y)) continue;
      const i = y * WPX + x;
      const onEdge = x === 0 || y === 0 || x === WPX - 1 || y === HPX - 1;
      const touchExt = (x > 0 && ext[i - 1]) || (x < WPX - 1 && ext[i + 1])
        || (y > 0 && ext[i - WPX]) || (y < HPX - 1 && ext[i + WPX]);
      if (onEdge || touchExt) {
        const o = i * 4;
        s[o] = 0x2a; s[o + 1] = 0x28; s[o + 2] = 0x22; s[o + 3] = 255;
      }
    }
  }
  q.putImageData(src, 0, 0);
}

/* ═══ 캐릭터 ═══ */
let bounce = 0;
/** 실루엣을 outline 1px로 먼저 찍고 본색을 덮는다 (GBC 외곽선) */
function paintOutlined(ctx, sx, sy, u, rects) {
  const paint = (ox, oy, col) => {
    for (const [x, y, w, h, c] of rects) {
      ctx.fillStyle = col || c;
      ctx.fillRect(sx + (x + ox) * u, sy + (y - 6 + oy) * u, w * u, h * u);
    }
  };
  for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) paint(ox, oy, PAL.outline);
  paint(0, 0);
}

function drawChar(ctx, sx, sy, dir, frame, p, tag) {
  const u = Math.max(4, SCALE + 1);
  const rects = [];
  const r = (x, y, w, h, col) => { rects.push([x, y, w, h, col]); };
  // 그림자는 외곽선 없이
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(sx + 3 * u, sy + (17 - 6) * u, 10 * u, 2 * u);
  if (frame === 0) { r(5, 12, 3, 4, p.pants); r(8, 12, 3, 4, p.pants); }
  else { r(4, 12, 3, 4, p.pants); r(9, 12, 3, 4, p.pants); }
  r(4, 8, 8, 5, p.dress || p.shirt);
  if (p.dress) r(3, 11, 10, 3, p.dress);
  r(3, 9, 1, 3, p.skin); r(12, 9, 1, 3, p.skin);
  r(4, 3, 8, 5, p.skin);
  r(4, 1, 8, 3, p.hair);
  r(3, 2, 1, 4, p.hair); r(12, 2, 1, 4, p.hair);
  if (p.long) { r(2, 3, 2, 7, p.hair); r(12, 3, 2, 7, p.hair); }
  if (p.cap) { r(4, 0, 8, 3, p.cap); if (dir === 'down') r(3, 2, 10, 1, p.cap); }
  if (dir === 'down') { r(6, 5, 1, 2, PAL.outline); r(9, 5, 1, 2, PAL.outline); }
  else if (dir === 'left') r(5, 5, 1, 2, PAL.outline);
  else if (dir === 'right') r(10, 5, 1, 2, PAL.outline);
  paintOutlined(ctx, sx, sy, u, rects);
  if (tag) {
    ctx.font = `bold ${Math.max(11, SCALE * 3.5)}px Galmuri11, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const tw = ctx.measureText(tag).width;
    const bx = sx + 7 * u - tw / 2 - 4, by = sy - 2 * u;
    ctx.fillStyle = 'rgba(208,96,56,.95)';
    ctx.fillRect(bx, by - 14, tw + 8, 16);
    ctx.fillStyle = '#5c3418';
    ctx.fillRect(bx, by - 14, tw + 8, 2);
    ctx.fillStyle = '#fff';
    ctx.fillText(tag, sx + 7 * u, by);
    ctx.fillStyle = '#d06038';
    ctx.beginPath();
    const ax = sx + 7 * u, ay = by + 2 + Math.sin(bounce / 160) * 3;
    ctx.moveTo(ax - 5, ay); ctx.lineTo(ax + 5, ay); ctx.lineTo(ax, ay + 7);
    ctx.closePath(); ctx.fill();
  }
}
/* 작애 (JAKAE) — 고퀄 GBC 스프라이트 (사진 턴어라운드 기준) */
function drawJakae(ctx, sx, sy, dir, frame, p, tag) {
  // 사람보다 한 체급 작게 (발은 타일 바닥에 맞춤)
  const uHuman = Math.max(4, SCALE + 1);
  const u = Math.max(2, SCALE - 1);
  sy += (uHuman - u) * 8;
  const rects = [];
  const r = (x, y, w, h, col) => { rects.push([x, y, w, h, col]); };
  // 타원 그림자
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(sx + 2 * u, sy + (18 - 6) * u, 12 * u, 2 * u);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(sx + 4 * u, sy + (17 - 6) * u, 8 * u, 1 * u);

  const walk = frame === 1;
  const bob = walk ? 1 : ((bounce / 400 | 0) % 2);
  const armL = walk ? 1 : 0;
  const armR = walk ? 0 : 1;

  // ── 통통한 빨간 신발 + 흰 스트랩 ──
  const shoe = (x, y) => {
    r(x, y, 5, 3, p.shoe);
    r(x, y, 5, 1, p.shoeHilite);
    r(x + 1, y + 1, 3, 1, p.strap);
    r(x + 2, y + 1, 1, 1, p.buckle);
    r(x, y + 2, 5, 1, p.sole);
  };
  if (!walk) { shoe(3, 15); shoe(8, 15); }
  else { shoe(2, 15); shoe(9, 16); }

  // ── 짧은 다리 ──
  if (!walk) { r(5, 13, 2, 2, p.blue); r(9, 13, 2, 2, p.blue); }
  else { r(4, 13, 2, 2, p.blue); r(10, 13, 2, 1, p.blue); }

  // ── 통통한 몸 + 둥근 배 ──
  r(4, 9, 8, 5, p.blue);
  r(3, 10, 1, 3, p.blue); r(12, 10, 1, 3, p.blue);
  r(4, 9, 8, 1, p.blueHilite);
  r(5, 10, 6, 4, p.belly);
  r(6, 10, 4, 1, p.bellyHilite);
  r(6, 12, 2, 1, p.bellyHilite);

  // ── 짧은 팔 + 통통한 흰 ──
  r(2, 10 + armL, 2, 2, p.blue);
  r(12, 10 + armR, 2, 2, p.blue);
  r(1, 11 + armL, 3, 3, p.glove);
  r(12, 11 + armR, 3, 3, p.glove);
  r(1, 11 + armL, 3, 1, p.gloveCuff);
  r(12, 11 + armR, 3, 1, p.gloveCuff);

  const hy = bob;

  if (dir === 'up') {
    // 등: 부드러운 둥근 가시 3개
    r(4, 3 + hy, 8, 7, p.blue);
    r(3, 5 + hy, 2, 4, p.blue); r(11, 5 + hy, 2, 4, p.blue);
    r(5, 1 + hy, 3, 4, p.quill);
    r(7, 0 + hy, 3, 4, p.quill);
    r(9, 1 + hy, 3, 4, p.quill);
    r(6, 0 + hy, 1, 2, p.blueHilite); r(8, 0 + hy, 1, 2, p.blueHilite);
    r(5, 9 + hy, 6, 1, p.blueShade);
  } else if (dir === 'left') {
    r(6, 3 + hy, 6, 7, p.blue);
    r(10, 1 + hy, 3, 3, p.quill);
    r(11, 3 + hy, 3, 3, p.quill);
    r(11, 6 + hy, 2, 2, p.quill);
    r(10, 1 + hy, 1, 1, p.blueHilite);
    r(8, 2 + hy, 2, 2, p.blue); r(8, 3 + hy, 1, 1, p.earIn);
    r(3, 5 + hy, 5, 4, p.muzzle);
    r(3, 5 + hy, 5, 1, p.muzzleHilite);
    r(3, 7 + hy, 1, 1, p.nose);
    r(4, 8 + hy, 2, 1, p.smile);
    r(5, 4 + hy, 3, 3, p.eyeWhite);
    r(5, 4 + hy, 2, 2, p.eye);
    r(5, 4 + hy, 1, 1, p.pupil);
    r(6, 4 + hy, 1, 1, p.spark);
    r(5, 8 + hy, 2, 1, p.blush);
  } else if (dir === 'right') {
    r(4, 3 + hy, 6, 7, p.blue);
    r(3, 1 + hy, 3, 3, p.quill);
    r(2, 3 + hy, 3, 3, p.quill);
    r(3, 6 + hy, 2, 2, p.quill);
    r(5, 1 + hy, 1, 1, p.blueHilite);
    r(6, 2 + hy, 2, 2, p.blue); r(7, 3 + hy, 1, 1, p.earIn);
    r(8, 5 + hy, 5, 4, p.muzzle);
    r(8, 5 + hy, 5, 1, p.muzzleHilite);
    r(12, 7 + hy, 1, 1, p.nose);
    r(10, 8 + hy, 2, 1, p.smile);
    r(8, 4 + hy, 3, 3, p.eyeWhite);
    r(9, 4 + hy, 2, 2, p.eye);
    r(10, 4 + hy, 1, 1, p.pupil);
    r(9, 4 + hy, 1, 1, p.spark);
    r(9, 8 + hy, 2, 1, p.blush);
  } else {
    // 정면: 큰 둥근 머리 + 부드러운 가시 + 큰 눈 + 미소
    r(4, 2 + hy, 8, 7, p.blue);
    r(3, 3 + hy, 1, 5, p.blue); r(12, 3 + hy, 1, 5, p.blue);
    r(4, 2 + hy, 8, 2, p.blueHilite);
    r(5, 8 + hy, 6, 1, p.blueShade);
    // 둥근 가시 (짧고 통통)
    r(6, 0 + hy, 4, 3, p.quill);
    r(3, 0 + hy, 3, 3, p.quill); r(10, 0 + hy, 3, 3, p.quill);
    r(1, 2 + hy, 3, 3, p.quill); r(12, 2 + hy, 3, 3, p.quill);
    r(7, 0 + hy, 1, 1, p.blueHilite);
    r(4, 0 + hy, 1, 1, p.blueHilite); r(11, 0 + hy, 1, 1, p.blueHilite);
    // 귀
    r(3, 2 + hy, 2, 2, p.blue); r(11, 2 + hy, 2, 2, p.blue);
    r(4, 2 + hy, 1, 1, p.earIn); r(11, 2 + hy, 1, 1, p.earIn);
    // 통통한 주둥이
    r(5, 5 + hy, 6, 4, p.muzzle);
    r(5, 5 + hy, 6, 1, p.muzzleHilite);
    r(7, 6 + hy, 2, 1, p.nose);
    r(6, 8 + hy, 4, 1, p.smile);
    r(5, 8 + hy, 2, 1, p.blush); r(9, 8 + hy, 2, 1, p.blush);
    // 큰 둥근 눈 + 작은 동공
    r(4, 3 + hy, 3, 3, p.eyeWhite); r(9, 3 + hy, 3, 3, p.eyeWhite);
    r(4, 3 + hy, 3, 1, '#fff'); r(9, 3 + hy, 3, 1, '#fff');
    r(5, 3 + hy, 2, 2, p.eye); r(9, 3 + hy, 2, 2, p.eye);
    r(5, 4 + hy, 1, 1, p.pupil); r(10, 4 + hy, 1, 1, p.pupil);
    r(6, 3 + hy, 1, 1, p.spark); r(9, 3 + hy, 1, 1, p.spark);
  }

  paintOutlined(ctx, sx, sy, u, rects);

  if (tag) {
    ctx.font = `bold ${Math.max(10, SCALE * 3)}px Galmuri11, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const tw = ctx.measureText(tag).width;
    const bx = sx + 7 * u - tw / 2 - 4, by = sy - 2 * u;
    ctx.fillStyle = 'rgba(90,58,28,.94)';
    ctx.fillRect(bx, by - 12, tw + 8, 14);
    ctx.fillStyle = '#c48a48';
    ctx.fillRect(bx, by - 12, tw + 8, 2);
    ctx.fillStyle = '#fff';
    ctx.fillText(tag, sx + 7 * u, by);
    ctx.fillStyle = '#e8b848';
    ctx.beginPath();
    const ax = sx + 7 * u, ay = by + 2 + Math.sin(bounce / 160) * 2;
    ctx.moveTo(ax - 4, ay); ctx.lineTo(ax + 4, ay); ctx.lineTo(ax, ay + 5);
    ctx.closePath(); ctx.fill();
  }
}

/* ═══ 엔티티 ═══ */
function makeEnt(x, y) {
  return { x, y, fx: x, fy: y, px: x * TS, py: y * TS, dir: 'down', frame: 0, moving: false, t: 0 };
}
const me = makeEnt(2, 2), wife = makeEnt(3, 2), pet = makeEnt(4, 2);

// 일정 스팟 주변의 넓은 잔디·길에 배치. 고정 좌표보다 맵 크기 변화에 안전하다.
function placeNpcs(definitions) {
  for (const definition of definitions) {
    const anchor = TRIG[definition.stop] || TRIG[0];
    const candidates = [];
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      // 잔디(0)·보도(1)만 — 광장·건물·물 제외
      if (g[y][x] !== 0 && g[y][x] !== 1) continue;
      if (npcBlocked.has(y * W + x)) continue;
      if (TRIG.some(([tx, ty]) => Math.abs(tx - x) + Math.abs(ty - y) <= 2)) continue;
      if ([me, wife, pet].some(e => Math.abs(e.x - x) + Math.abs(e.y - y) <= 2)) continue;
      if (STATIONS.some(st => x >= st.x - 1 && x <= st.x + st.w &&
        y >= st.y - 1 && y <= st.y + st.h + 2)) continue;
      // 본인 칸 + 사방만 통행 가능하면 충분 (3×3 전면은 너무 빡셈)
      if (!walkable(x, y)) continue;
      let open = true;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        if (!walkable(x + dx, y + dy)) { open = false; break; }
      }
      if (!open) continue;
      candidates.push({ x, y, distance: Math.abs(anchor[0] - x) + Math.abs(anchor[1] - y) });
    }
    candidates.sort((a, b) => a.distance - b.distance);
    // 같은 스팟에 여러 명이면 가까운 후보를 조금씩 나눠 씀
    const pick = candidates.find((p, i) => {
      if (i < npcs.filter(n => n.stop === definition.stop).length) return false;
      if (findPath(me.x, me.y, p.x, p.y + 1).length) return true;
      if (findPath(me.x, me.y, p.x, p.y - 1).length) return true;
      if (findPath(me.x, me.y, p.x + 1, p.y).length) return true;
      return !!findPath(me.x, me.y, p.x - 1, p.y).length;
    }) || candidates[npcs.length % Math.max(1, candidates.length)] || candidates[0];
    if (!pick) continue;
    const pal = NPC_PALS[(definition.pal ?? npcs.length) % NPC_PALS.length];
    npcs.push({
      ...makeEnt(pick.x, pick.y),
      ...definition,
      lastLineIndex: -1,
      homeX: pick.x,
      homeY: pick.y,
      roam: !!definition.roam,
      path: [],
      wait: 600 + Math.random() * 1600,
      moveDur: NPC_DUR,
      pal
    });
    npcBlocked.add(pick.y * W + pick.x);
  }
}

function stepNpc(npc, nx, ny) {
  if (npc.moving || dlgOpen || ride) return false;
  if ([me, wife, pet].some(e => e.x === nx && e.y === ny)) return false;
  if (npcs.some(o => o !== npc && o.x === nx && o.y === ny)) return false;
  if (TRIG.some(([tx, ty]) => tx === nx && ty === ny)) return false;
  npcBlocked.delete(npc.y * W + npc.x);
  const ok = walkable(nx, ny);
  if (!ok) {
    npcBlocked.add(npc.y * W + npc.x);
    return false;
  }
  npc.dir = nx > npc.x ? 'right' : nx < npc.x ? 'left' : ny > npc.y ? 'down' : 'up';
  npc.fx = npc.x; npc.fy = npc.y;
  npc.x = nx; npc.y = ny;
  npc.moving = true; npc.t = 0;
  npcBlocked.add(ny * W + nx);
  return true;
}

function pickNpcWanderTarget(npc) {
  // 일정 스팟·허브·빈 길 중 먼 곳을 골라 맵 전체를 오가게 함
  const goals = [];
  for (const [tx, ty] of TRIG) {
    for (const [dx, dy] of [[0, 2], [0, -2], [2, 0], [-2, 0], [1, 1], [-1, 1]]) {
      const x = tx + dx, y = ty + dy;
      if (walkable(x, y) || (g[y] && (g[y][x] === 0 || g[y][x] === 1))) goals.push([x, y]);
    }
  }
  for (let t = 0; t < 12; t++) {
    const x = 2 + ((Math.random() * (W - 4)) | 0);
    const y = 2 + ((Math.random() * (H - 4)) | 0);
    goals.push([x, y]);
  }
  // 자기 칸을 잠깐 열어 길찾기
  npcBlocked.delete(npc.y * W + npc.x);
  let best = null, bestLen = 0;
  for (let i = 0; i < goals.length; i++) {
    const [gx, gy] = goals[(Math.random() * goals.length) | 0];
    if (!walkable(gx, gy)) continue;
    if (Math.abs(gx - npc.x) + Math.abs(gy - npc.y) < 6) continue;
    const p = findPath(npc.x, npc.y, gx, gy);
    if (p.length > bestLen) { bestLen = p.length; best = p; }
    if (bestLen >= 8) break;
  }
  npcBlocked.add(npc.y * W + npc.x);
  return best || [];
}

function updateNpcs(dt) {
  for (const npc of npcs) {
    updateEnt(npc, dt);
    if (!npc.roam || npc.moving || dlgOpen || ride) continue;

    if (npc.path && npc.path.length) {
      const [nx, ny] = npc.path.shift();
      if (!stepNpc(npc, nx, ny)) npc.path = [];
      else npc.wait = 220 + Math.random() * 280; // 칸 사이 여유
      continue;
    }

    npc.wait -= dt;
    if (npc.wait > 0) continue;
    npc.wait = 1400 + Math.random() * 2200; // 다시 출발하기 전 한숨

    if (Math.random() < 0.65) {
      const path = pickNpcWanderTarget(npc);
      if (path.length) {
        npc.path = path.slice(0, 14);
        continue;
      }
    }
    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    for (let i = dirs.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
    }
    for (const [dx, dy] of dirs) {
      if (stepNpc(npc, npc.x + dx, npc.y + dy)) break;
    }
  }
}

function step(ent, nx, ny) {
  if (ent.moving) return false;
  ent.dir = nx > ent.x ? 'right' : nx < ent.x ? 'left' : ny > ent.y ? 'down' : 'up';
  if (!walkable(nx, ny)) return false;
  ent.fx = ent.x; ent.fy = ent.y; ent.x = nx; ent.y = ny;
  ent.moving = true; ent.t = 0;
  return true;
}
function tryMove(dx, dy) {
  const px = me.x, py = me.y;
  me.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
  const wx0 = wife.x, wy0 = wife.y;
  if (step(me, me.x + dx, me.y + dy)) {
    if (wife.x !== px || wife.y !== py) step(wife, px, py);
    if (pet.x !== wx0 || pet.y !== wy0) step(pet, wx0, wy0);
    return true;
  }
  return false;
}
function tryMoveTo(nx, ny) { tryMove(nx - me.x, ny - me.y); }
function teleport(x, y) {
  me.x = me.fx = x; me.y = me.fy = y; me.px = x * TS; me.py = y * TS; me.moving = false;
  const wx = walkable(x + 1, y) ? x + 1 : (walkable(x - 1, y) ? x - 1 : x);
  wife.x = wife.fx = wx; wife.y = wife.fy = y;
  wife.px = wx * TS; wife.py = y * TS; wife.moving = false;
  const tx = walkable(wx + 1, y) ? wx + 1 : (walkable(x, y + 1) ? x : wx);
  const ty = (tx === x) ? y + 1 : y;
  pet.x = pet.fx = tx; pet.y = pet.fy = ty;
  pet.px = tx * TS; pet.py = ty * TS; pet.moving = false;
}

function findPath(sx, sy, tx, ty) {
  const prev = new Map(); const q = [[sx, sy]]; prev.set(sy * W + sx, null);
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) {
      const path = []; let k = ty * W + tx;
      while (k !== null) { path.unshift([k % W, (k / W) | 0]); k = prev.get(k); }
      path.shift(); return path;
    }
    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nx = x + dx, ny = y + dy, key = ny * W + nx;
      if (!prev.has(key) && walkable(nx, ny)) { prev.set(key, y * W + x); q.push([nx, ny]); }
    }
  }
  return [];
}

/** 같은 칸에 트리거가 여러 개일 때(숙소 출발/복귀) 올바른 인덱스 선택 */
function trigAt(x, y, loose = false) {
  const hit = [];
  for (let i = 0; i < TRIG.length; i++) {
    const [tx, ty] = TRIG[i];
    const d = Math.abs(tx - x) + Math.abs(ty - y);
    if (loose ? d <= 1 : d === 0) hit.push(i);
  }
  if (!hit.length) return -1;
  if (target < TRIG.length && hit.includes(target)) return target;
  return hit[hit.length - 1];
}

/** 현재 자동 목표로 가는 역사 앞 칸 */
function stationApproach() {
  let best = null, bestLen = Infinity;
  const pool = STATIONS.filter(st => (st.routes || []).some(r => r.toStop === target));
  const list = pool.length ? pool : STATIONS;
  for (const st of list) {
    const cands = [];
    for (let x = st.x; x < st.x + st.w; x++) {
      cands.push([x, st.y + st.h], [x, st.y - 1]);
    }
    for (let y = st.y; y < st.y + st.h; y++) {
      cands.push([st.x - 1, y], [st.x + st.w, y]);
    }
    for (const [x, y] of cands) {
      if (!walkable(x, y)) continue;
      if (x === me.x && y === me.y) return [x, y];
      const p = findPath(me.x, me.y, x, y);
      if (p.length && p.length < bestLen) { bestLen = p.length; best = [x, y]; }
    }
  }
  return best;
}

  const to = names.length > 1 ? names[names.length - 1] + '역' : (s.jp ? s.jp : s.name);
  const line = extractLine(s.via);
  const title = kind === 'taxi' ? '🚕 택시 탑승' : kind === 'bus' ? `🚌 ${from}` : `🚇 ${from}`;
  const ok = kind === 'taxi' ? '🚕 출발' : kind === 'bus' ? '🚌 출발' : '🚇 출발';
  const body = kind === 'metro'
    ? `${line} · ${from} → ${s.time} ${shortName(s)}`
    : (s.via || '다음 장소로 이동');
  openDialog(title, body, {

    tip: `다음 일정: ${s.time} ${s.name}`,

  });

function openHubMenu(st) {
  const routes = [];
  const seen = new Set();
  for (const r of st.routes || []) {
    if (seen.has(r.toStop)) continue;
    seen.add(r.toStop);
    routes.push(r);
  }
  routes.sort((a, b) => a.toStop - b.toStop);

  if (auto) {
    const r = routes.find(x => x.toStop === target) || routes[0];
    if (r) openBoardDialog(r.toStop);
    else openDialog(`🚇 ${st.name}`, '이 역에서 갈 수 있는 일정이 없어요.', { showOk: true });
    return;
  }

  if (!routes.length) {
    openDialog(`🚇 ${st.name}`, '이 역에서 갈 수 있는 일정이 없어요.', { showOk: true });
    return;
  }

  const icon0 = st.vKind === 'taxi' ? '🚕' : st.vKind === 'bus' ? '🚌' : '🚇';
  openDialog(`${icon0} ${st.name}${st.vKind === 'metro' ? '역' : ''}`, '어디로 갈까요?', {
    showOk: false, cancelable: true
  });
  dlgOk.style.display = 'none';
  dlgActs.hidden = false;
  dlgCancel.hidden = false;
  for (const r of routes) {
    const s = DAY.stops[r.toStop];
    if (!s) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.hubTo = String(r.toStop);
    const kind = r.kind || vehicleKind(r.line);
    const icon = kind === 'taxi' ? '🚕' : kind === 'bus' ? '🚌' : '🚇';
    btn.textContent = `${icon} ${s.time} ${shortName(s)}`;
    btn.addEventListener('pointerdown', e => {
      e.stopPropagation();
      openBoardDialog(r.toStop);
    });
    dlgActs.insertBefore(btn, dlgCancel);
  }
  dlgNext.hidden = true;
}

function rideKind(via) {
  if (/택시/.test(via || '')) return 'taxi';
  if (/버스|고속버스/.test(via || '')) return 'bus';
  return 'metro';
}

function startRide(destIdx) {
  const s = DAY.stops[destIdx];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const names = extractStations(s.via);
  const from = names[0] ? names[0] + '역' : stationLabel(s.via, '출발');
  const to = names.length > 1 ? names[names.length - 1] + '역' : stationLabel(s.via, shortStationFallback(s.name));
  ride = {
    dest: destIdx,
    via: s.via || '',
    name: s.name,
    time: s.time,
    kind: rideKind(s.via),
    line: extractLine(s.via),
    fromStn: from,
    toStn: to,
    t: 0,
    dur: reduced ? 900 : 4800
  };
  resizeRide();
  rideEl.classList.add('show');
}

function finishRide() {
  if (!ride) return;
  const i = ride.dest;
  ride = null;
  rideEl.classList.remove('show');
  teleport(...TRIG[i]);
  stopDialog(i);
}

function resizeRide() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  rideCv.width = (innerWidth * dpr) | 0;
  rideCv.height = (innerHeight * dpr) | 0;
}

rideEl.addEventListener('pointerdown', () => { if (ride) finishRide(); });

function easeInOut(t) {
  return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function clamp01(t) { return Math.max(0, Math.min(1, t)); }

function updateRide(dt) {
  if (!ride) return;
  ride.t += dt;
  drawRide();
  if (ride.t >= ride.dur) finishRide();
}

function initMetroTrains() {
  metroTrains = [];
  RAILS.forEach((rail, i) => {
    if (!rail.cells || rail.cells.length < 2) return;
    // 노선당 열차 1대 — 한쪽 역에서 대기 후 출발
    metroTrains.push({
      rail: i,
      t: 0,
      speed: 0.00028 + (i % 3) * 0.00004,
      dir: 1,
      phase: 'wait', // wait | move
      wait: 800 + i * 400,
      dwell: 1600
    });
  });
}

function updateMetroTrains(dt) {
  for (const tr of metroTrains) {
    const rail = RAILS[tr.rail];
    if (!rail || rail.cells.length < 2) continue;
    if (tr.phase === 'wait') {
      tr.wait -= dt;
      if (tr.wait <= 0) tr.phase = 'move';
      continue;
    }
    tr.t += tr.speed * dt * tr.dir;
    if (tr.t >= 1) {
      tr.t = 1; tr.dir = -1;
      tr.phase = 'wait'; tr.wait = tr.dwell;
    } else if (tr.t <= 0) {
      tr.t = 0; tr.dir = 1;
      tr.phase = 'wait'; tr.wait = tr.dwell;
    }
  }
}

function drawMetroOverlay(camX, camY) {
  if (!RAILS.length) return;
  // 선로 / 차도 — 길 타일 위에 옅게 얹는 안내선 (배경 박스·밝은 침목 없음)
  const mid = TS * 0.5;
  for (const rail of RAILS) {
    const kind = rail.kind || 'metro';
    const cells = rail.cells;
    // 플레이어가 노선 근처(2칸)면 살짝 강조, 평소엔 조용히
    const near = auto || cells.some(([cx, cy]) => Math.abs(cx - me.x) + Math.abs(cy - me.y) <= 2);
    const alpha = near ? 0.8 : 0.45;
    const color = rail.color || '#5a78a0';

    for (let i = 0; i < cells.length; i++) {
      const [x, y] = cells[i];
      const px = x * TS - camX, py = y * TS - camY;
      if (px < -TS || py < -TS || px > cv.width + TS || py > cv.height + TS) continue;

      // 이웃 셀로 진행 방향 판단 (L자 코너는 둘 다)
      const p = cells[i - 1], n = cells[i + 1];
      const horiz = (p && p[1] === y && p[0] !== x) || (n && n[1] === y && n[0] !== x);
      const vert = (p && p[0] === x && p[1] !== y) || (n && n[0] === x && n[1] !== y);
      const segH = horiz || !vert; // 단독 셀은 가로 취급

      ctx.globalAlpha = alpha;
      if (kind === 'metro') {
        // 레일 2줄(팔레트 톤) + 가운데 노선색 한 줄
        ctx.fillStyle = PAL.stoneDark;
        if (segH) {
          ctx.fillRect(px, py + mid - SCALE * 1.5, TS, 1);
          ctx.fillRect(px, py + mid + SCALE * 1.5, TS, 1);
        }
        if (vert) {
          ctx.fillRect(px + mid - SCALE * 1.5, py, 1, TS);
          ctx.fillRect(px + mid + SCALE * 1.5, py, 1, TS);
        }
        ctx.fillStyle = color;
        if (segH) ctx.fillRect(px, py + mid - 1, TS, 2);
        if (vert) ctx.fillRect(px + mid - 1, py, 2, TS);
      } else if (kind === 'bus') {
        // 차도: 옅은 회색 띠 + 노선색 점선
        ctx.fillStyle = 'rgba(58, 64, 72, 0.14)';
        if (segH) ctx.fillRect(px, py + mid - SCALE * 2, TS, SCALE * 4);
        if (vert) ctx.fillRect(px + mid - SCALE * 2, py, SCALE * 4, TS);
        ctx.fillStyle = color;
        if (segH) { ctx.fillRect(px + SCALE, py + mid - 1, TS * 0.35, 2); ctx.fillRect(px + TS * 0.6, py + mid - 1, TS * 0.35, 2); }
        if (vert) { ctx.fillRect(px + mid - 1, py + SCALE, 2, TS * 0.35); ctx.fillRect(px + mid - 1, py + TS * 0.6, 2, TS * 0.35); }
      } else {
        // 택시: 옅은 띠 + 노선색 실선
        ctx.fillStyle = 'rgba(58, 64, 72, 0.12)';
        if (segH) ctx.fillRect(px, py + mid - SCALE * 1.5, TS, SCALE * 3);
        if (vert) ctx.fillRect(px + mid - SCALE * 1.5, py, SCALE * 3, TS);
        ctx.fillStyle = color;
        if (segH) ctx.fillRect(px, py + mid - 1, TS, 2);
        if (vert) ctx.fillRect(px + mid - 1, py, 2, TS);
      }
    }
  }
  ctx.globalAlpha = 1;
  // 차량
  for (const tr of metroTrains) {
    const rail = RAILS[tr.rail];
    if (!rail || !rail.cells.length) continue;
    const kind = rail.kind || 'metro';
    const idx = Math.min(rail.cells.length - 1, Math.max(0, Math.round(tr.t * (rail.cells.length - 1))));
    const [x, y] = rail.cells[idx];
    const prev = rail.cells[Math.max(0, idx - 1)] || [x, y];
    const next = rail.cells[Math.min(rail.cells.length - 1, idx + 1)] || [x, y];
    const horiz = Math.abs(next[0] - prev[0]) >= Math.abs(next[1] - prev[1]);
    const px = x * TS - camX + TS * 0.05;
    const py = y * TS - camY + TS * 0.1;
    drawMapVehicle(ctx, px, py, horiz, kind, tr.phase === 'wait');
  }
}

function drawMapVehicle(ctx, px, py, horiz, kind, waiting) {
  if (kind === 'bus') {
    const tw = horiz ? TS * 1.6 : TS * 0.85;
    const th = horiz ? TS * 0.7 : TS * 1.35;
    ctx.fillStyle = '#e04040';
    ctx.fillRect(px, py, tw, th);
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(px, py, tw, SCALE * 2);
    ctx.fillStyle = '#68c8f0';
    if (horiz) {
      for (let i = 0; i < 4; i++) ctx.fillRect(px + SCALE * 2 + i * SCALE * 4.5, py + SCALE * 3, SCALE * 3, SCALE * 4);
    } else {
      for (let i = 0; i < 4; i++) ctx.fillRect(px + SCALE * 2, py + SCALE * 3 + i * SCALE * 4.5, SCALE * 4, SCALE * 3);
    }
    ctx.fillStyle = '#282828';
    if (horiz) {
      ctx.fillRect(px + SCALE, py + th - SCALE * 2, SCALE * 3, SCALE * 2);
      ctx.fillRect(px + tw - SCALE * 4, py + th - SCALE * 2, SCALE * 3, SCALE * 2);
    } else {
      ctx.fillRect(px + tw - SCALE * 2, py + SCALE, SCALE * 2, SCALE * 3);
      ctx.fillRect(px + tw - SCALE * 2, py + th - SCALE * 4, SCALE * 2, SCALE * 3);
    }
    if (waiting) drawWaitTag(ctx, px + tw / 2, py, '버스');
  } else if (kind === 'taxi') {
    const tw = horiz ? TS * 1.1 : TS * 0.7;
    const th = horiz ? TS * 0.55 : TS * 0.95;
    ctx.fillStyle = '#f0d030';
    ctx.fillRect(px, py, tw, th);
    ctx.fillStyle = '#282828';
    ctx.fillRect(px + tw / 2 - SCALE * 2, py - SCALE * 2, SCALE * 4, SCALE * 2);
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(px + tw / 2 - SCALE, py - SCALE * 1.5, SCALE * 2, SCALE);
    ctx.fillStyle = '#48b0e0';
    if (horiz) {
      ctx.fillRect(px + SCALE * 2, py + SCALE * 2, SCALE * 4, SCALE * 3);
      ctx.fillRect(px + tw - SCALE * 6, py + SCALE * 2, SCALE * 4, SCALE * 3);
    } else {
      ctx.fillRect(px + SCALE * 2, py + SCALE * 2, SCALE * 3, SCALE * 4);
      ctx.fillRect(px + SCALE * 2, py + th - SCALE * 6, SCALE * 3, SCALE * 4);
    }
    ctx.fillStyle = '#181818';
    if (horiz) {
      ctx.fillRect(px + SCALE, py + th - SCALE, SCALE * 2, SCALE);
      ctx.fillRect(px + tw - SCALE * 3, py + th - SCALE, SCALE * 2, SCALE);
    }
    if (waiting) drawWaitTag(ctx, px + tw / 2, py, '택시');
  } else {
    const tw = horiz ? TS * 1.5 : TS * 0.75;
    const th = horiz ? TS * 0.6 : TS * 1.2;
    ctx.fillStyle = '#e8ecf0';
    ctx.fillRect(px, py, tw, th);
    ctx.fillStyle = '#2868c8';
    ctx.fillRect(px, py, tw, SCALE * 2);
    ctx.fillStyle = '#48a0d0';
    if (horiz) {
      for (let i = 0; i < 3; i++) ctx.fillRect(px + SCALE * 3 + i * SCALE * 5, py + SCALE * 3, SCALE * 3, SCALE * 3);
    } else {
      for (let i = 0; i < 3; i++) ctx.fillRect(px + SCALE * 2, py + SCALE * 3 + i * SCALE * 5, SCALE * 3, SCALE * 3);
    }
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(px + tw - SCALE * 3, py + th * 0.35, SCALE * 2, SCALE * 2);
    if (waiting) drawWaitTag(ctx, px + tw / 2, py, '정차');
  }
}

function drawWaitTag(ctx, lx, py, label) {
  ctx.font = `bold ${SCALE * 3.2}px Galmuri11, monospace`;
  ctx.textAlign = 'center';
  const ly = py - SCALE * 4;
  const tw2 = ctx.measureText(label).width;
  ctx.fillStyle = label === '택시' ? 'rgba(180,140,30,.92)' : label === '버스' ? 'rgba(180,48,48,.92)' : 'rgba(40,104,200,.92)';
  ctx.fillRect(lx - tw2 / 2 - SCALE, ly - SCALE * 3, tw2 + SCALE * 2, SCALE * 5);
  ctx.fillStyle = '#fcebc4';
  ctx.fillText(label, lx, ly);
}

/** 탑승 컷신: 차량이 들어와 → 타고 → 출발 → 도착 */
function drawRide() {
  if (!ride) return;
  const ctx = rideCtx;
  const W = rideCv.width, H = rideCv.height;
  const u = Math.max(1, (Math.min(W, H) / 240) | 0); // 픽셀 유닛
  const p = clamp01(ride.t / ride.dur);
  const kind = ride.kind;

  // 페이즈
  // 0.00–0.12 암전→승강장
  // 0.12–0.38 차량 진입
  // 0.38–0.48 정차·문 열림
  // 0.48–0.78 출발·터널
  // 0.78–1.00 도착 정차
  const fadeIn = clamp01(p / 0.12);
  const arriveT = clamp01((p - 0.12) / 0.26);
  const doorT = clamp01((p - 0.38) / 0.10);
  const goT = clamp01((p - 0.48) / 0.30);
  const landT = clamp01((p - 0.78) / 0.22);

  // 배경
  ctx.fillStyle = '#0e141c';
  ctx.fillRect(0, 0, W, H);

  const isTunnel = goT > 0 && landT === 0;
  if (isTunnel) {
    ctx.fillStyle = '#080c12';
    ctx.fillRect(0, 0, W, H);
    // 터널 줄무늬 (속도감)
    const scroll = (ride.t * 0.6) % (24 * u);
    for (let x = -24 * u; x < W + 24 * u; x += 24 * u) {
      ctx.fillStyle = '#121820';
      ctx.fillRect(x - scroll, H * 0.28, 10 * u, H * 0.44);
    }
    // 지나가는 중간 역 표지
    const mids = extractStations(ride.via);
    if (mids.length > 2) {
      const mid = mids[1 + ((ride.t / 400) | 0) % (mids.length - 2)];
      ctx.fillStyle = 'rgba(40,104,200,.85)';
      ctx.fillRect(W * 0.35, H * 0.16, W * 0.3, 14 * u);
      ctx.fillStyle = '#f8f0d8';
      ctx.font = `bold ${8 * u}px Galmuri11, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(mid + '역', W / 2, H * 0.16 + 7 * u);
    }
  } else {
    // 승강장
    ctx.fillStyle = '#1a2430';
    ctx.fillRect(0, 0, W, H * 0.42);
    ctx.fillStyle = '#2a3438';
    ctx.fillRect(0, H * 0.42, W, H * 0.18); // 플랫폼
    ctx.fillStyle = '#c8a858';
    ctx.fillRect(0, H * 0.42, W, 3 * u); // 노란 안전선
    ctx.fillStyle = '#181c20';
    ctx.fillRect(0, H * 0.60, W, H * 0.40); // 선로
    // 침목
    for (let x = 0; x < W; x += 18 * u) {
      ctx.fillStyle = '#3a3028';
      ctx.fillRect(x, H * 0.72, 12 * u, 3 * u);
    }
    ctx.fillStyle = '#889098';
    ctx.fillRect(0, H * 0.70, W, 2 * u);
    ctx.fillRect(0, H * 0.78, W, 2 * u);
  }

  // 역 표지판
  if (!isTunnel) {
    const label = landT > 0 ? (ride.toStn || ride.name) : (ride.fromStn || '승강장');
    ctx.fillStyle = kind === 'metro' ? '#2868c8' : kind === 'bus' ? '#c84838' : '#d8b838';
    const tw = Math.min(W * 0.7, (label.length + 4) * 10 * u);
    const tx = (W - tw) / 2, ty = H * 0.12;
    ctx.fillRect(tx, ty, tw, 18 * u);
    ctx.fillStyle = '#f8f0d8';
    ctx.font = `bold ${10 * u}px Galmuri11, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label.slice(0, 14), W / 2, ty + 9 * u);
  }

  // 차량 위치
  let carX;
  const carW = Math.min(W * 0.78, 220 * u);
  const carH = 56 * u;
  const carY = H * 0.48;
  const parked = W * 0.5 - carW / 2;
  if (landT > 0) {
    carX = parked + (1 - easeInOut(landT)) * (W * 0.85 + carW);
  } else if (goT > 0) {
    carX = parked - easeInOut(goT) * (W + carW);
  } else if (p >= 0.12) {
    const t = p < 0.38 ? easeInOut(arriveT) : 1;
    carX = W + carW - t * (W * 0.5 + carW / 2 + carW);
  } else {
    carX = W + 40;
  }

  drawVehicle(ctx, carX, carY, carW, carH, u, kind, doorT, goT > 0 && landT === 0);

  // 탑승 안내
  ctx.globalAlpha = fadeIn;
  ctx.fillStyle = '#fcebc4';
  ctx.font = `bold ${9 * u}px Galmuri11, monospace`;
  ctx.textAlign = 'center';
  let msg = '';
  if (p < 0.38) msg = kind === 'taxi' ? '택시가 오고 있어요…' : kind === 'bus' ? '버스가 들어와요…' : `${ride.fromStn}에 열차 진입…`;
  else if (p < 0.48) msg = `${ride.fromStn} 탑승!`;
  else if (p < 0.78) msg = `${ride.line}  ·  ${ride.fromStn} → ${ride.toStn}`;
  else msg = `${ride.toStn} 도착  ·  ${ride.name}`;
  ctx.fillText(msg, W / 2, H * 0.90);
  ctx.globalAlpha = 1;

  // 암전 in/out
  if (p < 0.08) {
    ctx.fillStyle = `rgba(0,0,0,${1 - p / 0.08})`;
    ctx.fillRect(0, 0, W, H);
  } else if (p > 0.92) {
    ctx.fillStyle = `rgba(0,0,0,${(p - 0.92) / 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawVehicle(ctx, x, y, w, h, u, kind, doorT, speeding) {
  const body = kind === 'metro' ? '#d8dce0' : kind === 'bus' ? '#e84848' : '#f0d848';
  const accent = kind === 'metro' ? '#2868c8' : kind === 'bus' ? '#f0d848' : '#282828';
  const dark = '#2a3038';

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x + 4 * u, y + h - 2 * u, w - 8 * u, 6 * u);

  // 차체
  ctx.fillStyle = body;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = accent;
  ctx.fillRect(x, y, w, 8 * u);
  ctx.fillStyle = dark;
  ctx.fillRect(x, y + h - 6 * u, w, 6 * u);

  // 창문들
  const doorOpen = Math.min(1, doorT) * 10 * u;
  const winY = y + 14 * u, winH = h - 28 * u;
  const slots = kind === 'taxi' ? 2 : 4;
  const gap = 6 * u;
  const winW = (w - gap * (slots + 1)) / slots;
  for (let i = 0; i < slots; i++) {
    const wx = x + gap + i * (winW + gap);
    const isDoor = kind !== 'taxi' && (i === 1 || i === 2);
    const open = isDoor ? doorOpen : 0;
    ctx.fillStyle = speeding ? '#68c8f0' : '#48a0d0';
    ctx.fillRect(wx + open * 0.5, winY, Math.max(2, winW - open), winH);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(wx + open * 0.5 + 2 * u, winY + 2 * u, 4 * u, 3 * u);
    if (isDoor && doorOpen > 0) {
      ctx.fillStyle = '#1a2030';
      ctx.fillRect(wx + winW / 2 - open / 2, winY, open, winH);
    }
  }

  // 전조등 / 행선
  if (kind === 'metro') {
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(x + w - 28 * u, y + 2 * u, 22 * u, 5 * u);
  } else if (kind === 'bus') {
    ctx.fillStyle = '#f8f8f0';
    ctx.fillRect(x + 8 * u, y + 2 * u, 40 * u, 5 * u);
  } else {
    ctx.fillStyle = '#282828';
    ctx.fillRect(x + w / 2 - 6 * u, y - 4 * u, 12 * u, 5 * u); // 택시등
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(x + w / 2 - 4 * u, y - 3 * u, 8 * u, 3 * u);
  }

  // 바퀴 (버스/택시) 또는 대차 (지하철)
  if (kind === 'metro') {
    ctx.fillStyle = '#485058';
    ctx.fillRect(x + 16 * u, y + h - 2 * u, 28 * u, 5 * u);
    ctx.fillRect(x + w - 44 * u, y + h - 2 * u, 28 * u, 5 * u);
  } else {
    ctx.fillStyle = '#181818';
    ctx.beginPath(); ctx.arc(x + 18 * u, y + h, 6 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w - 18 * u, y + h, 6 * u, 0, Math.PI * 2); ctx.fill();
  }

  // 탑승 후 실루엣
  if (doorT > 0.4 || speeding) {
    ctx.fillStyle = '#3a4858';
    ctx.fillRect(x + w * 0.35, winY + 4 * u, 5 * u, winH - 6 * u);
    ctx.fillRect(x + w * 0.45, winY + 6 * u, 4 * u, winH - 8 * u);
    ctx.fillStyle = '#4890c8';
    ctx.fillRect(x + w * 0.52, winY + 8 * u, 4 * u, winH - 10 * u); // 작애
  }
}

function routeToTarget() {
  const next = DAY.stops[target];
  boardPending = null;
  clickTarget = TRIG[target] ? [...TRIG[target]] : null;

  // 교통 구간: 먼저 역까지 걸어간 뒤 탑승(순간이동은 탑승 후에만)
  // 택시 승차 일정 스팟 자체는 걸어서 방문 — 중복 탑승 연출 없음
  if (isTransit(next.via, next) && target > 0 && !isVehicleStop(next)) {
    if (STATIONS.length) {
      if (nearStation()) {
        openBoardDialog(target);
        return;
      }
      const gate = stationApproach();
      if (gate) {
        boardPending = target;
        queue = findPath(me.x, me.y, ...gate);
        clickTarget = gate;
        if (!queue.length && me.x === gate[0] && me.y === gate[1]) openBoardDialog(target);
        refreshList();
        return;
      }
    }
    // 역이 없거나 진입로를 못 찾으면 바로 탑승 컷신
    openBoardDialog(target);
    return;
  }

  queue = findPath(me.x, me.y, ...TRIG[target]);
  if (!queue.length && me.x === TRIG[target][0] && me.y === TRIG[target][1]) stopDialog(target);
  refreshList();
}

function setAuto(v) {
  auto = v;
  autoBtn.classList.toggle('on', v);
  autoBtn.textContent = v ? '⏸ 일시정지' : '▶ 자동 여행';
  if (v) {
    manualQueue = []; clickTarget = null;
    if (target >= DAY.stops.length) target = 0;
    routeToTarget();
  } else { queue = []; pendingWarp = null; boardPending = null; }
  refreshList();
}
autoBtn.onclick = () => { hideToast(); setAuto(!auto); };

/* ═══ 역 탑승 (A버튼) ═══ */
function stationHere() {
  let best = null, bestD = Infinity;
  for (const st of STATIONS) {
    // 역사 + 앞 광장
    if (me.x < st.x - 1 || me.x > st.x + st.w || me.y < st.y - 1 || me.y > st.y + st.h + 2) continue;
    const cx = st.x + st.w / 2, cy = st.y + st.h + 1;
    const d = Math.abs(cx - me.x) + Math.abs(cy - me.y);
    if (d < bestD) { bestD = d; best = st; }
  }
  return best;
}
function nearStation() { return !!stationHere(); }

function pickRoute(st) {
  const routes = st.routes || [];
  if (!routes.length) return null;
  return routes.find(r => r.toStop === target) || routes[0];
}

function nearbyNpc() {
  return npcs.find(npc => Math.abs(npc.x - me.x) + Math.abs(npc.y - me.y) === 1);
}
/** bags(잡담·이야기·팁)를 한데 모은 대사 풀 */
function npcLinePool(npc) {
  if (npc._linePool) return npc._linePool;
  const pool = [];
  if (npc.bags && npc.bags.length) {
    for (const bag of npc.bags) {
      for (const line of bag.lines || []) pool.push(line);
    }
  } else if (npc.lines && npc.lines.length) {
    pool.push(...npc.lines);
  }
  if (!pool.length) pool.push('…….');
  npc._linePool = pool;
  return pool;
}
/** 직전에 쓴 줄은 피해서 랜덤으로 한 줄 고름 */
function pickNpcLine(npc) {
  const pool = npcLinePool(npc);
  if (pool.length === 1) return pool[0];
  let i = (Math.random() * pool.length) | 0;
  if (i === npc.lastLineIndex) i = (i + 1 + ((Math.random() * (pool.length - 1)) | 0)) % pool.length;
  npc.lastLineIndex = i;
  return pool[i];
}
function openNpcDialog(npc) {
  if (me.moving) return;
  if (auto) setAuto(false);
  held.clear(); manualQueue = []; clickTarget = null;
  pendingWarp = null; boardPending = null; pendingSleep = false;
  npc.path = [];
  npc.wait = 1600 + Math.random() * 1200;
  npc.dir = me.x > npc.x ? 'right' : me.x < npc.x ? 'left' : me.y > npc.y ? 'down' : 'up';
  talkingNpc = npc;
  openDialog(npc.name, pickNpcLine(npc), {
    showOk: true,
    okLabel: '닫기',
    cancelable: true,
    npc: true
  });
}

function interactA() {
  hideToast();
  // 허브 역 — 갈 수 있는 일정 목록
  const st = stationHere();
  if (st) {
    openHubMenu(st);
    return;
  }
  const near = trigAt(me.x, me.y, true);
  if (near >= 0) { stopDialog(near); return; }
  const npc = nearbyNpc();
  if (npc) openNpcDialog(npc);
}

/* ═══ 입력 ═══ */
const held = new Set();
const KEYMAP = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
};
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (ride) { finishRide(); return; }
    if (dlgOpen) advanceDialog(); else interactA();
    return;
  }
  if (ride) return;
  if (KEYMAP[e.code]) { e.preventDefault(); held.add(e.code); if (auto) setAuto(false); manualQueue = []; clickTarget = null; hideToast(); }
});
addEventListener('keyup', e => held.delete(e.code));

document.getElementById('cv').addEventListener('pointerdown', e => {
  if (ride) return;
  if (dlgOpen) { advanceDialog(); return; }
  hideToast();
  const tx = ((e.clientX + camXg) / TS) | 0, ty = ((e.clientY + camYg) / TS) | 0;
  if (auto) setAuto(false);
  let goal = null;
  if (walkable(tx, ty)) goal = [tx, ty];
  else for (const [dx, dy] of [[0, 1], [0, -1], [-1, 0], [1, 0]])
    if (walkable(tx + dx, ty + dy)) { goal = [tx + dx, ty + dy]; break; }
  if (!goal) return;
  const p = findPath(me.x, me.y, goal[0], goal[1]);
  if (p.length || (goal[0] === me.x && goal[1] === me.y)) { manualQueue = p; clickTarget = goal; }
});

const toast = document.getElementById('toast');
let toastGone = false;
function hideToast() { if (!toastGone) { toastGone = true; toast.style.display = 'none'; } }

document.querySelectorAll('#dpad button').forEach(b => {

  const up = e => { e.preventDefault(); held.delete(key); };
  b.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, up));
});
document.getElementById('abtn').addEventListener('pointerdown', e => {
