/** 현재 자동 목표로 가는 역사 앞 칸 */
function stationApproach() {
  let best = null, bestLen = Infinity;
  const pool = STATIONS.filter(st => (st.routes || []).some(r => r.toStop === target));
  const list = pool.length ? pool : STATIONS;
  for (const st of list) {
    const cands = [];
    for (let x = st.x; x < st.x + st.w; x++) {
      cands.push([x, st.y + st.h], [x, st.y - 1]);
    }
    for (let y = st.y; y < st.y + st.h; y++) {
      cands.push([st.x - 1, y], [st.x + st.w, y]);
    }
    for (const [x, y] of cands) {
      if (!walkable(x, y)) continue;
      if (x === me.x && y === me.y) return [x, y];
      const p = findPath(me.x, me.y, x, y);
      if (p.length && p.length < bestLen) { bestLen = p.length; best = [x, y]; }
    }
  }
  return best;
}

  const line = extractLine(via);
  const km = hopKm(i);
  const kmTxt = km >= 0.3 ? ` · ${km.toFixed(1)}km` : '';
  const title = kind === 'taxi' ? '🚕 택시 탑승' : kind === 'bus' ? `🚌 ${from}` : `🚇 ${from}`;
  const ok = kind === 'taxi' ? '🚕 출발' : kind === 'bus' ? '🚌 출발' : '🚇 출발';
  const body = kind === 'metro'
    ? `${line} · ${from} → ${to}${kmTxt} · ${s.time} ${shortName(s)}`
    : `${via || '다음 마을로 이동'}${kmTxt}`;
  openDialog(title, body, {
    showOk: true, okLabel: ok, cancelable: !auto,
    tip: `다음 일정: ${s.time} ${s.name}`,
    via: kind === 'metro' ? via : undefined
  });
}

function openHubMenu(st) {
  const routes = [];
  const seen = new Set();
  for (const r of st.routes || []) {
    if (seen.has(r.toStop)) continue;
    seen.add(r.toStop);
    routes.push(r);
  }
  routes.sort((a, b) => a.toStop - b.toStop);

  if (auto) {
    const r = routes.find(x => x.toStop === target);
    if (r) openBoardDialog(r.toStop);
    else if (DAY.stops[target]) routeToTarget();
    else openDialog(`🚇 ${st.name}`, '이 역에서 갈 수 있는 일정이 없어요.', { showOk: true });
    return;
  }

  if (!routes.length) {
    openDialog(`🚇 ${st.name}`, '이 역에서 갈 수 있는 일정이 없어요.', { showOk: true });
    return;
  }

  const icon0 = st.vKind === 'taxi' ? '🚕' : st.vKind === 'bus' ? '🚌' : '🚇';
  openDialog(`${icon0} ${st.name}${st.vKind === 'metro' ? '역' : ''}`, '어느 마을로 갈까요?', {
    showOk: false, cancelable: true
  });
  dlgOk.style.display = 'none';
  dlgActs.hidden = false;
  dlgCancel.hidden = false;
  for (const r of routes) {
    const s = DAY.stops[r.toStop];
    if (!s) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.hubTo = String(r.toStop);
    const kind = r.kind || vehicleKind(r.line);
    const icon = kind === 'walk' ? '🚪' : kind === 'taxi' ? '🚕' : kind === 'bus' ? '🚌' : '🚇';
    const there = AREAS[areaOf(r.toStop)]?.name;
    btn.textContent = `${icon} ${s.time} ${shortName(s)}${there ? ` (${there})` : ''}`;
    btn.addEventListener('pointerdown', e => {
      e.stopPropagation();
      sfx('confirm');
      // 포탈 이동 vs 탑승 선택
      if (kind === 'walk' || !hopViaFor(r.toStop)) {
        clearHubButtons();
        dlg.style.display = 'none'; dlgOpen = false; dlgStop = -1;
        walkToPortal(r.toStop);
      } else {
        openBoardDialog(r.toStop);
      }
    });
    dlgActs.insertBefore(btn, dlgCancel);
  }
  dlgNext.hidden = true;
}

/** 포탈(마을 출구) 메뉴 — 다른 마을 스팟으로 맵 이동 */
function openPortalMenu() {
  const dests = [];
  const seenArea = new Set([areaIdx]);
  DAY.stops.forEach((s, i) => {
    const ai = areaOf(i);
    if (ai === areaIdx || seenArea.has(ai)) return;
    seenArea.add(ai);
    // 그 마을의 대표 스팟(첫 스팟)으로 이동
    dests.push({ i: AREAS[ai].stops[0], name: AREAS[ai].name, stopName: s.name, time: DAY.stops[AREAS[ai].stops[0]].time });
  });
  // 일정 순서로도: 아직 안 본 다음 스팟이 다른 마을이면 맨 위에
  const next = DAY.stops.findIndex((_, i) => i > (lastTrig < 0 ? -1 : lastTrig) && areaOf(i) !== areaIdx);
  if (next >= 0) {
    const ai = areaOf(next);
    const idx = dests.findIndex(d => areaOf(d.i) === ai);
    if (idx > 0) { const [d] = dests.splice(idx, 1); dests.unshift(d); }
    else if (idx < 0) dests.unshift({ i: next, name: AREAS[ai].name, stopName: DAY.stops[next].name, time: DAY.stops[next].time });
  }

  if (!dests.length) {
    openDialog('🚪 마을 출구', '지금은 갈 수 있는 다른 마을이 없어요.', { showOk: true, cancelable: true });
    return;
  }
  const here = AREAS[areaIdx]?.name || '마을';
  openDialog(`🚪 ${here} 출구`, '어느 마을로 갈까요?', { showOk: false, cancelable: true });
  dlgOk.style.display = 'none';
  dlgActs.hidden = false;
  dlgCancel.hidden = false;
  for (const d of dests) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.hubTo = String(d.i);
    btn.textContent = `→ ${d.name}  (${d.time} ${shortName(DAY.stops[d.i])})`;
    btn.addEventListener('pointerdown', e => {
      e.stopPropagation();
      sfx('confirm');
      clearHubButtons();
      dlg.style.display = 'none'; dlgOpen = false; dlgStop = -1;
      startHop(d.i);
    });
    dlgActs.insertBefore(btn, dlgCancel);
  }
  dlgNext.hidden = true;
}

function rideKind(via) {
  if (/택시/.test(via || '')) return 'taxi';
  if (/버스|고속버스/.test(via || '')) return 'bus';
  return 'metro';
}

/* ═══ 마을 간 이동 (맵 이동) ═══
 * 기본: 마을 아래 포탈(GATE) → 도로 컷신 → 다음 마을 입구 (포켓몬 루트 이동)
 * 선택: 마을 역에서 A → 지하철/버스/택시 탑승 컷신 (forceRide)
 * 같은 마을 스팟 → 맵 안 findPath 걷기
 */
function atGate() { return me.x === GATE[0] && me.y === GATE[1]; }
/** 현재 마을(중심) → 목적지 스팟 실제 km (좌표 없으면 0) */
function hopKm(destIdx) {
  const to = DAY.stops[destIdx], from = AREAS[areaIdx];
  if (!to || !from || !from.n || to.lat == null) return 0;
  return haversineKm(from, to);
}
/** via 문자열에서 소요 분 추출 ("약 20분", "15분") */
function viaMinutes(via) {
  const m = /(\d+)\s*분/.exec(via || '');
  return m ? +m[1] : 0;
}
/** 이동 방식: 'walk'(같은 마을) | 'routeWalk'(다른 마을·포탈) | 'ride'(역에서 선택 탑승만) */
function hopMode(destIdx, opts = {}) {
  if (!DAY.stops[destIdx]) return 'walk';
  if (areaOf(destIdx) === areaIdx) return 'walk';
  if (opts.forceRide) return 'ride';
  return 'routeWalk'; // 기본은 포탈 — 지하철 강제 아님
}
/** 다른 마을이면 컷신 시작 후 true, 같은 마을이면 false */
function startHop(destIdx, opts = {}) {
  const m = hopMode(destIdx, opts);
  if (m === 'routeWalk') { startRouteWalk(destIdx); return true; }
  if (m === 'ride') { startRide(destIdx, hopViaFor(destIdx) || null); return true; }
  return false;
}
/** 포탈로 걸어가 맵 이동 시작 (이미 포탈 위면 바로 컷신) */
function walkToPortal(destIdx) {
  if (areaOf(destIdx) === areaIdx) { travelInMap(destIdx); return; }
  if (atGate()) { startHop(destIdx); return; }
  const p = findPath(me.x, me.y, GATE[0], GATE[1]);
  boardPending = destIdx;
  if (p.length) { manualQueue = auto ? [] : p; if (auto) queue = p; clickTarget = [...GATE]; }
  else startHop(destIdx);
}
/** 컷신 방향: 지오 기준 (남쪽=아래) */
function hopDir(destIdx) {
  const from = AREAS[areaIdx], to = DAY.stops[destIdx];
  if (!from || !from.n || !to || to.lat == null) return { vertical: true, dirSign: 1 };
  const dLat = to.lat - from.lat;
  const dLng = (to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180);
  const vertical = Math.abs(dLat) >= Math.abs(dLng);
  return { vertical, dirSign: vertical ? (dLat < 0 ? 1 : -1) : (dLng >= 0 ? 1 : -1) };
}

/** 포탈 컷신: 암전 → 도로/루트 위를 몇 걸음 → 암전 → 다음 마을 입구 */
function startRouteWalk(destIdx) {
  const s = DAY.stops[destIdx];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const km = hopKm(destIdx);
  const here = AREAS[areaIdx]?.name || '';
  const there = AREAS[areaOf(destIdx)]?.name || shortStationFallback(s.name);
  const dur = reduced ? 500 : Math.round(Math.max(1200, Math.min(2800, Math.max(km, 0.4) * 700)) + 400);
  ride = {
    dest: destIdx,
    via: s.via || '',
    name: s.name,
    time: s.time,
    kind: 'walk',
    fromTown: here,
    toTown: there,
    km: km > 0.05 ? km : 0.5,
    ...hopDir(destIdx),
    t: 0,
    dur
  };
  queue = []; manualQueue = []; clickTarget = null; boardPending = null;
  sfx('tick');
  resizeRide();
  rideEl.classList.add('show');
}

function startRide(destIdx, viaOverride) {
  const s = DAY.stops[destIdx];
  const via = viaOverride || s.via || '';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const kind = rideKind(via);
  const suffix = kind === 'metro' ? '역' : '';
  const names = extractStations(via);
  const here = AREAS[areaIdx]?.name || '';
  const there = AREAS[areaOf(destIdx)]?.name || shortStationFallback(s.name);
  const from = names[0] ? names[0] + '역' : (here ? here + suffix : stationLabel(via, '출발'));
  const to = names.length > 1 ? names[names.length - 1] + '역' : there + suffix;
  ride = {
    dest: destIdx,
    via,
    name: s.name,
    time: s.time,
    kind,
    line: extractLine(via),
    fromStn: from,
    toStn: to,
    km: hopKm(destIdx),
    mins: viaMinutes(via),
    t: 0,
    dur: reduced ? 900 : 4800
  };
  queue = []; manualQueue = []; clickTarget = null; boardPending = null;
  resizeRide();
  rideEl.classList.add('show');
}

function finishRide() {
  if (!ride) return;
  const i = ride.dest;
  ride = null;
  rideEl.classList.remove('show');
  arriveAt(i);
}

/** 컷신 뒤 도착 처리: 다른 마을이면 맵 로드(입구 스폰) → 스팟까지 걸어가서 대화 */
function arriveAt(i) {
  const ai = areaOf(i);
  if (ai !== areaIdx) loadArea(ai);
  sfx('confirm');
  if (!TRIG[i]) { stopDialog(i); return; }
  if (auto) { routeToTarget(); return; }
  travelInMap(i);
}
/** 같은 마을 안에서 스팟 i로 걷기 (도착하면 대화창) */
function travelInMap(i) {
  const [tx, ty] = TRIG[i];
  if (me.x === tx && me.y === ty) { stopDialog(i); return; }
  const p = findPath(me.x, me.y, tx, ty);
  if (!p.length) { teleport(tx, ty); stopDialog(i); return; }
  manualQueue = p; clickTarget = [tx, ty]; arriveStop = i;
}

function resizeRide() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  rideCv.width = (innerWidth * dpr) | 0;
  rideCv.height = (innerHeight * dpr) | 0;
}

rideEl.addEventListener('pointerdown', () => { if (ride) finishRide(); });

function easeInOut(t) {
  return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function clamp01(t) { return Math.max(0, Math.min(1, t)); }

function updateRide(dt) {
  if (!ride) return;
  ride.t += dt;
  if (ride.kind === 'walk') drawRouteWalk(); else drawRide();
  if (ride.t >= ride.dur) finishRide();
}

/** 도보 장거리 컷신 그리기: 도로 스트립(잔디·나무 양옆) 위를 세 명이 걷는다 */
function drawRouteWalk() {
  if (!ride) return;
  const ctx = rideCtx;
  const W = rideCv.width, H = rideCv.height;
  const p = clamp01(ride.t / ride.dur);
  const FADE = 350 / ride.dur;                   // 페이드 비율
  const walkT = clamp01((p - FADE) / (1 - FADE * 2));
  const u = Math.max(2, Math.round(Math.min(W, H) / 160)); // 타일 확대 배율
  const T = 16 * u;
  const vertical = ride.vertical;
  const scroll = (ride.t * 0.09 * u) % T;       // 스크롤 오프셋(px)

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = PAL.grassLight;
  ctx.fillRect(0, 0, W, H);

  // 잔디 타일 (아틀라스 0번, 프레임 waterF)
  const cols = Math.ceil(W / T) + 2, rows = Math.ceil(H / T) + 2;
  const off = ride.dirSign > 0 ? -scroll : scroll - T;
  for (let gy = -1; gy < rows; gy++) for (let gx = -1; gx < cols; gx++) {
    const dx = gx * T + (vertical ? 0 : off), dy = gy * T + (vertical ? off : 0);
    ctx.drawImage(atlas, 0, waterF * 16, 16, 16, dx, dy, T, T);
  }
  // 도로 스트립 (3타일 폭, 포장길 1번)
  const roadTiles = 3;
  const roadW = roadTiles * T;
  const rx = vertical ? ((W - roadW) / 2) | 0 : 0;
  const ry = vertical ? 0 : ((H - roadW) / 2) | 0;
  for (let i = -1; i < (vertical ? rows : cols); i++) for (let k = 0; k < roadTiles; k++) {
    const dx = vertical ? rx + k * T : i * T + off;
    const dy = vertical ? i * T + off : ry + k * T;
    ctx.drawImage(atlas, 16, waterF * 16, 16, 16, dx, dy, T, T);
  }
  // 도로 양옆 나무 줄 (한 칸 띄워서)
  const treeLine = (side) => {
    for (let i = -1; i < (vertical ? rows : cols); i += 2) {
      const v = Math.abs(i * 7 + side * 3) % 10;
      const spr = treeSprites[v];
      if (!spr) continue;
      const dx = vertical ? (side < 0 ? rx - T * 1.5 : rx + roadW + T * 0.5) : i * T + off;
      const dy = vertical ? i * T + off : (side < 0 ? ry - T * 1.5 : ry + roadW + T * 0.5);
      ctx.drawImage(spr, dx | 0, dy | 0, T, T);
    }
  };
  treeLine(-1); treeLine(1);

  // 걷는 세 명 — 도로 중앙, 진행 방향 바라보기
  const frame = ((ride.t / 180) | 0) % 2;
  const dir = vertical ? (ride.dirSign > 0 ? 'down' : 'up') : (ride.dirSign > 0 ? 'right' : 'left');
  const cu = Math.max(4, SCALE + 1);              // drawChar 내부 유닛
  const cw = 16 * cu, ch = 17 * cu;
  const cx = (W - cw) / 2, cy = (H - ch) / 2;
  const gap = vertical ? [0, 19 * cu] : [17 * cu, 0];
  const behind = ride.dirSign > 0 ? -1 : 1;
  const posMe = [cx, cy];
  const posWife = [cx + gap[0] * behind, cy + gap[1] * behind];
  const posPet = [cx + gap[0] * behind * 2, cy + gap[1] * behind * 2];
  const items = [
    { y: posMe[1], d: () => drawChar(ctx, posMe[0], posMe[1], dir, frame, PAL_ME) },
    { y: posWife[1], d: () => drawChar(ctx, posWife[0], posWife[1], dir, 1 - frame, PAL_WIFE) },
    { y: posPet[1], d: () => drawJakae(ctx, posPet[0], posPet[1] + 2 * cu, dir, frame, PAL_JAKAE) }
  ];
  items.sort((a, b) => a.y - b.y).forEach(it => it.d());

  // 캡션: 맵 이동 · 마을 → 마을
  const fu = Math.max(1, (Math.min(W, H) / 240) | 0);
  const fromT = ride.fromTown || '';
  const toT = ride.toTown || '';
  const label = fromT && toT ? `${fromT} → ${toT}` : `맵 이동 · ${(ride.km >= 10 ? Math.round(ride.km) : Math.round(ride.km * 10) / 10)}km`;
  ctx.fillStyle = 'rgba(24,36,64,.88)';
  const tw = Math.min(W * 0.8, (label.length + 6) * 9 * fu);
  ctx.fillRect((W - tw) / 2, H * 0.10, tw, 18 * fu);
  ctx.fillStyle = PAL.gold;
  ctx.fillRect((W - tw) / 2, H * 0.10 + 18 * fu, tw, 2 * fu);
  ctx.fillStyle = '#fcebc4';
  ctx.font = `bold ${10 * fu}px ${FONT_UI}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, W / 2, H * 0.10 + 9 * fu);
  const sub = `${ride.time ? ride.time + '  ' : ''}${ride.name}`.slice(0, 22);
  const sw = Math.min(W * 0.8, (sub.length + 4) * 8 * fu);
  ctx.fillStyle = 'rgba(24,36,64,.88)';
  ctx.fillRect((W - sw) / 2, H * 0.90 - 8 * fu, sw, 16 * fu);
  ctx.fillStyle = '#fcebc4';
  ctx.font = `bold ${9 * fu}px ${FONT_UI}`;
  ctx.fillText(sub, W / 2, H * 0.90);

  // 진행 바
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(W * 0.2, H * 0.95, W * 0.6, 3 * fu);
  ctx.fillStyle = PAL.gold;
  ctx.fillRect(W * 0.2, H * 0.95, W * 0.6 * walkT, 3 * fu);

  // 암전 in/out
  if (p < FADE) {
    ctx.fillStyle = `rgba(0,0,0,${1 - p / FADE})`;
    ctx.fillRect(0, 0, W, H);
  } else if (p > 1 - FADE) {
    ctx.fillStyle = `rgba(0,0,0,${(p - (1 - FADE)) / FADE})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function initMetroTrains() {
  metroTrains = [];
  RAILS.forEach((rail, i) => {
    if (!rail.cells || rail.cells.length < 2) return;
    // 노선당 열차 1대 — 한쪽 역에서 대기 후 출발
    metroTrains.push({
      rail: i,
      t: 0,
      speed: 0.00028 + (i % 3) * 0.00004,
      dir: 1,
      phase: 'wait', // wait | move
      wait: 800 + i * 400,
      dwell: 1600
    });
  });
}

function updateMetroTrains(dt) {
  for (const tr of metroTrains) {
    const rail = RAILS[tr.rail];
    if (!rail || rail.cells.length < 2) continue;
    if (tr.phase === 'wait') {
      tr.wait -= dt;
      if (tr.wait <= 0) tr.phase = 'move';
      continue;
    }
    tr.t += tr.speed * dt * tr.dir;
    if (tr.t >= 1) {
      tr.t = 1; tr.dir = -1;
      tr.phase = 'wait'; tr.wait = tr.dwell;
    } else if (tr.t <= 0) {
      tr.t = 0; tr.dir = 1;
      tr.phase = 'wait'; tr.wait = tr.dwell;
    }
  }
}

function drawMetroOverlay(camX, camY) {
  if (!RAILS.length) return;
  // 선로 / 차도 — 길 타일 위에 옅게 얹는 안내선 (배경 박스·밝은 침목 없음)
  const mid = TS * 0.5;
  for (const rail of RAILS) {
    const kind = rail.kind || 'metro';
    const cells = rail.cells;
    // 플레이어가 노선 근처(2칸)면 살짝 강조, 평소엔 조용히
    const near = auto || cells.some(([cx, cy]) => Math.abs(cx - me.x) + Math.abs(cy - me.y) <= 2);
    const alpha = near ? 0.8 : 0.45;
    const color = rail.color || '#5a78a0';

    for (let i = 0; i < cells.length; i++) {
      const [x, y] = cells[i];
      const px = x * TS - camX, py = y * TS - camY;
      if (px < -TS || py < -TS || px > cv.width + TS || py > cv.height + TS) continue;

      // 이웃 셀로 진행 방향 판단 (L자 코너는 둘 다)
      const p = cells[i - 1], n = cells[i + 1];
      const horiz = (p && p[1] === y && p[0] !== x) || (n && n[1] === y && n[0] !== x);
      const vert = (p && p[0] === x && p[1] !== y) || (n && n[0] === x && n[1] !== y);
      const segH = horiz || !vert; // 단독 셀은 가로 취급

      ctx.globalAlpha = alpha;
      if (kind === 'metro') {
        // 레일 2줄(팔레트 톤) + 가운데 노선색 한 줄
        ctx.fillStyle = PAL.stoneDark;
        if (segH) {
          ctx.fillRect(px, py + mid - SCALE * 1.5, TS, 1);
          ctx.fillRect(px, py + mid + SCALE * 1.5, TS, 1);
        }
        if (vert) {
          ctx.fillRect(px + mid - SCALE * 1.5, py, 1, TS);
          ctx.fillRect(px + mid + SCALE * 1.5, py, 1, TS);
        }
        ctx.fillStyle = color;
        if (segH) ctx.fillRect(px, py + mid - 1, TS, 2);
        if (vert) ctx.fillRect(px + mid - 1, py, 2, TS);
      } else if (kind === 'bus') {
        // 차도: 옅은 회색 띠 + 노선색 점선
        ctx.fillStyle = 'rgba(58, 64, 72, 0.14)';
        if (segH) ctx.fillRect(px, py + mid - SCALE * 2, TS, SCALE * 4);
        if (vert) ctx.fillRect(px + mid - SCALE * 2, py, SCALE * 4, TS);
        ctx.fillStyle = color;
        if (segH) { ctx.fillRect(px + SCALE, py + mid - 1, TS * 0.35, 2); ctx.fillRect(px + TS * 0.6, py + mid - 1, TS * 0.35, 2); }
        if (vert) { ctx.fillRect(px + mid - 1, py + SCALE, 2, TS * 0.35); ctx.fillRect(px + mid - 1, py + TS * 0.6, 2, TS * 0.35); }
      } else {
        // 택시: 옅은 띠 + 노선색 실선
        ctx.fillStyle = 'rgba(58, 64, 72, 0.12)';
        if (segH) ctx.fillRect(px, py + mid - SCALE * 1.5, TS, SCALE * 3);
        if (vert) ctx.fillRect(px + mid - SCALE * 1.5, py, SCALE * 3, TS);
        ctx.fillStyle = color;
        if (segH) ctx.fillRect(px, py + mid - 1, TS, 2);
        if (vert) ctx.fillRect(px + mid - 1, py, 2, TS);
      }
    }
  }
  ctx.globalAlpha = 1;
  // 차량
  for (const tr of metroTrains) {
    const rail = RAILS[tr.rail];
    if (!rail || !rail.cells.length) continue;
    const kind = rail.kind || 'metro';
    const idx = Math.min(rail.cells.length - 1, Math.max(0, Math.round(tr.t * (rail.cells.length - 1))));
    const [x, y] = rail.cells[idx];
    const prev = rail.cells[Math.max(0, idx - 1)] || [x, y];
    const next = rail.cells[Math.min(rail.cells.length - 1, idx + 1)] || [x, y];
    const horiz = Math.abs(next[0] - prev[0]) >= Math.abs(next[1] - prev[1]);
    const px = x * TS - camX + TS * 0.05;
    const py = y * TS - camY + TS * 0.1;
    drawMapVehicle(ctx, px, py, horiz, kind, tr.phase === 'wait');
  }
}

function drawMapVehicle(ctx, px, py, horiz, kind, waiting) {
  if (kind === 'bus') {
    const tw = horiz ? TS * 1.6 : TS * 0.85;
    const th = horiz ? TS * 0.7 : TS * 1.35;
    ctx.fillStyle = '#e04040';
    ctx.fillRect(px, py, tw, th);
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(px, py, tw, SCALE * 2);
    ctx.fillStyle = '#68c8f0';
    if (horiz) {
      for (let i = 0; i < 4; i++) ctx.fillRect(px + SCALE * 2 + i * SCALE * 4.5, py + SCALE * 3, SCALE * 3, SCALE * 4);
    } else {
      for (let i = 0; i < 4; i++) ctx.fillRect(px + SCALE * 2, py + SCALE * 3 + i * SCALE * 4.5, SCALE * 4, SCALE * 3);
    }
    ctx.fillStyle = '#282828';
    if (horiz) {
      ctx.fillRect(px + SCALE, py + th - SCALE * 2, SCALE * 3, SCALE * 2);
      ctx.fillRect(px + tw - SCALE * 4, py + th - SCALE * 2, SCALE * 3, SCALE * 2);
    } else {
      ctx.fillRect(px + tw - SCALE * 2, py + SCALE, SCALE * 2, SCALE * 3);
      ctx.fillRect(px + tw - SCALE * 2, py + th - SCALE * 4, SCALE * 2, SCALE * 3);
    }
    if (waiting) drawWaitTag(ctx, px + tw / 2, py, '버스');
  } else if (kind === 'taxi') {
    const tw = horiz ? TS * 1.1 : TS * 0.7;
    const th = horiz ? TS * 0.55 : TS * 0.95;
    ctx.fillStyle = '#f0d030';
    ctx.fillRect(px, py, tw, th);
    ctx.fillStyle = '#282828';
    ctx.fillRect(px + tw / 2 - SCALE * 2, py - SCALE * 2, SCALE * 4, SCALE * 2);
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(px + tw / 2 - SCALE, py - SCALE * 1.5, SCALE * 2, SCALE);
    ctx.fillStyle = '#48b0e0';
    if (horiz) {
      ctx.fillRect(px + SCALE * 2, py + SCALE * 2, SCALE * 4, SCALE * 3);
      ctx.fillRect(px + tw - SCALE * 6, py + SCALE * 2, SCALE * 4, SCALE * 3);
    } else {
      ctx.fillRect(px + SCALE * 2, py + SCALE * 2, SCALE * 3, SCALE * 4);
      ctx.fillRect(px + SCALE * 2, py + th - SCALE * 6, SCALE * 3, SCALE * 4);
    }
    ctx.fillStyle = '#181818';
    if (horiz) {
      ctx.fillRect(px + SCALE, py + th - SCALE, SCALE * 2, SCALE);
      ctx.fillRect(px + tw - SCALE * 3, py + th - SCALE, SCALE * 2, SCALE);
    }
    if (waiting) drawWaitTag(ctx, px + tw / 2, py, '택시');
  } else {
    const tw = horiz ? TS * 1.5 : TS * 0.75;
    const th = horiz ? TS * 0.6 : TS * 1.2;
    ctx.fillStyle = '#e8ecf0';
    ctx.fillRect(px, py, tw, th);
    ctx.fillStyle = '#2868c8';
    ctx.fillRect(px, py, tw, SCALE * 2);
    ctx.fillStyle = '#48a0d0';
    if (horiz) {
      for (let i = 0; i < 3; i++) ctx.fillRect(px + SCALE * 3 + i * SCALE * 5, py + SCALE * 3, SCALE * 3, SCALE * 3);
    } else {
      for (let i = 0; i < 3; i++) ctx.fillRect(px + SCALE * 2, py + SCALE * 3 + i * SCALE * 5, SCALE * 3, SCALE * 3);
    }
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(px + tw - SCALE * 3, py + th * 0.35, SCALE * 2, SCALE * 2);
    if (waiting) drawWaitTag(ctx, px + tw / 2, py, '정차');
  }
}

function drawWaitTag(ctx, lx, py, label) {
  ctx.font = `bold ${SCALE * 3.2}px ${FONT_UI}`;
  ctx.textAlign = 'center';
  const ly = py - SCALE * 4;
  const tw2 = ctx.measureText(label).width;
  ctx.fillStyle = label === '택시' ? 'rgba(180,140,30,.92)' : label === '버스' ? 'rgba(180,48,48,.92)' : 'rgba(40,104,200,.92)';
  ctx.fillRect(lx - tw2 / 2 - SCALE, ly - SCALE * 3, tw2 + SCALE * 2, SCALE * 5);
  ctx.fillStyle = '#fcebc4';
  ctx.fillText(label, lx, ly);
}

/** 탑승 컷신: 차량이 들어와 → 타고 → 출발 → 도착 */
function drawRide() {
  if (!ride) return;
  const ctx = rideCtx;
  const W = rideCv.width, H = rideCv.height;
  const u = Math.max(1, (Math.min(W, H) / 240) | 0); // 픽셀 유닛
  const p = clamp01(ride.t / ride.dur);
  const kind = ride.kind;

  // 페이즈
  // 0.00–0.12 암전→승강장
  // 0.12–0.38 차량 진입
  // 0.38–0.48 정차·문 열림
  // 0.48–0.78 출발·터널
  // 0.78–1.00 도착 정차
  const fadeIn = clamp01(p / 0.12);
  const arriveT = clamp01((p - 0.12) / 0.26);
  const doorT = clamp01((p - 0.38) / 0.10);
  const goT = clamp01((p - 0.48) / 0.30);
  const landT = clamp01((p - 0.78) / 0.22);

  // 배경
  ctx.fillStyle = '#0e141c';
  ctx.fillRect(0, 0, W, H);

  const isTunnel = goT > 0 && landT === 0;
  if (isTunnel) {
    ctx.fillStyle = '#080c12';
    ctx.fillRect(0, 0, W, H);
    // 터널 줄무늬 (속도감)
    const scroll = (ride.t * 0.6) % (24 * u);
    for (let x = -24 * u; x < W + 24 * u; x += 24 * u) {
      ctx.fillStyle = '#121820';
      ctx.fillRect(x - scroll, H * 0.28, 10 * u, H * 0.44);
    }
    // 지나가는 중간 역 표지
    const mids = extractStations(ride.via);
    if (mids.length > 2) {
      const mid = mids[1 + ((ride.t / 400) | 0) % (mids.length - 2)];
      ctx.fillStyle = 'rgba(40,104,200,.85)';
      ctx.fillRect(W * 0.35, H * 0.16, W * 0.3, 14 * u);
      ctx.fillStyle = '#f8f0d8';
      ctx.font = `bold ${8 * u}px ${FONT_UI}`;
      ctx.textAlign = 'center';
      ctx.fillText(mid + '역', W / 2, H * 0.16 + 7 * u);
    }
  } else {
    // 승강장
    ctx.fillStyle = '#1a2430';
    ctx.fillRect(0, 0, W, H * 0.42);
    ctx.fillStyle = '#2a3438';
    ctx.fillRect(0, H * 0.42, W, H * 0.18); // 플랫폼
    ctx.fillStyle = '#c8a858';
    ctx.fillRect(0, H * 0.42, W, 3 * u); // 노란 안전선
    ctx.fillStyle = '#181c20';
    ctx.fillRect(0, H * 0.60, W, H * 0.40); // 선로
    // 침목
    for (let x = 0; x < W; x += 18 * u) {
      ctx.fillStyle = '#3a3028';
      ctx.fillRect(x, H * 0.72, 12 * u, 3 * u);
    }
    ctx.fillStyle = '#889098';
    ctx.fillRect(0, H * 0.70, W, 2 * u);
    ctx.fillRect(0, H * 0.78, W, 2 * u);
  }

  // 역 표지판
  if (!isTunnel) {
    const label = landT > 0 ? (ride.toStn || ride.name) : (ride.fromStn || '승강장');
    ctx.fillStyle = kind === 'metro' ? '#2868c8' : kind === 'bus' ? '#c84838' : '#d8b838';
    const tw = Math.min(W * 0.7, (label.length + 4) * 10 * u);
    const tx = (W - tw) / 2, ty = H * 0.12;
    ctx.fillRect(tx, ty, tw, 18 * u);
    ctx.fillStyle = '#f8f0d8';
    ctx.font = `bold ${10 * u}px ${FONT_UI}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label.slice(0, 14), W / 2, ty + 9 * u);
  }

  // 차량 위치
  let carX;
  const carW = Math.min(W * 0.78, 220 * u);
  const carH = 56 * u;
  const carY = H * 0.48;
  const parked = W * 0.5 - carW / 2;
  if (landT > 0) {
    carX = parked + (1 - easeInOut(landT)) * (W * 0.85 + carW);
  } else if (goT > 0) {
    carX = parked - easeInOut(goT) * (W + carW);
  } else if (p >= 0.12) {
    const t = p < 0.38 ? easeInOut(arriveT) : 1;
    carX = W + carW - t * (W * 0.5 + carW / 2 + carW);
  } else {
    carX = W + 40;
  }

  drawVehicle(ctx, carX, carY, carW, carH, u, kind, doorT, goT > 0 && landT === 0);

  // 탑승 안내
  ctx.globalAlpha = fadeIn;
  ctx.fillStyle = '#fcebc4';
  ctx.font = `bold ${9 * u}px ${FONT_UI}`;
  ctx.textAlign = 'center';
  let msg = '';
  if (p < 0.38) msg = kind === 'taxi' ? '택시가 오고 있어요…' : kind === 'bus' ? '버스가 들어와요…' : `${ride.fromStn}에 열차 진입…`;
  else if (p < 0.48) msg = `${ride.fromStn} 탑승!`;
  else if (p < 0.78) {
    const kmTxt = ride.km >= 0.5 ? `  ·  ${ride.km >= 10 ? Math.round(ride.km) : Math.round(ride.km * 10) / 10}km` : '';
    const minTxt = ride.mins ? `  ·  약 ${ride.mins}분` : '';
    msg = `${ride.line}  ·  ${ride.fromStn} → ${ride.toStn}${kmTxt}${minTxt}`;
  }
  else msg = `${ride.toStn} 도착  ·  ${ride.name}`;
  ctx.fillText(msg, W / 2, H * 0.90);
  ctx.globalAlpha = 1;

  // 암전 in/out
  if (p < 0.08) {
    ctx.fillStyle = `rgba(0,0,0,${1 - p / 0.08})`;
    ctx.fillRect(0, 0, W, H);
  } else if (p > 0.92) {
    ctx.fillStyle = `rgba(0,0,0,${(p - 0.92) / 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawVehicle(ctx, x, y, w, h, u, kind, doorT, speeding) {
  const body = kind === 'metro' ? '#d8dce0' : kind === 'bus' ? '#e84848' : '#f0d848';
  const accent = kind === 'metro' ? '#2868c8' : kind === 'bus' ? '#f0d848' : '#282828';
  const dark = '#2a3038';

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x + 4 * u, y + h - 2 * u, w - 8 * u, 6 * u);

  // 차체
  ctx.fillStyle = body;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = accent;
  ctx.fillRect(x, y, w, 8 * u);
  ctx.fillStyle = dark;
  ctx.fillRect(x, y + h - 6 * u, w, 6 * u);

  // 창문들
  const doorOpen = Math.min(1, doorT) * 10 * u;
  const winY = y + 14 * u, winH = h - 28 * u;
  const slots = kind === 'taxi' ? 2 : 4;
  const gap = 6 * u;
  const winW = (w - gap * (slots + 1)) / slots;
  for (let i = 0; i < slots; i++) {
    const wx = x + gap + i * (winW + gap);
    const isDoor = kind !== 'taxi' && (i === 1 || i === 2);
    const open = isDoor ? doorOpen : 0;
    ctx.fillStyle = speeding ? '#68c8f0' : '#48a0d0';
    ctx.fillRect(wx + open * 0.5, winY, Math.max(2, winW - open), winH);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(wx + open * 0.5 + 2 * u, winY + 2 * u, 4 * u, 3 * u);
    if (isDoor && doorOpen > 0) {
      ctx.fillStyle = '#1a2030';
      ctx.fillRect(wx + winW / 2 - open / 2, winY, open, winH);
    }
  }

  // 전조등 / 행선
  if (kind === 'metro') {
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(x + w - 28 * u, y + 2 * u, 22 * u, 5 * u);
  } else if (kind === 'bus') {
    ctx.fillStyle = '#f8f8f0';
    ctx.fillRect(x + 8 * u, y + 2 * u, 40 * u, 5 * u);
  } else {
    ctx.fillStyle = '#282828';
    ctx.fillRect(x + w / 2 - 6 * u, y - 4 * u, 12 * u, 5 * u); // 택시등
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(x + w / 2 - 4 * u, y - 3 * u, 8 * u, 3 * u);
  }

  // 바퀴 (버스/택시) 또는 대차 (지하철)
  if (kind === 'metro') {
    ctx.fillStyle = '#485058';
    ctx.fillRect(x + 16 * u, y + h - 2 * u, 28 * u, 5 * u);
    ctx.fillRect(x + w - 44 * u, y + h - 2 * u, 28 * u, 5 * u);
  } else {
    ctx.fillStyle = '#181818';
    ctx.beginPath(); ctx.arc(x + 18 * u, y + h, 6 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w - 18 * u, y + h, 6 * u, 0, Math.PI * 2); ctx.fill();
  }

  // 탑승 후 실루엣
  if (doorT > 0.4 || speeding) {
    ctx.fillStyle = '#3a4858';
    ctx.fillRect(x + w * 0.35, winY + 4 * u, 5 * u, winH - 6 * u);
    ctx.fillRect(x + w * 0.45, winY + 6 * u, 4 * u, winH - 8 * u);
    ctx.fillStyle = '#4890c8';
    ctx.fillRect(x + w * 0.52, winY + 8 * u, 4 * u, winH - 10 * u); // 작애
  }
}

function routeToTarget() {
  if (!DAY.stops[target]) { setAuto(false); return; }
  boardPending = null;

  // 다른 마을 → 포탈(GATE)까지 걸어간 뒤 맵 이동 컷신 (지하철 강제 아님)
  if (areaOf(target) !== areaIdx) {
    if (atGate()) { startHop(target); refreshList(); return; }
    const p = findPath(me.x, me.y, GATE[0], GATE[1]);
    if (p.length) { boardPending = target; queue = p; clickTarget = [...GATE]; refreshList(); return; }
    startHop(target); refreshList();
    return;
  }

  clickTarget = [...TRIG[target]];
  queue = findPath(me.x, me.y, ...TRIG[target]);
  if (!queue.length && me.x === TRIG[target][0] && me.y === TRIG[target][1]) stopDialog(target);
  refreshList();
}

function setAuto(v) {
  auto = v;
  autoBtn.classList.toggle('on', v);
  autoBtn.textContent = v ? '⏸ 일시정지' : '▶ 자동 여행';
  if (v) {
    manualQueue = []; clickTarget = null;
    if (target >= DAY.stops.length) target = 0;
    routeToTarget();
  } else { queue = []; pendingWarp = null; boardPending = null; }
  refreshList();
}
autoBtn.onclick = () => { hideToast(); sfx('confirm'); setAuto(!auto); };

/* ═══ 역 탑승 (A버튼) ═══ */
function stationHere() {
  let best = null, bestD = Infinity;
  for (const st of STATIONS) {
    // 역사 + 앞 광장
    if (me.x < st.x - 1 || me.x > st.x + st.w || me.y < st.y - 1 || me.y > st.y + st.h + 2) continue;
    const cx = st.x + st.w / 2, cy = st.y + st.h + 1;
    const d = Math.abs(cx - me.x) + Math.abs(cy - me.y);
    if (d < bestD) { bestD = d; best = st; }
  }
  return best;
}
function nearStation() { return !!stationHere(); }

function pickRoute(st) {
  const routes = st.routes || [];
  if (!routes.length) return null;
  return routes.find(r => r.toStop === target) || routes[0];
}

function nearbyNpc() {
  return npcs.find(npc => Math.abs(npc.x - me.x) + Math.abs(npc.y - me.y) === 1);
}
/** bags(잡담·이야기·팁)를 한데 모은 대사 풀 */
function npcLinePool(npc) {
  if (npc._linePool) return npc._linePool;
  const pool = [];
  if (npc.bags && npc.bags.length) {
    for (const bag of npc.bags) {
      for (const line of bag.lines || []) pool.push(line);
    }
  } else if (npc.lines && npc.lines.length) {
    pool.push(...npc.lines);
  }
  if (!pool.length) pool.push('…….');
  npc._linePool = pool;
  return pool;
}
/** 직전에 쓴 줄은 피해서 랜덤으로 한 줄 고름 */
function pickNpcLine(npc) {
  const pool = npcLinePool(npc);
  if (pool.length === 1) return pool[0];
  let i = (Math.random() * pool.length) | 0;
  if (i === npc.lastLineIndex) i = (i + 1 + ((Math.random() * (pool.length - 1)) | 0)) % pool.length;
  npc.lastLineIndex = i;
  return pool[i];
}
function openNpcDialog(npc) {
  if (me.moving) return;
  if (auto) setAuto(false);
  held.clear(); manualQueue = []; clickTarget = null;
  pendingWarp = null; boardPending = null; pendingSleep = false;
  npc.path = [];
  npc.wait = 1600 + Math.random() * 1200;
  npc.dir = me.x > npc.x ? 'right' : me.x < npc.x ? 'left' : me.y > npc.y ? 'down' : 'up';
  talkingNpc = npc;
  openDialog(npc.name, pickNpcLine(npc), {
    showOk: true,
    okLabel: '닫기',
    cancelable: true,
    npc: true
  });
}

function interactA() {
  hideToast();
  // 건물 안 출구 → 밖으로 / 야외 포탈 → 마을 선택
  if (atGate()) {
    if (interior) { exitInterior(); return; }
    openPortalMenu();
    return;
  }
  // 숙소 실내: 침대·프런트 옆에서 잠들기
  if (interior && (interior.kind === 'hotel') && isSleepStop(interior.stopIdx)) {
    if (nearHotelProp('bed', 'reception')) {
      openSleepConfirm(interior.stopIdx);
      return;
    }
  }
  // NPC는 실내·야외 모두 대화 가능
  const npc = nearbyNpc();
  if (npc) { openNpcDialog(npc); return; }
  if (interior) return; // 실내에서는 역·야외 스팟 상호작용 없음
  // 허브 역 — 갈 수 있는 일정 목록 (지하철/버스 선택)
  const st = stationHere();
  if (st) {
    openHubMenu(st);
    return;
  }
  const near = trigAt(me.x, me.y, true);
  if (near >= 0) { stopDialog(near); return; }
}

/* ═══ 입력 ═══ */
const held = new Set();
const KEYMAP = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
};
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (ride) { finishRide(); return; }
    if (dlgOpen) advanceDialog(); else interactA();
    return;
  }
  if (ride) return;
  if (KEYMAP[e.code]) { e.preventDefault(); held.add(e.code); if (auto) setAuto(false); manualQueue = []; clickTarget = null; arriveStop = -1; hideToast(); }
});
addEventListener('keyup', e => held.delete(e.code));

document.getElementById('cv').addEventListener('pointerdown', e => {
  if (ride) return;
  if (dlgOpen) { advanceDialog(); return; }
  hideToast();
  const tx = ((e.clientX + camXg) / TS) | 0, ty = ((e.clientY + camYg) / TS) | 0;
  if (auto) setAuto(false);
  let goal = null;
  if (walkable(tx, ty)) goal = [tx, ty];
  else for (const [dx, dy] of [[0, 1], [0, -1], [-1, 0], [1, 0]])
    if (walkable(tx + dx, ty + dy)) { goal = [tx + dx, ty + dy]; break; }
  if (!goal) return;
  const p = findPath(me.x, me.y, goal[0], goal[1]);
  if (p.length || (goal[0] === me.x && goal[1] === me.y)) { manualQueue = p; clickTarget = goal; arriveStop = -1; }
});

const toast = document.getElementById('toast');
let toastGone = false;
function hideToast() { if (!toastGone) { toastGone = true; toast.style.display = 'none'; } }

document.querySelectorAll('#dpad button').forEach(b => {
  const key = 'pad' + b.dataset.d;
  KEYMAP[key] = b.dataset.d.split(',').map(Number);
  const down = e => { e.preventDefault(); e.stopPropagation(); held.add(key); if (auto) setAuto(false); manualQueue = []; clickTarget = null; arriveStop = -1; hideToast(); };
  const up = e => { e.preventDefault(); held.delete(key); };
  b.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, up));
});
document.getElementById('abtn').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  if (ride) { finishRide(); return; }
  if (dlgOpen) advanceDialog(); else interactA();
});
document.getElementById('pad').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.body.addEventListener('touchmove', e => {

}, { passive: false });

/* ═══ 건물 내부 ═══ */
const INTERIOR_KIND_KO = {
  hotel: '숙소', airport: '공항', museum: '미술관', temple: '사원',
  restaurant: '식당', shop: '상점', tower: '전망대', arcade: '오락관'
};

/** 맵 데이터(야외/실내 공통)를 현재 월드에 적용 */
function applyWorldMap(M, opts = {}) {
  W = M.W; H = M.H; g = M.g; BLD = M.BLD; TRIG = M.TRIG; GATE = M.gate || M.spawn;
  ZONES = M.ZONES; STN_LABELS = M.STN_LABELS; STATIONS = M.STATIONS || []; RAILS = M.RAILS || [];
  waterTiles = M.waterTiles || [];
  waterTileLookup = new Map(waterTiles.map(tile => [tile.y * W + tile.x, tile]));
  initMetroTrains();
  trees = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!interior && g[y][x] === 4) trees.push({ x, y, variant: Math.floor(Math.random() * 10) });
  }
  blocked = new Set();
  BLD.forEach(b => { for (let j = b.y; j < b.y + b.h; j++) for (let x = b.x; x < b.x + b.w; x++) blocked.add(j * W + x); });
  bldCache = new Map();
  BLD.forEach(b => bldCache.set(b, renderBld(b)));

  lastTrig = -1; queue = []; manualQueue = []; clickTarget = null; pendingWarp = null; boardPending = null; arriveStop = -1;
  portalLatch = false;
  if (ride) { ride = null; rideEl.classList.remove('show'); }

  let at = M.spawn;
  if (opts.spawnStop != null && TRIG[opts.spawnStop]) {
    const [tx, ty] = TRIG[opts.spawnStop];
    at = walkable(tx, ty + 1) ? [tx, ty + 1] : [tx, ty];
  } else if (opts.spawn) {
    at = opts.spawn;
  }
  teleport(...at);
}

function enterInterior(stopIdx) {
  const s = DAY.stops[stopIdx];
  if (!s || interior) return;
  const kind = interiorKind(s.name);
  if (!kind) return;
  if (dlgOpen) {
    clearInterval(typing); typing = null;
    clearHubButtons();
    dlg.style.display = 'none'; dlgOpen = false; dlgStop = -1; npcDialog = false;
    talkingNpc = null;
  }
  outdoorsReturn = stopIdx;
  interior = { stopIdx, kind, theme: interiorTheme(s.name), title: s.name };
  if (auto) setAuto(false);
  npcs = []; npcBlocked = new Set();
  const M = buildInteriorMap(kind, s);
  applyWorldMap(M);
  // 이 스팟에 묶인 NPC만 실내에 (있으면)
  const residents = (NPC_BY_DAY[dayIdx + 1] || []).filter(d => d.stop === stopIdx);
  const roomLabels = M.STN_LABELS.map(l => l[2]);
  const canSleepHere = kind === 'hotel' && isSleepStop(stopIdx);
  const guideLines = canSleepHere
    ? [
        `${roomLabels.slice(0, 3).join(' · ')} 이에요. 침대나 프런트 옆에서 A를 누르면 잠들 수 있어요.`,
        '오늘 일정을 마쳤다면 침대 앞에서 쉬어 보세요. 남쪽 문은 나가는 길이에요.'
      ]
    : [
        `${roomLabels.slice(0, 3).join(' · ')} 공간을 둘러보세요.`,
        '가구 사이 통로로 한 바퀴 걸어볼 수 있어요. 남쪽 문은 나가는 길이에요.'
      ];
  placeNpcs([...residents, { stop: stopIdx, name: canSleepHere ? '프런트 직원' : '공간 안내원', pal: 2,
    anchor: [6, 6], bags: [{ kind: '안내', lines: guideLines }] }]);
  const label = INTERIOR_KIND_KO[kind] || '건물';
  document.getElementById('hudTitle').textContent = `${shortName(s)} · ${label}`;
  refreshList();
}

function exitInterior() {
  if (!interior) return;
  const stop = outdoorsReturn ?? interior.stopIdx;
  const ai = areaOf(stop);
  interior = null;
  outdoorsReturn = null;
  loadArea(ai, { spawnStop: stop });
}

/* ═══ 일차 로드 ═══ */
function goStop(i) {
  hideToast();
  if (auto) setAuto(false);
  if (interior) {
    const ret = outdoorsReturn ?? interior.stopIdx;
    interior = null;
    outdoorsReturn = null;
    loadArea(areaOf(ret), { spawnStop: ret });
  }
  // 다른 마을 → 포탈까지 걸어가 맵 이동 / 같은 마을 → 바로 걷기
  if (areaOf(i) !== areaIdx) { walkToPortal(i); return; }
  travelInMap(i);
}

/** 마을(에리어) 로드 — 하루 안에서 맵 이동. 자동여행/목표는 유지 */
function loadArea(ai, opts = {}) {
  if (dlgOpen) {
    clearInterval(typing); typing = null;
    clearHubButtons();
    dlg.style.display = 'none'; dlgOpen = false; dlgStop = -1; npcDialog = false;
    talkingNpc = null;
  }
  // 실내 상태 해제 (exitInterior → loadArea 경로 포함)
  if (!opts.keepInterior) {
    interior = null;
    outdoorsReturn = null;
  }
  npcs = []; npcBlocked = new Set();
  areaIdx = ai;
  const M = buildAreaMap(dayIdx, ai);
  applyWorldMap(M, opts);
  placeNpcs((NPC_BY_DAY[dayIdx + 1] || []).filter(d => AREAS[ai].stops.includes(d.stop)));
  document.getElementById('hudTitle').textContent = `${AREAS[ai].name} · ${DAY.t}`;
  refreshList();
}

function loadDay(i) {
  if (npcDialog) {
    clearInterval(typing); typing = null;
    dlg.style.display = 'none'; dlgOpen = false; dlgStop = -1; npcDialog = false;
    talkingNpc = null;
  }
  dayIdx = i; DAY = DAYS[i];
  // 건물 캐시도 현재 시간대의 창문 색으로 생성한다.
  currentTime = START_TIME_BY_DAY[i + 1] ?? 'morning';
  AREAS = buildAreas(DAY);

  visited = new Set(); // 방문 시스템 제거 — 호환용 빈 셋만 유지
  target = 0;
  if (auto) { auto = false; autoBtn.classList.remove('on'); autoBtn.textContent = '▶ 자동 여행'; }
  loadArea(areaOf(0), { spawnStop: 0 });

  document.getElementById('hudDay').textContent = `DAY ${DAY.no} · ${DAY.d}`;
  // 소지 창(Party) 슬롯: 왼쪽 도트 아이콘 · 오른쪽 시간+이름 · 한 줄 평(note)
  listEl.innerHTML = DAY.stops.map((s, k) =>
    `<li data-i="${k}"><span class="ic ${stopKind(s)}"></span>` +
    `<span class="hd"><span class="tm">${s.time}</span><span class="nm">${s.name}</span></span>` +
    `<span class="sub">[${AREAS[areaOf(k)]?.name || ''}] ${(s.note || s.why || '').replace(/</g, '&lt;')}</span></li>`).join('');
  listEl.querySelectorAll('li').forEach(li => li.addEventListener('click', () => { sfx('confirm'); goStop(+li.dataset.i); }));
  mStops.innerHTML = DAY.stops.map((s, k) =>
    `<button type="button" data-i="${k}">${s.time} ${shortName(s)}</button>`).join('');
  mStops.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { sfx('confirm'); goStop(+b.dataset.i); }));

  save.day = i; persist();
  refreshDays();
  refreshList();
}
progEl.addEventListener('click', () => {
  sfx('tick');
  goStop(Math.min(target, DAY.stops.length - 1));
});

/* ═══ 렌더 ═══ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  ctx.imageSmoothingEnabled = false;
  if (ride) resizeRide();
}
addEventListener('resize', resize); resize();

let last = 0, waterF = 0, waterT = 0, camXg = 0, camYg = 0;

const leaves = Array.from({ length: 12 }, () => ({
  x: Math.random() * cv.width,
  y: Math.random() * cv.height,
  spd: 0.3 + Math.random() * 0.4,
  sway: Math.random() * Math.PI * 2,
  size: 2 + Math.floor(Math.random() * 2),
  color: Math.random() < 0.5 ? PAL.autumnLight : PAL.autumnMid,
}));
function updateLeaves(dt) {
  const step = dt / (1000 / 60);
  for (const leaf of leaves) {
    leaf.sway += 0.018 * step;
    leaf.y += leaf.spd * step;
    leaf.x += Math.sin(leaf.sway) * 0.3 * step;
    if (leaf.y > cv.height) { leaf.y = -leaf.size; leaf.x = Math.random() * cv.width; }
    if (leaf.x < -leaf.size) leaf.x = cv.width;
    else if (leaf.x > cv.width) leaf.x = -leaf.size;
  }
}

function updateEnt(ent, dt) {
  if (!ent.moving) return;
  const dur = ent.moveDur || DUR;
  ent.t += dt / dur;
  if (ent.t >= 1) {
    ent.t = 0; ent.moving = false;
    ent.px = ent.x * TS; ent.py = ent.y * TS;
    ent.frame = 0;
  } else {
    ent.px = (ent.fx + (ent.x - ent.fx) * ent.t) * TS;
    ent.py = (ent.fy + (ent.y - ent.fy) * ent.t) * TS;
    ent.frame = ent.t < .5 ? 1 : 0;
  }
}

function loop(now) {
  const dt = Math.min(50, now - last); last = now;
  waterT += dt; if (waterT > 480) { waterT = 0; waterF = 1 - waterF; }
  bounce += dt;

  if (ride) {
    updateRide(dt);
    requestAnimationFrame(loop);
    return;
  }

  updateLeaves(dt);
  updateMetroTrains(dt);

  const wasMoving = me.moving;
  updateEnt(me, dt); updateEnt(wife, dt); updateEnt(pet, dt);
  updateNpcs(dt);

  if (wasMoving && !me.moving) {
    const ti = trigAt(me.x, me.y);
    // 포탈(GATE)에 올라오면: 실내→나가기 / 예약 목적지→맵 이동 / 아니면 마을 선택
    if (atGate() && !dlgOpen && !ride) {
      if (interior) {
        if (!portalLatch) { portalLatch = true; exitInterior(); }
      } else if (boardPending != null) {
        const bp = boardPending; boardPending = null; portalLatch = true;
        startHop(bp);
      } else if (!auto && !portalLatch) {
        portalLatch = true;
        openPortalMenu();
      }
    } else if (!atGate()) {
      portalLatch = false;
    }
    if (auto && queue.length === 0 && ti === target) stopDialog(ti);
    else if (!auto && arriveStop >= 0 && manualQueue.length === 0 && ti === arriveStop) {
      const k = arriveStop; arriveStop = -1; stopDialog(k);
    }
    if (ti < 0) lastTrig = -1;
  }

  if (!dlgOpen && !me.moving) {
    if (auto && queue.length) { const [nx, ny] = queue.shift(); tryMoveTo(nx, ny); }
    else if (!auto) {
      let usedKey = false;
      for (const k of held) { const d = KEYMAP[k]; if (d) { tryMove(d[0], d[1]); usedKey = true; break; } }
      if (!usedKey && manualQueue.length) {
        const [nx, ny] = manualQueue.shift(); tryMoveTo(nx, ny);
        if (!manualQueue.length) clickTarget = null;
      }
    }
  }

  draw();
  requestAnimationFrame(loop);
}

// 기존 RAF 타임스탬프(초)를 사용한다. 좌표·크기는 타일 단위다.
function drawWaterSparkle(q, tile, t, camX, camY) {
  const { x, y, w, h } = tile;
  const night = currentTime === 'midnight' || currentTime === 'evening';
  const previousAlpha = q.globalAlpha;
  q.fillStyle = night ? '#6898b8' : PAL.waterHilite;
  for (let i = 0; i < 3; i++) {
    // x/y의 서로 다른 가중치로 대각선 이웃까지 위상이 겹치지 않게 한다.
    const phase = t * 0.6 + i * 2.1 + x * 1.73 + y * 2.39;
    const pulse = (Math.sin(phase * 1.3) + 1) / 2;
    if (pulse <= 0.6) continue;
    const sx = Math.floor((w * 0.5 + Math.sin(phase) * w * 0.3) * TILE);
    const sy = Math.floor((h * 0.5 + Math.cos(phase * 0.7) * h * 0.2) * TILE);
    // 문턱에서 부드럽게 나타나며 기존 픽셀 크기와 맞춘다.
    q.globalAlpha = previousAlpha * ((pulse - 0.6) / 0.4) * (night ? 0.55 : 0.75);
    q.fillRect(((x * TS - camX) | 0) + sx * SCALE,
      ((y * TS - camY) | 0) + sy * SCALE, SCALE, SCALE);
  }
  q.globalAlpha = previousAlpha;
}

// Original pixel-only room materials; outdoor atlas and palettes stay untouched.
function drawInteriorTile(t, x, y, sx, sy) {
  const theme = interior.theme;
  const dark = ['planets', 'joypolis', 'yakiniku'].includes(theme);
  const wood = ['sectionL', 'ryokan', 'monja', 'sushi', 'afuri', 'gajoen', 'sensoji'].includes(theme);
  const accent = ({haneda:'#a85860',sectionL:'#bc7868',sensoji:'#b85848',planets:'#486080',
    joypolis:'#685090',lawson:'#5888b0',matcha:'#809858',gajoen:'#ad8050',ryokan:'#989060',
    sushi:'#879ca0',afuri:'#b8a258',yakiniku:'#805b48',ropeway:'#688fa0'})[theme] || '#9c8068';
  const pixel = (a,b,w,h,c) => {ctx.fillStyle=c;ctx.fillRect(sx+a*SCALE,sy+b*SCALE,w*SCALE,h*SCALE);};
  if (t === 4 || t === 9) {
    pixel(0,0,16,16,dark?'#343248':'#85735e');
    pixel(1,1,14,11,dark?'#55536b':'#dbceb2');
    pixel(1,2,14,1,dark?'#73738b':'#f2e8d0');
    pixel(0,12,16,2,accent); pixel(0,15,16,1,'#50483d');
  } else if (t === 1 || t === 8) {
    pixel(0,0,16,16,accent); pixel(1,1,14,1,'#c7af87');
    pixel(1,2,1,13,'#c7af87'); pixel(5,7,2,2,dark?'#8a80a8':'#d4bb96');
    pixel(12,12,1,1,'#705c50');
  } else if (t === 5 || t === 7 || (t === 2 && wood)) {
    pixel(0,0,16,16,t===5?'#b3b47e':'#c8a97b');
    for(let row=3;row<16;row+=4) pixel(0,row,16,1,t===5?'#a0a171':'#ac895f');
    pixel((y%2)*8,0,1,16,t===5?'#647957':'#95734f');
  } else {
    pixel(0,0,16,16,dark||t===0?'#34374e':'#e2dbc6');
    pixel(0,15,16,1,dark||t===0?'#494b65':'#c2bba8');
    pixel(15,0,1,16,dark||t===0?'#494b65':'#c2bba8');
    pixel(1,1,14,1,dark||t===0?'#41465f':'#f1ead5');
  }
}

function draw() {
  const vw = cv.width, vh = cv.height;
  let camX = me.px + TS / 2 - vw / 2, camY = me.py + TS / 2 - vh / 2;
  camX = Math.max(0, Math.min(W * TS - vw, camX));
  camY = Math.max(0, Math.min(H * TS - vh, camY));
  if (W * TS < vw) camX = (W * TS - vw) / 2;
  if (H * TS < vh) camY = (H * TS - vh) / 2;
  camXg = camX; camYg = camY;

  ctx.fillStyle = PAL.sky; ctx.fillRect(0, 0, vw, vh);

  const x0 = Math.max(0, (camX / TS) | 0), x1 = Math.min(W, Math.ceil((camX + vw) / TS));
  const y0 = Math.max(0, (camY / TS) | 0), y1 = Math.min(H, Math.ceil((camY + vh) / TS));
  for (let y = y0; y < y1; y++)
    for (let x = x0; x < x1; x++) {
      const t = g[y][x];
      const f = (t === 0 || t === 3 || t === 5 || t === 8) ? waterF : 0;
      if (interior && t !== 3 && t < 10) drawInteriorTile(t, x, y, (x * TS - camX) | 0, (y * TS - camY) | 0);
      else ctx.drawImage(atlas, (t === 4 ? 0 : t) * 16, f * 16, 16, 16, (x * TS - camX) | 0, (y * TS - camY) | 0, TS, TS);
      // 카메라 범위의 물만 계산. 건물·캐릭터·시간대 틴트보다 아래에 그린다.
      if (t === 3) {
        const tile = waterTileLookup.get(y * W + x);
        if (tile) drawWaterSparkle(ctx, tile, last / 1000, camX, camY);
      }
    }

  drawMetroOverlay(camX, camY);

  // 가미나리몬 제등 — 아사쿠사 절 앞
  if (dayIdx === 1) {
    const gate = BLD.find(b => b.s === 'temple') || BLD.find(b => b.s === 'pagoda');
    if (gate) {
      const lx = (gate.x + gate.w / 2 - 1) * TS - camX;
      const ly = (gate.y + gate.h) * TS - camY;
      ctx.fillStyle = PAL.roofDark; ctx.fillRect(lx - TS * .2, ly + TS * .1, TS * 2.4, SCALE * 3);
      ctx.fillStyle = PAL.accentRed; ctx.fillRect(lx + TS * .25, ly + TS * .28, TS * 1.1, TS * .62);
      ctx.fillStyle = '#3a2618'; ctx.fillRect(lx + TS * .25, ly + TS * .52, TS * 1.1, SCALE * 2);
    }
  }

  // y 정렬 (나무 + 건물 + 캐릭터)
  const items = [];
  for (const tree of trees) {
    if (tree.x < x0 || tree.x >= x1 || tree.y < y0 || tree.y >= y1) continue;
    items.push({ y: (tree.y + 1) * TS, d: () => ctx.drawImage(
      treeSprites[tree.variant], (tree.x * TS - camX) | 0, (tree.y * TS - camY) | 0, TS, TS
    ) });
  }
  BLD.forEach(b => items.push({ y: (b.y + b.h) * TS, d: () => ctx.drawImage(bldCache.get(b), b.x * TS - camX, b.y * TS - camY, b.w * TS, b.h * TS) }));
  npcs.forEach(npc => items.push({ y: npc.py + TS, d: () =>
    drawChar(ctx, npc.px - camX, npc.py - camY, npc.dir, npc.frame, npc.pal || PAL_NPC, npc.name) }));
  items.push({ y: pet.py + TS - 2, d: () => drawJakae(ctx, pet.px - camX, pet.py - camY, pet.dir, pet.frame, PAL_JAKAE, '작애') });
  items.push({ y: wife.py + TS, d: () => drawChar(ctx, wife.px - camX, wife.py - camY, wife.dir, wife.frame, PAL_WIFE, '규원') });
  items.push({ y: me.py + TS + 2, d: () => drawChar(ctx, me.px - camX, me.py - camY, me.dir, me.frame, PAL_ME, '규빈') });
  items.sort((a, b) => a.y - b.y).forEach(it => it.d());

  // 마을 이름·역 라벨 — 건물/나무 위에
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${SCALE * 6}px ${FONT_UI}`;
  ZONES.forEach(([nm, zx, zy]) => {
    const ax = zx * TS - camX, ay = zy * TS - camY;
    ctx.fillStyle = 'rgba(252,235,196,.7)';
    ctx.fillText(nm, ax + SCALE, ay + SCALE);
    ctx.fillStyle = 'rgba(92,52,24,.88)';
    ctx.fillText(nm, ax, ay);
  });
  ctx.font = `bold ${SCALE * 3.8}px ${FONT_UI}`;
  STN_LABELS.forEach(([zx, zy, nm]) => {
    const ax = zx * TS - camX, ay = zy * TS - camY;
    const tw = ctx.measureText(nm).width;
    ctx.fillStyle = 'rgba(92,52,24,.92)';
    ctx.fillRect(ax - tw / 2 - SCALE * 2, ay - SCALE * 4, tw + SCALE * 4, SCALE * 7);
    ctx.fillStyle = '#c48a48';
    ctx.fillRect(ax - tw / 2 - SCALE * 2, ay - SCALE * 4, tw + SCALE * 4, 2);
    ctx.fillStyle = '#fcebc4';
    ctx.fillText(nm, ax, ay);
  });

  // 포탈(마을 출구) — 아래쪽 게이트, 깜빡이는 화살표 + 라벨
  {
    const [gx, gy] = GATE;
    const px = gx * TS - camX + TS / 2, py = gy * TS - camY + TS * 0.15;
    const pulse = 0.55 + 0.45 * Math.sin(bounce / 200);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#2858c8';
    ctx.beginPath();
    ctx.moveTo(px - SCALE * 5, py); ctx.lineTo(px + SCALE * 5, py); ctx.lineTo(px, py + SCALE * 6);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = `bold ${SCALE * 3.6}px ${FONT_UI}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const pl = interior ? '나가기' : '출구';
    const ptw = ctx.measureText(pl).width;
    ctx.fillStyle = interior ? 'rgba(200,64,64,.9)' : 'rgba(40,88,200,.9)';
    ctx.fillRect(px - ptw / 2 - SCALE * 2, py - SCALE * 10, ptw + SCALE * 4, SCALE * 7);
    ctx.fillStyle = '#fcebc4';
    ctx.fillText(pl, px, py - SCALE * 6.5);
  }

  // 순서표·이름표 — 건물 위에 그리기 (가려지지 않게)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  TRIG.forEach((t, i) => {
    if (!t) return; // 다른 마을의 스팟은 이 맵에 없음
    const [x, y] = t;
    const sx = x * TS - camX + TS * .55, sy = y * TS - camY - TS * .4;
    ctx.fillStyle = '#5c3418'; ctx.fillRect(sx + SCALE * 3, sy + SCALE * 8, SCALE * 3, SCALE * 6);
    ctx.fillStyle = (auto && i === target) ? '#f0c060' : '#fcebc4';
    ctx.fillRect(sx, sy, SCALE * 9, SCALE * 8);
    ctx.fillStyle = '#5c3418';
    ctx.fillRect(sx, sy, SCALE * 9, 2); ctx.fillRect(sx, sy + SCALE * 8 - 2, SCALE * 9, 2);
    ctx.fillRect(sx, sy, 2, SCALE * 8); ctx.fillRect(sx + SCALE * 9 - 2, sy, 2, SCALE * 8);
    ctx.fillStyle = '#c48a48';
    ctx.fillRect(sx + 2, sy + 2, SCALE * 9 - 4, 1);
    ctx.fillStyle = '#3d2914';
    ctx.font = `bold ${SCALE * 5}px ${FONT_UI}`;
    ctx.fillText(i + 1, sx + SCALE * 4.5, sy + SCALE * 4.4);
    const label = `${DAY.stops[i].time} ${shortName(DAY.stops[i])}`;
    ctx.font = `bold ${SCALE * 4}px ${FONT_UI}`;
    const tw = ctx.measureText(label).width;
    const bx = sx + SCALE * 4.5 - tw / 2 - SCALE * 3, by = sy - SCALE * 14;
    ctx.fillStyle = 'rgba(92,52,24,.92)';
    ctx.fillRect(bx, by, tw + SCALE * 6, SCALE * 8);
    ctx.fillStyle = '#c48a48';
    ctx.fillRect(bx, by, tw + SCALE * 6, 2);
    ctx.fillStyle = (auto && i === target) ? '#e07040' : '#e8b848';
    ctx.fillText(label, sx + SCALE * 4.5, by + SCALE * 4.2);
  });

  // 타깃 화살표
  const tgt = auto && target < TRIG.length && !dlgOpen ? (clickTarget || TRIG[target]) : clickTarget;
  if (tgt) {
    const ax = tgt[0] * TS - camX + TS / 2, ay = tgt[1] * TS - camY - TS * .7 + Math.sin(bounce / 180) * SCALE * 2;
    ctx.fillStyle = auto ? PAL.accentRed : '#2858c8';
    ctx.beginPath();
    ctx.moveTo(ax - SCALE * 4, ay); ctx.lineTo(ax + SCALE * 4, ay); ctx.lineTo(ax, ay + SCALE * 5);
    ctx.closePath(); ctx.fill();
  }

  // 낙엽도 같은 시간대의 빛을 받도록 틴트 바로 아래에 그린다.
  for (const leaf of (interior ? [] : leaves)) {
    ctx.fillStyle = leaf.color;
    ctx.fillRect(leaf.x | 0, leaf.y | 0, leaf.size, leaf.size);
  }

  // 캐릭터·이름표까지 그린 뒤 전체 장면에 시간대 틴트를 적용한다.
  ctx.fillStyle = interior ? 'rgba(0,0,0,0)' : TIME_TINTS[currentTime].overlay;
  ctx.fillRect(0, 0, cv.width, cv.height);
}

/* ═══ BGM: GBA 포켓몬 마을풍 원곡 칩튠 (닌텐도 원곡·음원 미사용) ═══ */
const bgmBtn = document.getElementById('bgmBtn');
let audioCtx = null, bgmOn = false, bgmTimer = null, masterGain = null;

// 16분음표 단위. null=쉼. 밝은 장조·빠른 템포·펄스 멜로디 (루트마을 느낌의 "장르"만 오마주)
const SONG = {
  tempo: 132,
  // 리드: 짧은 모티프 반복 + 한 옥타브 점프 (GB 펄스 채널 감성)
  lead: [
    // A — 마을 아침
    0,null,4,7, 12,null,7,4, 0,4,7,12, 11,9,7,4,
    5,null,9,12, 16,null,12,9, 5,9,12,16, 14,12,9,5,
    7,null,11,14, 19,null,14,11, 7,11,14,19, 17,16,14,11,
    12,11,9,7, 9,7,5,4, 5,4,2,0, 4,7,12,null,
    // B — 모험 한 스푼
    12,12,16,19, 16,12,7,4, 5,9,12,16, 14,12,9,7,
    0,4,7,12, 11,12,14,16, 12,9,7,5, 7,9,12,16,
    19,16,14,12, 16,14,12,9, 14,12,9,7, 12,9,7,4,
    5,7,9,12, 7,5,4,0, 4,7,12,16, 12,7,4,null,
  ],
  // 하모니: 3도/5도 아르페지오 (2번 펄스 채널)
  harm: [
    4,7,12,7, 4,7,12,7, 4,7,12,7, 2,5,9,5,
    9,12,16,12, 9,12,16,12, 9,12,16,12, 7,11,14,11,
    11,14,19,14, 11,14,19,14, 11,14,19,14, 9,12,16,12,
    7,12,16,12, 5,9,12,9, 4,7,12,7, 0,4,7,null,
    7,12,16,12, 4,7,12,7, 9,12,16,12, 5,9,12,9,
    4,7,12,7, 7,11,14,11, 5,9,12,9, 7,12,16,12,
    12,16,19,16, 9,12,16,12, 7,11,14,11, 4,7,12,7,
    5,9,12,9, 0,4,7,4, 4,7,12,16, 7,4,0,null,
  ],
  // 베이스: I–V–vi–IV / I–IV–V–I 루프 (웨이브채널풍 낮은 펄스)
  bass: [
    0,0,7,0, 0,0,7,0, 0,0,7,0, -5,-5,2,-5,
    5,5,12,5, 5,5,12,5, 5,5,12,5, 0,0,7,0,
    7,7,14,7, 7,7,14,7, 7,7,14,7, 5,5,12,5,
    0,0,7,0, -5,-5,2,-5, 0,0,7,0, 0,0,7,null,
    0,0,7,0, 0,0,7,0, 5,5,12,5, 5,5,12,5,
    0,0,7,0, 7,7,14,7, 5,5,12,5, 0,0,7,0,
    9,9,16,9, 5,5,12,5, 7,7,14,7, 0,0,7,0,
    5,5,12,5, 0,0,7,0, 7,7,14,7, 0,0,7,null,
  ],
};

function noteHz(semi, oct = 4) {
  if (semi == null || Number.isNaN(semi)) return 0;
  return 440 * Math.pow(2, (semi - 9) / 12 + (oct - 4));
}

function tone(freq, t0, dur, type, gain, detune = 0) {
  if (!audioCtx || !masterGain || !freq) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  o.detune.value = detune;
  const atk = Math.min(0.012, dur * 0.12);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + atk);
  // GB 펄스처럼 빨리 감쇠
  g.gain.exponentialRampToValueAtTime(gain * 0.55, t0 + dur * 0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

/** GB 노이즈 채널풍 하이햇 */
function softNoise(t0, dur, gain) {
  if (!audioCtx || !masterGain) return;
  const n = Math.max(1, (audioCtx.sampleRate * dur) | 0);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 3500; f.Q.value = 0.7;
  src.buffer = buf;
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t0); src.stop(t0 + dur + 0.02);
}

function scheduleBar(startStep, when) {
  const beat = 60 / SONG.tempo / 4; // 16분음표
  const len = SONG.lead.length;
  const chunk = 16;
  for (let s = 0; s < chunk; s++) {
    const i = (startStep + s) % len;
    const t0 = when + s * beat;
    const lead = SONG.lead[i];
    const harm = SONG.harm[i];
    const bass = SONG.bass[i];
    // 리드: 스퀘어 + 살짝 디튠 (펄스 두껍게)
    if (lead != null) {
      tone(noteHz(lead, 5), t0, beat * 0.88, 'square', 0.055);
      tone(noteHz(lead, 5), t0, beat * 0.88, 'square', 0.022, 7);
      // 짧은 에코 (포켓몬 멜로디 잔향감)
      tone(noteHz(lead, 5), t0 + beat * 0.5, beat * 0.55, 'square', 0.016);
    }
    // 하모니: 아르페지오 펄스 (여리게)
    if (harm != null) tone(noteHz(harm, 5), t0, beat * 0.75, 'square', 0.018);
    // 베이스: 옥타브 아래 삼각+스퀘어
    if (bass != null && s % 2 === 0) {
      tone(noteHz(bass, 3), t0, beat * 1.85, 'triangle', 0.08);
      tone(noteHz(bass, 2), t0, beat * 1.85, 'square', 0.025);
    }
    // 킥 비슷한 낮은 틱 (매 박)
    if (s % 4 === 0) tone(noteHz(-12, 2), t0, beat * 0.35, 'triangle', 0.05);
    // 하이햇 8분음
    if (s % 2 === 1) softNoise(t0, 0.035, 0.02);
    else if (s % 4 === 2) softNoise(t0, 0.028, 0.014);
  }
  return chunk;
}

let bgmStep = 0;
function bgmLoop() {
  if (!bgmOn || !audioCtx) return;
  const beat = 60 / SONG.tempo / 4;
  const when = audioCtx.currentTime + 0.05;
  const advanced = scheduleBar(bgmStep, when);
  bgmStep = (bgmStep + advanced) % SONG.lead.length;
  bgmTimer = setTimeout(bgmLoop, advanced * beat * 1000 - 30);
}

/** 오디오 컨텍스트 1회 생성 (BGM·효과음 공용) — 사용자 제스처 안에서만 호출 */
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.8;
  // GBA처럼 조금 밝게 (너무 먹먹하지 않게)
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 7800;
  masterGain.connect(lp); lp.connect(audioCtx.destination);
}

/* ═══ 8비트 메뉴 효과음 (GB 펄스파 · 외부 파일 없음) ═══ */
function blip(freq, t0, dur, gain = 0.11) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(gain, t0);
  g.gain.setValueAtTime(gain, t0 + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
/**
 * 'tick'    → 띡-  : 커서 이동·창 넘김 (짧은 고음 1발)
 * 'confirm' → 삑!  : 선택 확정 (낮은음→높은음 2단)
 */
function sfx(kind = 'tick') {
  try {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { return; }
  const t = audioCtx.currentTime + 0.004;
  if (kind === 'confirm') {
    blip(1046.5, t, 0.05);           // C6
    blip(2093.0, t + 0.05, 0.10);    // C7
  } else {
    blip(1760, t, 0.045);            // A6
  }
}

async function setBgm(on) {
  bgmOn = on;
  bgmBtn.classList.toggle('off', !on);
  bgmBtn.textContent = on ? '♪ BGM' : '♪ OFF';
  if (on) {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    bgmStep = 0;
    clearTimeout(bgmTimer);
    bgmLoop();
  } else {
    clearTimeout(bgmTimer); bgmTimer = null;
  }
}
bgmBtn.onclick = () => { hideToast(); sfx('tick'); setBgm(!bgmOn); };
function tryAutoBgm() {
  if (bgmOn) return;
  setBgm(true);
  removeEventListener('pointerdown', tryAutoBgm);
  removeEventListener('keydown', tryAutoBgm);
}
addEventListener('pointerdown', tryAutoBgm);
addEventListener('keydown', tryAutoBgm);

loadDay(save.day || 0);
requestAnimationFrame(loop);
</script>
</body>
