<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>도쿄 산책 · 골드 픽셀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ── GBC 포켓몬 골드 팔레트 ── */
  --gb-bg:#E0E8D0;--gb-bg-deep:#C8D0B8;--gb-shade:#A0A890;
  --gb-ink:#202020;--gb-ink-soft:#484848;--gb-white:#F8F8F8;
  --gb-gold:#D4A373;--gb-gold-deep:#A87848;--gb-gold-light:#F0D8B0;
  --gb-navy:#283860;--gb-navy-deep:#182440;--gb-navy-light:#4A5A88;
  --gb-red:#C84040;--gb-green:#587848;
  /* 구 변수 호환 (JS/인라인에서 참조 가능) */
  --ink:var(--gb-ink);--cream:var(--gb-white);--gold:var(--gb-gold);--ember:var(--gb-red);
  --leaf:var(--gb-green);--wood-dark:var(--gb-ink);--wood-mid:var(--gb-navy);--wood-light:var(--gb-gold);
  --parchment:var(--gb-bg);--parchment-deep:var(--gb-bg-deep);
  /* UI는 읽기 좋은 고딕, 픽셀 폰트는 캔버스 장식용 */
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --font-pixel:'Galmuri11','Galmuri9',monospace;
  /* 납작한 GB 버튼 음영 */
  --bevel:inset -2px -2px 0 var(--gb-shade),inset 2px 2px 0 var(--gb-white);
  --bevel-in:inset 2px 2px 0 var(--gb-shade),inset -2px -2px 0 var(--gb-white);
  --bevel-navy:inset -2px -2px 0 var(--gb-navy-deep),inset 2px 2px 0 var(--gb-navy-light);
  --bevel-gold:inset -2px -2px 0 var(--gb-gold-deep),inset 2px 2px 0 var(--gb-gold-light);
}
html,body{height:100%;overflow:hidden;background:var(--gb-bg)}
body{font-family:var(--font);font-weight:500;font-size:13px;line-height:1.55;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  -webkit-user-select:none;user-select:none;color:var(--gb-ink)}
canvas{display:block;image-rendering:pixelated}
#cv{filter:saturate(1.08) contrast(1.06)}
button,a{font-family:inherit;font-weight:600;border-radius:0;text-shadow:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--gb-navy);outline-offset:2px}

/* ── 골드 대화창 프레임: 흰 상자 + 검은 두 줄 테두리 ── */
.panel{
  position:fixed;background:var(--gb-white);color:var(--gb-ink);
  border:2px solid var(--gb-ink);border-radius:0;padding:12px;
  box-shadow:inset 0 0 0 2px var(--gb-white),inset 0 0 0 4px var(--gb-ink);
}
/* ── 납작한 GB 버튼 ── */
.wood-btn,#days button,#dlg .acts a,#dlg .acts button,#mStops button,#prog,.pill,#hudFold{
  display:inline-block;font-family:inherit;font-size:12px;line-height:1.35;font-weight:600;
  background:var(--gb-bg);color:var(--gb-ink);cursor:pointer;text-decoration:none;
  border:2px solid var(--gb-ink);border-radius:0;box-shadow:var(--bevel);transition:none;
}
.wood-btn:active,#days button:not(:disabled):active,#dlg .acts a:active,
#dlg .acts button:active,#mStops button:active,#prog:active,.pill:active,#hudFold:active{
  transform:none;box-shadow:var(--bevel-in);background:var(--gb-bg-deep);
}

/* ── HUD: 포켓기어 카드 ── */
#hud{top:14px;left:14px;padding:0;width:min(288px,calc(100vw - 28px));z-index:10;overflow:hidden}
#hud .day{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;letter-spacing:.06em;font-weight:700;
  color:var(--gb-gold-light);background:var(--gb-navy);
  padding:8px 10px 7px 12px;margin:4px 4px 0;border-bottom:2px solid var(--gb-ink);
}
#hud .day .dayLabel::before{content:'▣ ';color:var(--gb-gold)}
#hudFold{flex:none;width:34px;height:28px;padding:0;margin:0;line-height:1;
  background:var(--gb-navy-light);color:var(--gb-gold-light);box-shadow:var(--bevel-navy);
  font-size:11px;font-weight:700}
#hud .hudHead{margin:0 4px;background:var(--gb-bg);border-bottom:2px solid var(--gb-ink)}
#hud h1{font-size:14px;font-weight:700;color:var(--gb-ink);margin:0;padding:9px 12px;
  line-height:1.4;letter-spacing:-.02em}
#hudBody{display:block}
#hud.collapsed{width:auto;min-width:min(220px,calc(100vw - 28px))}
#hud.collapsed #hudBody{display:none}
#hud.collapsed h1{padding:8px 12px;font-size:13px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud ol{list-style:none;display:flex;flex-direction:column;gap:4px;padding:8px 8px 4px;
  max-height:46vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--gb-ink) var(--gb-bg)}
/* 소지 창(Party) 슬롯: 왼쪽 도트 아이콘 · 오른쪽 이름 + 한 줄 평 */
#hud li{
  position:relative;display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:center;
  padding:5px 8px 5px 18px;cursor:pointer;color:var(--gb-ink);
  background:var(--gb-bg);border:2px solid var(--gb-ink);box-shadow:inset -2px -2px 0 var(--gb-shade);
}
#hud li::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);
  width:0;height:0;border:5px solid transparent;border-left:7px solid var(--gb-ink);opacity:0}
#hud li:hover{background:var(--gb-white)}
#hud li.cur{background:var(--gb-gold-light);box-shadow:inset -2px -2px 0 var(--gb-gold)}
#hud li.cur::before,#hud li:hover::before{opacity:1}
#hud li.done{color:var(--gb-ink-soft)}
#hud li.done .nm::after{content:' ✓'}
#hud li .ic{grid-row:1/3;width:26px;height:26px;background-color:var(--gb-navy);
  border:2px solid var(--gb-ink);box-shadow:inset 1px 1px 0 var(--gb-navy-light);
  background-size:16px 16px;background-position:center;background-repeat:no-repeat;image-rendering:pixelated}
#hud li .hd{grid-column:2;display:flex;gap:6px;align-items:baseline;min-width:0}
#hud li .tm{font-size:11px;font-weight:700;color:var(--gb-navy);letter-spacing:.02em;flex:none;font-variant-numeric:tabular-nums}
#hud li .nm{font-size:13px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud li .sub{grid-column:2;font-size:11px;font-weight:500;color:var(--gb-ink-soft);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 도트 미니 아이콘 (8×8 SVG, crispEdges) */
.ic.sight{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='2' y='1' width='1' height='6' fill='%23F8F8F8'/><rect x='3' y='1' width='4' height='3' fill='%23D4A373'/><rect x='1' y='7' width='3' height='1' fill='%23F8F8F8'/></svg>")}
.ic.eat{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='1' y='4' width='6' height='2' fill='%23F8F8F8'/><rect x='2' y='6' width='4' height='1' fill='%23F8F8F8'/><rect x='2' y='3' width='4' height='1' fill='%23D4A373'/><rect x='2' y='0' width='1' height='3' fill='%23F8F8F8'/><rect x='5' y='0' width='1' height='3' fill='%23F8F8F8'/></svg>")}
.ic.stay{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='3' y='1' width='2' height='1' fill='%23D4A373'/><rect x='2' y='2' width='4' height='1' fill='%23D4A373'/><rect x='1' y='3' width='6' height='1' fill='%23D4A373'/><rect x='2' y='4' width='4' height='3' fill='%23F8F8F8'/><rect x='3' y='5' width='2' height='2' fill='%23283860'/></svg>")}
.ic.park{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='3' y='0' width='2' height='1' fill='%23F8F8F8'/><rect x='2' y='1' width='4' height='2' fill='%23F8F8F8'/><rect x='1' y='3' width='6' height='2' fill='%23F8F8F8'/><rect x='3' y='5' width='2' height='2' fill='%23D4A373'/></svg>")}
.ic.shop{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='3' y='0' width='2' height='1' fill='%23F8F8F8'/><rect x='2' y='1' width='1' height='2' fill='%23F8F8F8'/><rect x='5' y='1' width='1' height='2' fill='%23F8F8F8'/><rect x='1' y='3' width='6' height='4' fill='%23D4A373'/><rect x='2' y='4' width='4' height='1' fill='%23F8F8F8'/></svg>")}
/* 일차 탭: 포켓기어 하단 아이콘 줄 */
#days{display:flex;gap:4px;padding:6px 8px 8px;margin:0;flex-wrap:wrap;
  background:var(--gb-bg);border-top:2px solid var(--gb-ink)}
#days button{font-size:11px;padding:6px 0;min-width:34px;flex:1 1 34px;text-align:center;font-weight:700}
#days button::before{content:'D';font-size:9px;opacity:.7;margin-right:1px}
#days button.cur{background:var(--gb-navy);color:var(--gb-gold-light);box-shadow:var(--bevel-navy)}
#days button:disabled{opacity:.4;cursor:default}

#topPill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.pill{font-size:11px;padding:7px 12px;letter-spacing:.02em;font-weight:650}
span.pill{background:var(--gb-navy);color:var(--gb-gold-light);box-shadow:var(--bevel-navy)}
a.pill.alt{background:var(--gb-bg);color:var(--gb-ink)}

#autoBtn{position:fixed;right:14px;top:14px;z-index:10;font-size:13px;padding:9px 14px;
  background:var(--gb-gold);color:var(--gb-ink);box-shadow:var(--bevel-gold)}
#autoBtn.on{background:var(--gb-navy);color:var(--gb-gold-light);box-shadow:var(--bevel-navy)}
#bgmBtn{position:fixed;right:14px;top:58px;z-index:10;font-size:12px;padding:7px 12px}
#bgmBtn.off{opacity:.55}
#prog{position:fixed;top:100px;right:14px;z-index:10;font-size:11px;padding:6px 10px;font-weight:650}

/* ── 대화창: 골드 텍스트 박스 (흰 바탕 · 검은 두 줄) ── */
#dlg{left:50%;transform:translateX(-50%);bottom:18px;width:min(660px,92vw);
  padding:14px 18px 16px;z-index:20;display:none;min-height:110px;
  max-height:calc(100dvh - 36px);overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--gb-ink) var(--gb-white)}
#dlg .name{font-size:15px;font-weight:700;color:var(--gb-ink);margin-bottom:8px;padding:0 0 6px;
  border-bottom:2px solid var(--gb-gold);line-height:1.45;overflow-wrap:anywhere;letter-spacing:-.02em}
#dlg .name .tm{color:var(--gb-navy);margin-right:8px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
#dlg .name .eat{font-size:10px;font-weight:700;background:var(--gb-gold)!important;color:var(--gb-ink);border-radius:0;
  padding:2px 6px;margin-left:8px;vertical-align:2px;border:1px solid var(--gb-ink);letter-spacing:.04em}
#dlg .name .eat[style]{background:var(--gb-navy)!important;color:var(--gb-gold-light)}
#dlg .body{font-size:14px;font-weight:500;line-height:1.75;min-height:44px;color:var(--gb-ink);padding:0 2px 4px;overflow-wrap:anywhere}
#dlg .via,#dlg .tip{display:none;margin-top:10px;font-size:12px;font-weight:500;line-height:1.55;padding:8px 10px;
  background:var(--gb-bg);border:2px solid var(--gb-ink);box-shadow:inset -2px -2px 0 var(--gb-shade)}
#dlg .via{color:var(--gb-navy)}
#dlg .tip{color:var(--gb-ink);border-color:var(--gb-gold-deep);box-shadow:inset -2px -2px 0 var(--gb-gold)}
#dlg .via.show,#dlg .tip.show{display:block}
/* 선택 메뉴: ▶ 커서 */
#dlg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:2px solid var(--gb-ink)}
#dlg .acts a,#dlg .acts button{flex:1 1 auto;position:relative;padding:8px 10px 8px 22px;font-size:12px;
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dlg .acts a::before,#dlg .acts button::before{content:'▶';position:absolute;left:8px;top:50%;
  transform:translateY(-50%);font-size:9px;opacity:0}
#dlg .acts a:hover::before,#dlg .acts button:hover::before,
#dlg .acts a:focus-visible::before,#dlg .acts button:focus-visible::before{opacity:1}
#dlg .acts [data-hub-to]{flex-basis:100%}
#dlg .acts a.maps{background:var(--gb-bg)}
#dlg .acts button.ok{background:var(--gb-gold);box-shadow:var(--bevel-gold)}
#dlg .acts[hidden],#dlg .acts [hidden]{display:none!important}
#dlg .next{position:absolute;right:14px;bottom:10px;font-size:12px;color:var(--gb-ink);
  animation:bob .6s steps(2) infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(3px)}}

#sleep{position:fixed;inset:0;z-index:40;background:var(--gb-navy-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .5s steps(4)}
#sleep.show{opacity:1;pointer-events:auto}
#sleep .z{font-size:40px;animation:bob 1s steps(2) infinite}
#sleep .t{color:var(--gb-gold);font-size:22px;font-weight:700;text-align:center;letter-spacing:-.02em}
#sleep .s{color:var(--gb-bg);font-size:13px;font-weight:500;text-align:center;line-height:1.8;padding:10px 16px;
  background:var(--gb-navy);border:2px solid var(--gb-ink);
  box-shadow:inset 0 0 0 2px var(--gb-navy),inset 0 0 0 4px var(--gb-gold-deep)}

/* 지하철/버스/택시 탑승 컷신 */
#ride{position:fixed;inset:0;z-index:35;display:none;pointer-events:auto;
  background:#121820}
#ride.show{display:block}
#ride canvas{width:100%;height:100%;display:block;image-rendering:pixelated}

#hint{position:fixed;left:14px;bottom:14px;z-index:9;font-size:11px;font-weight:500;color:var(--gb-ink);line-height:1.65;
  background:var(--gb-bg);padding:8px 11px;border:2px solid var(--gb-ink);box-shadow:inset -2px -2px 0 var(--gb-shade);
  max-width:min(420px,calc(100vw - 28px))}

#toast{left:50%;transform:translateX(-50%);bottom:64px;z-index:18;padding:12px 18px;
  font-size:13px;font-weight:500;line-height:1.7;color:var(--gb-ink);text-align:center;animation:tpop .3s steps(3)}
#toast b{color:var(--gb-navy);border-bottom:2px solid var(--gb-gold);font-weight:700}
@keyframes tpop{from{opacity:0;transform:translateX(-50%) translateY(8px)}}

/* ── 터치 패드: GB 하드웨어 오마주 (회색 십자키 · 둥근 A) ── */
#pad{position:fixed;left:0;right:0;bottom:0;z-index:16;display:none;pointer-events:none;
  padding:0 14px 14px;align-items:flex-end;justify-content:space-between}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);
  gap:2px;pointer-events:auto}
#dpad button,#abtn{font-family:inherit;font-size:18px;background:#383838;color:var(--gb-bg);
  border:2px solid var(--gb-ink);border-radius:0;touch-action:none;pointer-events:auto;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  box-shadow:inset -3px -3px 0 #202020,inset 3px 3px 0 #585858}
#dpad button:active,#abtn:active{transform:none;box-shadow:inset 3px 3px 0 #202020,inset -3px -3px 0 #484848}
#dpad .u{grid-area:1/2}#dpad .l{grid-area:2/1}#dpad .r{grid-area:2/3}#dpad .d{grid-area:3/2}
#dpad::after{content:'';grid-area:2/2;background:#383838;border:2px solid var(--gb-ink)}
#abtn{width:70px;height:70px;border-radius:50%;background:#8A2A3A;color:var(--gb-white);
  font-size:20px;font-weight:400;margin-bottom:28px;
  box-shadow:inset -3px -3px 0 #5A1A26,inset 3px 3px 0 #B04858}
#abtn:active{box-shadow:inset 3px 3px 0 #5A1A26,inset -3px -3px 0 #8A2A3A}
#abtn small{display:block;font-size:9px;font-weight:400;opacity:.85}

#mStops{display:none;position:fixed;left:10px;right:10px;bottom:196px;z-index:12;
  overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px;padding:2px 0 4px}
#mStops::-webkit-scrollbar{display:none}
#mStops button{flex:none;font-size:10px;padding:7px 10px;white-space:nowrap}
#mStops button.done{background:var(--gb-bg-deep)}
#mStops button.cur{background:var(--gb-navy);color:var(--gb-gold-light);box-shadow:var(--bevel-navy)}

@media (max-width:900px),(pointer:coarse){
  #pad{display:flex}
  #mStops{display:flex}
  #hint{display:none}
  #hud{width:min(260px,70vw);top:52px;left:10px}
  #hud h1{font-size:13px;padding:7px 10px}
  #hud li .nm{font-size:12px}
  #hud li .sub{font-size:10px}
  #autoBtn{top:auto;bottom:248px;right:14px;font-size:12px;padding:9px 12px}
  #bgmBtn{top:auto;bottom:296px;right:14px}
  #prog{top:auto;bottom:338px;right:14px}
  #dlg{bottom:248px;width:min(92vw,520px);padding:12px 14px 12px;max-height:calc(100dvh - 264px)}
  #dlg .name{font-size:14px}
  #dlg .body{font-size:13px}
  #toast{bottom:250px;font-size:12px;max-width:88vw}
  #topPill{top:8px;max-width:96vw;flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  #dlg .next,#sleep .z{animation:none}
  button,a,#prog{transition:none!important}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="topPill">
  <span class="pill">🌾 도쿄 산책 데이</span>
  <a class="pill alt" href="/pokemon.html">픽셀 ↗</a>
  <a class="pill alt" href="/">디오라마 ↗</a>
  <a class="pill alt" href="/map">실제 지도 ↗</a>
</div>

<div id="hud" class="panel">
  <div class="day"><span class="dayLabel" id="hudDay"></span><button type="button" id="hudFold" aria-label="목록 접기" title="목록 접기">▲</button></div>
  <div class="hudHead"><h1 id="hudTitle"></h1></div>
  <div id="hudBody">
    <ol id="stopList"></ol>
    <div id="days"></div>
  </div>
</div>

<button id="autoBtn" class="wood-btn">▶ 자동 여행</button>
<button id="bgmBtn" class="wood-btn" type="button" title="배경음악">♪ BGM</button>
<div id="prog">방문 0/0</div>

<div id="dlg" class="panel">
  <div class="name" id="dlgName"></div>
  <div class="body" id="dlgBody"></div>
  <div class="via" id="dlgVia"></div>
  <div class="tip" id="dlgTip"></div>
  <div class="acts" id="dlgActs" hidden>
    <a class="maps" id="dlgMaps" target="_blank" rel="noopener">길찾기</a>
    <button type="button" class="ok" id="dlgOk">다음 ▼</button>
    <button type="button" id="dlgCancel" hidden>나중에</button>
  </div>
  <div class="next" id="dlgNext" hidden>▼</div>
</div>

<div id="sleep"></div>
<div id="ride"><canvas id="rideCv"></canvas></div>

<div id="hint">방향키/WASD 이동 · 지도 클릭 이동 · 스페이스 = 확인/대화<br>마을 아래 포탈로 들어가면 다음 맵 · 역에서 A → 지하철/버스(선택) · 스팟 A → 일정 · 하루 끝은 숙소</div>

};

/* ═══ 맵 빌더 ═══ */
function grid(w, h) { return Array.from({ length: h }, () => new Array(w).fill(0)); }
function mkRect(gr, x, y, w, h, v) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (gr[j] && gr[j][i] !== undefined) gr[j][i] = v;
}
function borderTrees(gr, w, h, thick = 1) {
  for (let k = 0; k < thick; k++) {
    for (let i = 0; i < w; i++) { gr[k][i] = 4; gr[h - 1 - k][i] = 4; }
    for (let j = 0; j < h; j++) { gr[j][k] = 4; gr[j][w - 1 - k] = 4; }
  }
}
function scatter(gr, w, h, n, seed0) {
  let seed = seed0;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let k = 0; k < n; k++) {
    const x = 1 + (rnd() * (w - 2)) | 0, y = 1 + (rnd() * (h - 2)) | 0;
    if (gr[y][x] === 0) gr[y][x] = rnd() < .38 ? 4 : 5;
  }
}
const isTransit = (via, stop) => {
  if (stop && (stop.mode === 'bus' || stop.mode === 'taxi')) return true;
  return !!via && /선|JR|버스|환승|택시|지하철|전철|유리카모메|케이큐|게이큐|고속버스/.test(via);
};

/** via 문자열에서 실제 역 이름들 추출 (…역) */
function extractStations(via) {
  if (!via) return [];
  const out = [];
  const re = /([가-힣A-Za-z0-9]+)역/g;
  let m;
  while ((m = re.exec(via))) {
    const n = m[1];
    if (n && !out.includes(n)) out.push(n);
  }
  return out;
}
function extractLine(via) {
  if (!via) return '지하철';
  const m = via.match(/(히비야선|긴자선|야마노테|게이힌토호쿠|소부선|마루노우치선|치요다선|미타선|난보쿠선|오에도선|오이도선|유리카모메|케이큐|게이큐|도에이[^→\s]*선|도쿄메트로[^→\s]*선|JR\s*[^→]*|고속버스)/);
  if (!m) return /버스/.test(via) ? '버스' : /택시/.test(via) ? '택시' : '지하철';
  return m[1].replace(/\s*\/.*/, '').trim();
}
function stationLabel(via, fallback) {
  const names = extractStations(via);
  return (names[0] || fallback || '역') + '역';
}

/** 랜드마크별 건물 스타일 — 이름에서 특징 추출 */
function styleFor(name) {
  if (/공항|하네다/.test(name)) return { s: 'airport', w: 7, h: 3 };
  if (/택시/.test(name)) return { s: 'taxi', w: 3, h: 2 };
  if (/센소지|나카미세/.test(name)) return { s: 'temple', w: 6, h: 4 };
  if (/몬자/.test(name)) return { s: 'monja', w: 3, h: 3 };
  if (/스즈키|말차|젤라토/.test(name)) return { s: 'matcha', w: 3, h: 3 };
  if (/아메요코/.test(name)) return { s: 'market', w: 4, h: 2 };
  if (/아키하바라/.test(name)) return { s: 'akihabara', w: 4, h: 5 };
  if (/우에노 공원|공원/.test(name) && !/해변|아쿠아/.test(name)) return { s: 'park', w: 4, h: 3 };
  if (/황거|러닝/.test(name)) return { s: 'palace', w: 5, h: 3 };
  if (/해변|해안/.test(name)) return { s: 'beach', w: 4, h: 2 };
  if (/teamLab|플래닛/.test(name)) return { s: 'teamlab', w: 4, h: 3 };
  if (/조이폴리스/.test(name)) return { s: 'joypolis', w: 4, h: 4 };
  if (/아쿠아시티/.test(name)) return { s: 'mall', w: 4, h: 3 };
  if (/가조엔/.test(name)) return { s: 'gajoen', w: 4, h: 4 };
  if (/모리미술관|시티뷰/.test(name)) return { s: 'tower', w: 3, h: 6 };
  if (/야키니쿠|토도로키|히로키야/.test(name)) return { s: 'yakiniku', w: 3, h: 3 };
  if (/스시/.test(name)) return { s: 'sushi', w: 3, h: 3 };
  if (/AFURI|라멘/.test(name)) return { s: 'ramen', w: 3, h: 3 };
  if (/호토/.test(name)) return { s: 'hotspring', w: 4, h: 3 };
  if (/로손/.test(name)) return { s: 'lawson', w: 3, h: 2 };
  if (/로프웨이/.test(name)) return { s: 'ropeway', w: 3, h: 4 };
  if (/일출/.test(name)) return { s: 'lookout', w: 4, h: 3 };
  if (/후지산/.test(name) && !/로손|로프|편의/.test(name)) return { s: 'fuji', w: 12, h: 7 };
  if (/버스|→/.test(name)) return { s: 'bus', w: 4, h: 2 };
  if (/Section|숙소/.test(name)) return { s: 'hotel', w: 4, h: 4 };
  if (/료칸|온천|가이세키/.test(name)) return { s: 'hotspring', w: 5, h: 3 };
  if (/신주쿠 쇼핑/.test(name)) return { s: 'mall', w: 5, h: 4 };
  if (/신주쿠|카와구치코/.test(name) && !/로손|로프|호토|일출|후지/.test(name)) return { s: 'station', w: 4, h: 2 };
  return { s: 'station', w: 4, h: 2 };
}

function shortStationFallback(name) {
  return (name || '역').replace(/\s*·.*/, '').replace(/^숙소 복귀\s*/, '')
    .replace(/^Section L\s*/, '').replace(/^점심\s*/, '').slice(0, 6) || '역';
}
/** 노선색 — 지도 위 안내선용으로 채도 낮춘 톤 */
function lineColor(line) {

  if (/난보쿠|미타|오에도/.test(line)) return '#4a70a0';
  if (/버스|고속/.test(line)) return '#b86058';

function vehicleKind(line) {
  if (/택시/.test(line || '')) return 'taxi';
  if (/버스|고속/.test(line || '')) return 'bus';
  return 'metro';
}
/** 일정 스팟 자체가 택시 승차 포인트인 경우 (별도 택시 정류장·라벨 중복 방지) */
function isVehicleStop(s) {
  if (!s) return false;
  if (s.mode === 'taxi') return true;
  return /(정액\s*)?택시/.test(s.name || '');
}
/** 정류장 라벨 — '택시 택시' 같은 중복 접미 제거 */
function stationTag(name, vk) {
  const n = (name || '').trim();
  if (vk === 'taxi') return /택시/.test(n) ? n : n + ' 택시';
  if (vk === 'bus') return /버스/.test(n) ? n : n + ' 버스';
  return /역$/.test(n) ? n : n + '역';
}
/* ═══ 에리어(마을) 분할 — 실제 0.9km 안의 스팟은 한 마을, 그 밖은 다른 마을(컷신으로 맵 이동) ═══ */
const AREA_MERGE_KM = 0.9;
function buildAreas(day) {
  const areas = [];
  day.stops.forEach((s, i) => {
    let ai = -1;
    if (s.lat != null) {
      for (let k = 0; k < areas.length; k++) {
        if (areas[k].n && haversineKm(areas[k], s) < AREA_MERGE_KM) { ai = k; break; }
      }
    } else if (areas.length) ai = areas.length - 1;
    if (ai < 0) { areas.push({ stops: [], lat: s.lat ?? 0, lng: s.lng ?? 0, n: 0 }); ai = areas.length - 1; }
    const a = areas[ai];
    a.stops.push(i);
    if (s.lat != null) {
      a.lat = (a.lat * a.n + s.lat) / (a.n + 1);
      a.lng = (a.lng * a.n + s.lng) / (a.n + 1);
      a.n++;
    }
  });
  areas.forEach((a, k) => { a.idx = k; a.name = areaName(day, a); });
  return areas;
}
/** 마을 이름: via의 도착역(승차 스팟이면 출발역) → 지역 힌트 → 스팟 이름 */
function areaName(day, area) {
  for (const i of area.stops) {
    const s = day.stops[i];
    const names = extractStations(s.via);
    if (!names.length) continue;
    const vehicle = s.mode === 'bus' || s.mode === 'taxi';
    return (vehicle ? names[0] : names[names.length - 1]).replace(/공항$/, '');
  }
  const s0 = day.stops[area.stops[0]];
  if (/공항|하네다/.test(s0.name)) return '하네다';
  if (/후지|카와구치코|로손|호토|온천|일출/.test(s0.name)) return '카와구치코';
  return shortStationFallback(s0.name);
}
function areaOf(i) {
  const k = AREAS.findIndex(a => a.stops.includes(i));
  return k < 0 ? 0 : k;
}
/** 목적지로 가는 교통 via (목적지 via가 교통이면 그것, 직전이 승차 스팟이면 그 노선, 아니면 '') */
function hopViaFor(destIdx) {
  const s = DAY.stops[destIdx];
  if (!s) return '';
  if (isTransit(s.via, s) && !isVehicleStop(s) && s.mode !== 'bus' && s.mode !== 'taxi') return s.via;
  const prev = DAY.stops[destIdx - 1];
  if (prev && (prev.mode === 'bus' || prev.mode === 'taxi' || isVehicleStop(prev)) && isTransit(prev.via, prev)) return prev.via;
  return '';
}

/** 마을 맵 — 포켓몬식 소도시: 2겹 나무 울타리 · 아래 마을 입구(광장+역) · 큰길과 가지길 · 집 · 꽃밭 · 풀숲 · 펜스 */
function buildAreaMap(di, ai) {
  const day = DAYS[di], area = AREAS[ai], idxs = area.stops, n = idxs.length;
  const all = day.stops;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ── 스팟 배치: 포켓몬 마을처럼 큰길 하나 + 양옆 레인.
  //    북쪽(실측) 스팟이 큰길 끝(위)에, 나머지는 북→남 순서로 6행 간격, 동/서는 실측 방향 그대로 ──
  const proj = projectDay(day);
  const order = [...idxs.keys()].sort((a, b) => proj.stops[idxs[a]].km.z - proj.stops[idxs[b]].km.z);
  const xs = idxs.map(i => proj.stops[i].km.x);
  const medX = xs.slice().sort((a, b) => a - b)[xs.length >> 1];
  const fujiHere = day.theme === 'fuji' && area.lat < 35.6;
  const w = 34, gx = w >> 1;
  const maxH = Math.max(...idxs.map(i => styleFor(all[i].name).h), fujiHere ? 7 : 0);
  const yTop = Math.max(fujiHere ? 14 : 7, maxH + 3); // 큰 후지산 실루엣 자리
  const rowGap = Math.max(6, maxH + 3);
  const h = yTop + (n - 1) * rowGap + 12; // 마지막 스팟 아래 역·광장·게이트·울타리
  const spots = new Array(n);
  order.forEach((k, r) => {
    let x = gx;
    if (r > 0) {
      let side = xs[k] >= medX ? 1 : -1;
      if (xs[k] === medX && n > 2) side = r % 2 ? 1 : -1;
      x = gx + side * 8;
    }
    spots[k] = { x, y: yTop + r * rowGap };
  });

  const gr = grid(w, h);
  const bld = [], trig = new Array(all.length).fill(null), stns = [], lbl = [], zones = [], rails = [];
  const trigList = () => trig.filter(Boolean);
  const paintedWater = new Map();
  const paintWater = (x0, y0, ww, hh) => {
    for (let j = y0; j < y0 + hh; j++) for (let i = x0; i < x0 + ww; i++) {
      if (!gr[j] || gr[j][i] === undefined) continue;
      if (gr[j][i] === 1 || gr[j][i] === 2) continue;
      if (bld.some(b => covers(b, i, j))) continue;
      gr[j][i] = 3;
      paintedWater.set(j * w + i, { x: i, y: j, w: 1, h: 1 });
    }
  };
  const covers = (b, tx, ty) => tx >= b.x && tx < b.x + b.w && ty >= b.y && ty < b.y + b.h;
  const placeBld = (bx, by, bw, bh, s) => {
    const b = { x: clamp(bx, 2, w - bw - 2), y: clamp(by, 2, h - bh - 2), w: bw, h: bh, s };
    for (let guard = 0; guard < 8; guard++) {
      const hit = trigList().find(([tx, ty]) => covers(b, tx, ty));
      if (!hit) break;
      const [, ty] = hit;
      b.y = ty - bh >= 2 ? ty - bh : clamp(ty + 1, 2, h - bh - 2);
    }
    bld.push(b);
    return b;
  };

  // ── 입구: 아래쪽 중앙 게이트 + 돌 광장 + 스폰 ──
  const plazaY = h - 7;                       // 광장 y 범위 plazaY .. h-3
  mkRect(gr, gx - 6, plazaY, 13, 5, 2);
  const spawn = [gx, h - 4];
  spots.forEach((p, k) => { trig[idxs[k]] = [p.x, p.y]; });

  // ── 길: 광장에서 위로 뻗는 큰길(3칸) + 각 스팟으로 가지길(2칸) + 스팟끼리 순서대로 ──
  const road = (x0, y0, x1, y1) => {
    mkRect(gr, x0, Math.min(y0, y1), 2, Math.abs(y1 - y0) + 1, 1);
    mkRect(gr, Math.min(x0, x1), y1, Math.abs(x1 - x0) + 2, 2, 1);
  };
  const topY = Math.min(...spots.map(p => p.y));
  mkRect(gr, gx - 1, topY, 3, plazaY - topY + 1, 1);
  spots.forEach(p => { if (p.x !== gx) road(gx, p.y, p.x, p.y); });
  spots.forEach(p => mkRect(gr, p.x - 1, p.y - 1, 3, 3, 2));

  // ── 일정 건물: 문이 발판 바로 위 ──
  idxs.forEach((i, k) => {
    const { x, y } = spots[k];
    const st = styleFor(all[i].name);
    placeBld(x - (st.w >> 1), Math.max(2, y - st.h), st.w, st.h, st.s);
  });

  // ── 마을 역(정류장): 광장 왼쪽 위 — 이 마을에서 다른 마을로 가는 모든 일정이 노선 ──
  const kinds = all.filter(s => isTransit(s.via, s)).map(s => vehicleKind(extractLine(s.via)));
  const vk = kinds.length && kinds.every(k => k === 'bus') ? 'bus' : kinds.length && kinds.every(k => k === 'taxi') ? 'taxi' : 'metro';
  const sw = vk === 'metro' ? 4 : 3, sh = vk === 'metro' ? 3 : 2;
  const hall = placeBld(gx - 6, plazaY - sh, sw, sh, vk === 'bus' ? 'busStop' : vk === 'taxi' ? 'taxiStand' : 'station');
  hall.name = area.name; hall.vKind = vk; hall.lines = [];
  hall.routes = [];
  all.forEach((s, j) => {
    if (idxs.includes(j)) return;
    const via = hopViaFor(j);
    const line = via ? extractLine(via) : '도보';
    hall.routes.push({ toStop: j, toName: shortStationFallback(s.name), line, fromStop: idxs[0], kind: via ? vehicleKind(line) : 'walk' });
  });
  stns.push(hall);
  lbl.push([hall.x + hall.w / 2, hall.y - 0.45, area.name + (vk === 'metro' ? '역' : vk === 'bus' ? ' 버스' : ' 택시')]);
  // 역 앞 짧은 안내선(장식 차량)
  const rx = hall.x + (hall.w >> 1);
  rails.push({ cells: [[rx, plazaY], [rx, plazaY + 1], [rx, plazaY + 2], [rx, plazaY + 3]], line: vk, color: lineColor(vk === 'bus' ? '버스' : vk === 'taxi' ? '택시' : ''), kind: vk, from: area.name, to: '' });

  // ── 광장 오른쪽: 꽃밭 + 펜스 (마을 표지판 자리) ──
  mkRect(gr, gx + 3, plazaY, 4, 2, 5);
  mkRect(gr, gx + 2, plazaY - 1, 6, 1, 9);
  mkRect(gr, gx + 7, plazaY, 1, 2, 9);

  // 건물 후보 자리가 비어 있는지(잔디만, 길·발판·다른 건물 없음)
  const blockedAt = (bx, by, bw, bh) => {
    for (const b of bld) if (bx < b.x + b.w + 1 && bx + bw + 1 > b.x && by < b.y + b.h + 1 && by + bh + 1 > b.y) return true;
    for (const [tx, ty] of trigList()) if (tx >= bx - 1 && tx < bx + bw + 1 && ty >= by - 1 && ty < by + bh + 2) return true;
    for (let j = by; j < by + bh; j++) for (let i = bx; i < bx + bw; i++) if (!gr[j] || gr[j][i] === undefined || gr[j][i] !== 0) return true;
    return false;
  };
  const stopNames = idxs.map(i => all[i].name).join(' ');

  // ── 랜드마크 (자리가 비어 있을 때만) ──
  if (fujiHere && !bld.some(b => b.s === 'fuji')) {
    placeBld(gx - 6, 1, 12, 7, 'fuji');
    // 산기슭 숲 느낌 (작은 나무 타일)
    for (let i = gx - 5; i <= gx + 5; i++) {
      if (gr[8] && gr[8][i] === 0) gr[8][i] = 4;
      if (i % 2 === 0 && gr[9] && gr[9][i] === 0) gr[9][i] = 4;
    }
  }
  if (day.theme === 'odaiba' && /오다이바|조이폴리스|아쿠아시티/.test(stopNames)) {
    for (const [wx, wy] of [[w - 11, 3], [w - 8, plazaY - 8], [3, plazaY - 8], [3, 3]]) {
      if (blockedAt(wx, wy, 5, 6)) continue;
      placeBld(wx, wy, 5, 6, 'wheel'); break;
    }
  }
  if (day.theme === 'asakusa' && /센소지|몬자|스즈키/.test(stopNames)) {
    const t = bld.find(b => b.s === 'temple');
    if (t && !blockedAt(t.x - 3, t.y, 3, 4)) placeBld(t.x - 3, t.y, 3, 4, 'pagoda');
  }
  if (day.landmark === 'tower' && /모리|시티뷰|히로키야/.test(stopNames) && !bld.some(b => b.s === 'tower') && !blockedAt(3, 2, 3, 6)) placeBld(3, 2, 3, 6, 'tower');
  // 물: 카와구치코(오른쪽 넓은 호수) · 오다이바 바다 / 아사쿠사 스미다강
  if (fujiHere) {
    paintWater(w - 9, 4, 7, plazaY - 8);
    // 호숫가 산책로 + 꽃
    mkRect(gr, w - 10, 5, 1, plazaY - 10, 1);
    for (let j = 6; j < plazaY - 6; j += 2) {
      if (gr[j] && gr[j][w - 11] === 0) gr[j][w - 11] = 5;
      if (gr[j + 1] && gr[j + 1][w - 10] === 0) gr[j + 1][w - 10] = 5;
    }
    zones.push(['카와구치코', w - 5, plazaY - 10]);
  }
  if (day.theme === 'odaiba' && /오다이바|조이폴리스|아쿠아시티/.test(stopNames)) paintWater(w - 5, 3, 3, plazaY - 8);
  if (day.theme === 'asakusa' && /센소지|몬자|스즈키/.test(stopNames)) paintWater(w - 5, 3, 3, plazaY - 8);

  // ── 장식 집: 큰길 양옆 + 빈 잔디 ──
  {
    let seed = 91 + di * 17 + ai * 5;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const styles = ['house', 'houseB', 'shopR', 'house', 'shopG', 'houseB'];
    let si = 0;
    const tryHouse = (bx, by) => {
      bx |= 0; by |= 0;
      if (bx < 2 || by < 2 || bx + 3 > w - 2 || by + 3 > plazaY - 1) return false;
      if (blockedAt(bx, by, 3, 3)) return false;
      const b = placeBld(bx, by, 3, 3, styles[si++ % styles.length]);
      // 집 앞 작은 꽃밭 or 문 앞 길
      const fy = b.y + b.h;
      if (gr[fy] && gr[fy][b.x + 1] === 0) { gr[fy][b.x + 1] = 1; }
      if (rnd() < 0.6 && gr[fy] && gr[fy][b.x] === 0) gr[fy][b.x] = 5;
      if (rnd() < 0.6 && gr[fy] && gr[fy][b.x + 2] === 0) gr[fy][b.x + 2] = 5;
      return true;
    };
    for (let y = topY; y < plazaY - 4; y += 5) {
      tryHouse(gx - 6, y); tryHouse(gx + 4, y);
    }
    for (let t = 0; t < 14; t++) tryHouse(3 + rnd() * (w - 9), 3 + rnd() * (plazaY - 9));
  }

  // ── 풀숲(위 모서리) · 물 · 랜드마크 ──
  const grassPatch = (x0, y0, ww, hh) => {
    for (let j = y0; j < y0 + hh; j++) for (let i = x0; i < x0 + ww; i++) if (gr[j] && gr[j][i] === 0) gr[j][i] = 8;
  };
  grassPatch(2, 2, 5, 4); grassPatch(w - 7, 2, 5, 4);

  // ── 울타리 나무 2겹 + 아래 게이트 + 흩뿌린 나무/꽃 ──
  borderTrees(gr, w, h, 2);
  scatter(gr, w, h, 12, 13 + di * 3 + ai);
  mkRect(gr, gx - 1, h - 3, 3, 3, 1); // 게이트 통로
  // 발판·길은 나무에 덮이지 않게
  spots.forEach(p => mkRect(gr, p.x - 1, p.y - 1, 3, 3, 2));
  mkRect(gr, gx - 1, topY, 3, plazaY - topY + 1, 1);
  spots.forEach(p => { if (p.x !== gx) road(gx, p.y, p.x, p.y); });
  // Preserve each landmark doorstep and the return-spawn tile after decoration/water.
  spots.forEach(p => mkRect(gr, p.x - 1, p.y, 3, 2, 1));
  mkRect(gr, gx - 6, plazaY, 13, 5, 2);
  mkRect(gr, gx + 3, plazaY, 4, 2, 5);

  zones.push([area.name, gx, Math.max(2.6, topY - maxH - 1.3)]); // 큰길 끝 건물 위 마을 이름

  return {
    W: w, H: h, g: gr, BLD: bld, TRIG: trig, ZONES: zones,
    STN_LABELS: lbl, STATIONS: stns, RAILS: rails,
    waterTiles: [...paintedWater.values()].filter(t => gr[t.y][t.x] === 3),
    spawn, gate: [gx, h - 2], area: ai
  };
}

/** 건물 내부 입장 가능 여부 — 공원·해변·택시 등은 제외 */
function interiorKind(name) {
  const theme = interiorTheme(name);
  if (!theme) return null;
  if (theme === 'haneda') return 'airport';
  if (['sectionL', 'ryokan'].includes(theme)) return 'hotel';
  if (['planets', 'mori'].includes(theme)) return 'museum';
  if (['sensoji', 'gajoen'].includes(theme)) return 'temple';
  if (['monja', 'matcha', 'yakiniku', 'sushi', 'afuri'].includes(theme)) return 'restaurant';
  if (['cityview', 'ropeway'].includes(theme)) return 'tower';
  if (theme === 'joypolis') return 'arcade';
  return 'shop';
}

/** 일정 명칭만 분류한다. 교통/공원은 실내를 만들지 않는다. */
function interiorTheme(name = '') {
  if (/택시|버스|→|↔|공원|해변|해안|황거|러닝|일출/.test(name)) return null;
  if (/로손/.test(name)) return 'lawson';
  if (/로프웨이/.test(name)) return 'ropeway';
  if (/후지산/.test(name)) return null;
  if (/하네다|공항/.test(name)) return 'haneda';
  if (/료칸|온천|가이세키|호토/.test(name)) return 'ryokan';
  if (/Section|숙소/i.test(name)) return 'sectionL';
  if (/센소지|나카미세/.test(name)) return 'sensoji';
  if (/몬자/.test(name)) return 'monja';
  if (/스즈키|말차|젤라토/.test(name)) return 'matcha';
  if (/아메요코/.test(name)) return 'ameyoko';
  if (/아키하바라/.test(name)) return 'akihabara';
  if (/야키니쿠|토도로키|히로키야/.test(name)) return 'yakiniku';
  if (/teamLab|플래닛/i.test(name)) return 'planets';
  if (/아쿠아시티/.test(name)) return 'aquacity';
  if (/조이폴리스/.test(name)) return 'joypolis';
  if (/스시/.test(name)) return 'sushi';
  if (/가조엔/.test(name)) return 'gajoen';
  if (/AFURI|라멘/i.test(name)) return 'afuri';
  if (/모리미술관/.test(name)) return 'mori';
  if (/시티뷰/.test(name)) return 'cityview';
  if (/신주쿠.*쇼핑/.test(name)) return 'shinjuku';
  return null;
}

/** 단층 26×18 오마주 룸. 실제 평면/사진/공식 게임 자산을 복제하지 않는다. */
function buildInteriorMap(kind, stop) {
  const theme = interiorTheme(stop.name);
  // 실내용 도트 바닥. atlas의 야외 0..9는 그대로 보존한다.
  // 10 목재 / 11 크림 러그 / 12 홍색 러그 / 13 어두운 홀 / 14 다다미 / 15 청색 러그.
  if (atlas.width < 16 * 16) {
    const old = document.createElement('canvas'); old.width = atlas.width; old.height = atlas.height;
    old.getContext('2d').drawImage(atlas, 0, 0);
    atlas.width = 16 * 16;
    const a = atlas.getContext('2d'); a.drawImage(old, 0, 0);
    const colors = [['#a67850','#765439','#c89868'],['#dfccb0','#b29a7c','#f5e8ce'],['#a84d50','#70343c','#d38b73'],['#292e47','#1c2037','#424966'],['#b8b783','#818962','#d8cda0'],['#628ba4','#3d617f','#9ac2cf']];
    colors.forEach(([base, edge, light], i) => {
      for (let frame = 0; frame < 2; frame++) {
        const x = (10+i)*16, y=frame*16;
        a.fillStyle=base; a.fillRect(x,y,16,16);
        a.fillStyle=edge;
        if(i===0){a.fillRect(x,y+7,16,1);a.fillRect(x,y+15,16,1);a.fillRect(x+5,y,1,7);a.fillRect(x+11,y+8,1,7);}
        else if(i===4){a.fillRect(x,y,1,16);a.fillRect(x+15,y,1,16);for(let j=2;j<16;j+=3)a.fillRect(x+2,y+j,12,1);}
        else {a.fillRect(x,y+15,16,1);a.fillRect(x+15,y,1,16);}
        a.fillStyle=light; a.fillRect(x+2,y+2,1,1);a.fillRect(x+10,y+10,1,1);
      }
    });
  }
  const w = 26, h = 18, gx = 12;
  const gr = grid(w,h), bld = [], zones = [], lbl = [], paintedWater = [];
  borderTrees(gr,w,h,2);
  const dark = ['planets','joypolis','yakiniku'].includes(theme);
  const wood = ['sectionL','monja','matcha','sushi','afuri','ryokan','gajoen','sensoji'].includes(theme);
  const base = dark ? 13 : wood ? 10 : 2;
  const rug = ['sensoji','gajoen','yakiniku','haneda'].includes(theme) ? 12 : ['ryokan','matcha'].includes(theme) ? 14 : ['planets','joypolis','lawson','aquacity','cityview','ropeway'].includes(theme) ? 15 : 11;
  mkRect(gr,2,2,22,14,base);
  const floor = (x,y,ww,hh,t=rug) => mkRect(gr,x,y,ww,hh,t);
  const p = (x,y,ww,hh,s) => { bld.push({x,y,w:ww,h:hh,s,theme}); };
  const one = (x,y,s) => p(x,y,1,1,s);
  const row = (xs,y,s,ww=2,hh=2) => xs.forEach(x=>p(x,y,ww,hh,s));
  const zone = (text,x,y) => lbl.push([x,y,text]);
  const pool = (x,y,ww,hh) => { floor(x,y,ww,hh,3); for(let j=y;j<y+hh;j++)for(let i=x;i<x+ww;i++)paintedWater.push({x:i,y:j,w:1,h:1}); };
  // 3칸 입구 + 십자/고리 통로. 시그니처 존의 바닥이 회색 공백으로 남지 않는다.
  floor(3,3,8,10); floor(15,3,8,10); floor(11,2,3,14); floor(2,5,22,2);floor(2,9,22,2);floor(2,13,22,2);
  const title = (stop.name||'').replace(/\s*·.*/, '').slice(0,12);
  zones.push([title,gx,1.3]);
  // 공개 페이지의 시그니처를 소품/색/존으로 번역. 아래 배치는 창작이며 영업 정보가 아니다.
  if (theme === 'haneda') {
    // https://tokyo-haneda.com/en/faq/facilities.html : 터미널 서비스/카운터/수하물. 유리+빨간 대기는 무드 연출.
    row([3,7,15,19],2,'window',3,1); row([3,7,15,19],3,'counter',3,2);
    row([3,6,9],7,'locker',2,2); row([16,20],7,'bench',3,1);
    row([3,7,16,20],11,'bench',3,1); one(22,8,'vending');one(14,7,'exhibit');
    zone('체크인',6,2.7);zone('로커',6,6.6);zone('게이트',19,6.6);
  } else if(theme === 'sectionL') {
    // https://section-l.co/hatchobori : 구비 주방/세탁/소파베드/상주 스태프 → 프런트·주방·객실.
    p(3,3,5,2,'reception');p(9,3,2,2,'shelf');p(15,3,3,2,'sink');p(20,3,2,2,'fridge');
    row([3,7],7,'sofa',3,1);p(4,11,2,2,'table');one(3,11,'chair');one(7,11,'chair');
    row([15,19],7,'bed',3,2);row([15,19],11,'bed',3,2);one(10,11,'vending');one(22,3,'machine');
    zone('프런트',6,2.6);zone('라운지',6,6.6);zone('객실·주방',19,2.6);
  } else if(theme === 'sensoji') {
    // https://www.japan.travel/en/spot/1691 : 본당/큰 붉은 초롱/나카미세 상점/오미쿠지.
    p(9,2,8,3,'altar');row([3,21],3,'pillar',2,2);row([3,8,16,21],7,'stall',2,2);
    row([3,8,16,21],11,'stall',2,2);row([5,19],3,'lantern',1,2);
    one(6,8,'lantern');one(19,8,'lantern');one(6,12,'flower');one(19,12,'flower');
    zone('본당',13,2);zone('나카미세',6,6.6);zone('오미쿠지',19,10.6);
  } else if(theme === 'planets') {
    // https://www.teamlab.art/e/planets : 물·잉어/무한 크리스탈/플라워/맨발 입장 → 신발 로커.
    floor(3,3,8,10,13);floor(15,3,8,10,13);pool(3,3,7,2);pool(3,7,3,2);
    row([15,18,21],3,'crystal',2,2);row([15,18,21],7,'crystal',2,2);
    row([3,6,9],11,'flower',2,2);row([15,18,21],11,'flower',2,2);
    p(8,7,2,2,'exhibit');row([3,6,19,22],14,'locker',1,1);one(10,3,'neon');one(14,3,'neon');
    zone('워터',6,2.6);zone('크리스탈',19,2.6);zone('플라워',6,10.6);zone('신발',20,13.6);
  } else if(theme === 'gajoen') {
    // https://www.daisuki-nippon.net (Hotel Gajoen Tokyo) : 정원·폭포·잉어 + 장식 천장/계단 인상을 전시·꽃으로 번역.
    p(8,2,10,3,'altar');row([3,21],3,'pillar',2,2);pool(4,7,4,2);
    row([8,16,20],7,'flower',2,2);row([3,7,16,20],11,'flower',2,2);
    row([9,18],11,'lamp',1,2);row([3,21],9,'lantern',1,1);p(16,14,5,1,'bench');
    zone('본관',13,2);zone('수정원',5,6.6);zone('화원',19,10.6);
  } else if(theme === 'mori') {
    // https://www.mori.art.museum/en/ : 현대미술 전시/타워 상층/컬렉션 → 흰 전시섬+엘리베이터 홀.
    row([3,8,15,20],3,'exhibit',3,2);row([3,8,15,20],7,'exhibit',3,2);
    p(3,11,4,2,'counter');row([16,20],11,'window',2,2);p(8,11,3,1,'bench');
    row([3,8,16,21],2,'window',2,1);one(22,14,'exhibit');
    zone('상설 전시',6,2.6);zone('기획 전시',18,6.6);zone('승강기 홀',19,10.6);
  } else if(theme === 'cityview') {
    // https://art-view.roppongihills.com/en/info : 전망 덱/52층/전시 → 유리 벨트·전망석·안내 전시.

/* ═══ 픽셀 아틀라스 ═══ */
const atlas = document.createElement('canvas');
atlas.width = 16 * 10; atlas.height = 32; // 0 잔디 1 길 2 돌 3 물 4(나무 충돌) 5 꽃 6 다리 7 철로 8 풀숲 9 펜스
{
  const a = atlas.getContext('2d');
  const px = (f, c, x, y, w, h, col) => { a.fillStyle = col; a.fillRect(c * 16 + x, f * 16 + y, w, h); };
  for (let f = 0; f < 2; f++) {
    // 0 잔디 — GBA(R/S)식: 납작한 바탕 + 짧은 풀 대시 (프레임마다 1px 지터)
    px(f, 0, 0, 0, 16, 16, PAL.grassLight);
    const j = f ? 1 : 0;
    [[2,4],[9,3],[5,10],[12,11]].forEach(([x,y]) => {
      px(f, 0, x, y + j, 3, 1, PAL.grassDark);
      px(f, 0, x + 1, y + j - 1, 1, 1, PAL.grassDark);
    });
    [[7,7],[13,6],[1,13]].forEach(([x,y]) => px(f, 0, x, y, 2, 1, PAL.grassDeep));
    px(f, 0, 3, 13, 1, 1, PAL.grassHilite); px(f, 0, 11, 1, 1, 1, PAL.grassHilite);

    // 1 포장길 — GBA식 밝은 바닥 + 2단 가장자리(중간/어두움) + 줄눈
    px(f, 1, 0, 0, 16, 16, PAL.pathLight);
    px(f, 1, 0, 0, 16, 1, '#f4ecd4'); px(f, 1, 0, 0, 1, 16, '#f4ecd4');   // 좌상 하이라이트
    px(f, 1, 0, 14, 16, 1, PAL.pathDark); px(f, 1, 14, 0, 1, 16, PAL.pathDark); // 1단
    px(f, 1, 0, 15, 16, 1, PAL.pathEdge); px(f, 1, 15, 0, 1, 16, PAL.pathEdge); // 2단
    px(f, 1, 0, 7, 14, 1, PAL.pathDark);                                    // 줄눈
    [[3,3],[10,10]].forEach(([x,y]) => px(f, 1, x, y, 2, 1, PAL.pathDark));

    // 2 포장 — 석재 블록 (2×2 줄눈, 좌상 하이라이트)
    px(f, 2, 0, 0, 16, 16, PAL.stoneLight);
    px(f, 2, 0, 0, 16, 1, '#e8e8e0'); px(f, 2, 0, 0, 1, 16, '#e8e8e0');
    px(f, 2, 0, 15, 16, 1, PAL.stoneDark); px(f, 2, 15, 0, 1, 16, PAL.stoneDark);
    px(f, 2, 0, 7, 16, 1, PAL.stoneMid);
    px(f, 2, 7, 0, 1, 8, PAL.stoneMid);
    px(f, 2, 3, 8, 1, 8, PAL.stoneMid); px(f, 2, 11, 8, 1, 8, PAL.stoneMid);

    // 3 물 — 사선 줄무늬가 대각선으로 흐름 (f=0/1)
    px(f, 3, 0, 0, 16, 16, PAL.waterDark);
    px(f, 3, 0, 0, 16, 1, PAL.waterLight); px(f, 3, 0, 0, 1, 16, PAL.waterLight);
    px(f, 3, 1, 1, 14, 14, PAL.waterLight);
    const wOff = f ? 3 : 0;
    for (let i = -4; i < 20; i += 4) {
      const x0 = ((i + wOff) % 16 + 16) % 16;
      for (let k = 0; k < 4; k++) {
        const xx = (x0 + k) % 16, yy = (k * 2 + (f ? 2 : 0)) % 16;
        px(f, 3, xx, yy, 2, 1, PAL.waterHilite);
        px(f, 3, (xx + 8) % 16, (yy + 5) % 16, 2, 1, PAL.waterDark);
      }
    }

    // 4는 충돌용 나무 칸. 실제 나무는 독립 오브젝트로 그린다.

    // 5 꽃
    px(f, 5, 0, 0, 16, 16, PAL.grassLight);
    px(f, 5, 0, 0, 16, 1, PAL.grassHilite); px(f, 5, 0, 15, 16, 1, PAL.grassDark);
    px(f, 5, 3, 4, 3, 3, PAL.accentRed); px(f, 5, 4, 5, 1, 1, '#fff8e8');
    px(f, 5, 10, 9, 3, 3, PAL.gold); px(f, 5, 11, 10, 1, 1, '#fff8e8');

    // 6 다리 — 나무 판자 (납작)
    px(f, 6, 0, 0, 16, 16, PAL.grassLight);
    px(f, 6, 4, 0, 8, 16, PAL.wood);
    px(f, 6, 4, 0, 1, 16, PAL.woodDark); px(f, 6, 11, 0, 1, 16, PAL.woodDark);
    px(f, 6, 4, 5, 8, 1, PAL.woodDark); px(f, 6, 4, 10, 8, 1, PAL.woodDark);

    // 7 철로
    px(f, 7, 0, 0, 16, 16, PAL.grassLight);
    px(f, 7, 0, 2, 16, 12, PAL.stoneMid);
    px(f, 7, 0, 2, 16, 1, PAL.stoneLight);
    px(f, 7, 0, 13, 16, 1, PAL.stoneDark);
    for (let x = 0; x < 16; x += 4) px(f, 7, x + 1, 3, 2, 10, PAL.trunk);
    px(f, 7, 0, 4, 16, 2, '#5a5e66'); px(f, 7, 0, 4, 16, 1, '#8a8e96');
    px(f, 7, 0, 10, 16, 2, '#5a5e66'); px(f, 7, 0, 10, 16, 1, '#8a8e96');

    // 8 풀숲 — R/S 야생 풀: 잔디 위에 큼직한 V자 풀 다발 3개 (프레임마다 살짝 흔들림)
    px(f, 8, 0, 0, 16, 16, PAL.grassLight);
    const sway = f ? 1 : 0;
    [[1, 2], [8, 1], [4, 9], [11, 8]].forEach(([x, y]) => {
      px(f, 8, x, y + 3, 5, 3, PAL.grassDark);          // 몸통
      px(f, 8, x, y + 1 + sway, 1, 3, PAL.grassDark);   // 왼 잎
      px(f, 8, x + 4, y + 1 - sway, 1, 3, PAL.grassDark);
      px(f, 8, x + 2, y, 1, 4, PAL.grassDeep);          // 가운데 잎
      px(f, 8, x + 1, y + 5, 3, 1, PAL.grassDeep);
      px(f, 8, x + 1, y + 3, 1, 1, PAL.grassHilite);
    });

    // 9 펜스 — 흰 울타리(기둥 2 + 가로대 2), 잔디 바탕
    px(f, 9, 0, 0, 16, 16, PAL.grassLight);
    px(f, 9, 0, 6, 16, 2, '#f4f0e0'); px(f, 9, 0, 8, 16, 1, '#b8b0a0');
    px(f, 9, 0, 11, 16, 2, '#f4f0e0'); px(f, 9, 0, 13, 16, 1, '#b8b0a0');
    [2, 11].forEach(x => {
      px(f, 9, x, 3, 3, 12, '#f4f0e0');
      px(f, 9, x + 2, 3, 1, 12, '#b8b0a0');
      px(f, 9, x + 1, 2, 1, 1, '#f4f0e0');
      px(f, 9, x, 15, 3, 1, '#6a6050');
    });
  }
}

/* ═══ 나무 — 16px 안에 들어가는 계단식 잎 덩어리 ═══ */
function renderTree(q, x, y, variant = 0) {
  const r = (dx, dy, w, h, col) => {
    q.fillStyle = col;
    q.fillRect((x + dx) | 0, (y + dy) | 0, w, h);
  };
  const autumn = variant < 3; // 10종 중 3종만 단풍 — 포켓몬식 초록 울타리 나무가 기본
  const dark = autumn ? PAL.autumnDeep : PAL.treeDark;
  const mid = autumn ? PAL.autumnMid : PAL.treeMid;
  const light = autumn ? PAL.autumnLight : PAL.treeHilite;
  // 정수 좌표의 가로줄로 원을 채워 안티앨리어싱을 피한다.
  const blob = (cx, cy, radius, col) => {
    for (let dy = -radius; dy <= radius; dy++) {
      const half = Math.floor(Math.sqrt(radius * radius - dy * dy));
      r(cx - half, cy + dy, half * 2 + 1, 1, col);
    }
  };
  // R/S식 둥근 나무: 어두운 외곽 덩어리 → 중간색 몸통(좌상 치우침) → 좌상 하이라이트 → 우하 그림자
  r(6, 11, 3, 5, PAL.trunk);
  r(6, 11, 1, 5, PAL.trunkDark);
  r(4, 15, 8, 1, PAL.trunkDark); // 밑그림자
  const lift = variant % 2;
  blob(7, 8, 6, dark);
  blob(4, 9 - lift, 3, dark);
  blob(11, 9, 3, dark);
  blob(6 + lift, 6, 4, mid);
  blob(10, 8, 2, mid);
  blob(5 + lift, 4, 2, light);
  r(3, 6 - lift, 1, 1, light);
  // 우하단 어두운 그림자 라인
  r(9, 12, 3, 1, dark); r(11, 11, 2, 1, dark);
}

// 작은 투명 스프라이트를 재사용해 매 프레임 나무를 다시 만들지 않는다.
const treeSprites = Array.from({ length: 10 }, (_, variant) => {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  renderTree(c.getContext('2d'), 0, 0, variant);
  return c;
});

/* ═══ 건물 렌더 ═══ */
function renderBld(b) {
  const c = document.createElement('canvas');
  c.width = b.w * 16; c.height = b.h * 16;
  const q = c.getContext('2d');
  const r = (x, y, w, h, col) => { q.fillStyle = col; q.fillRect(x | 0, y | 0, w | 0, h | 0); };
  const WPX = c.width, HPX = c.height;
  // ── GBA(루비/사파이어)식 2.5D 파츠 ──
  // 지붕 비중 35~50% · 윗면(밝)/경사(본색)/처마(어두움) 3단 · 벽 정면+오른쪽 옆면 · 지붕 오버행.
  // DS급 텍스처/그라데이션은 넣지 않는다.
  const darken = (hex, k) => {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v * k)));
    return `#${((f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).padStart(6, '0')}`;
  };
  /** 지붕(평/완경사): 윗면(밝) → 경사(본색) → 처마(어두움) + 두꺼운 오른쪽 옆면 */
  const roofBand = (x, y, w, h, mid, top, bot) => {
    const edge = bot || darken(mid, .48);
    const hilite = top || darken(mid, 1.35);
    r(x, y, w, h, mid);
    const topH = Math.max(3, Math.round(h * 0.42));
    r(x, y, w, topH, hilite);
    r(x, y, w, 1, darken(hilite, 1.1));
    if (h >= 8) r(x + 1, y + topH + ((h - topH) >> 1), Math.max(1, w - 2), 1, darken(mid, .82));
    // 오른쪽 두께 — 화면에서 바로 보이도록 4~7px
    if (w > 6 && h > 3) {
      const side = Math.min(7, Math.max(4, (w / 6) | 0));
      r(x + w - side, y + 1, side, h - 1, edge);
      r(x + w - side, y + 1, 1, h - 1, darken(edge, .75));
    }
    if (h >= 4) {
      r(x, y + h - 3, w, 3, edge);
      for (let col = 1; col < w - 3; col += 4) r(x + col, y + h - 3, 2, 1, mid);
    }
  };
  /** 박공 지붕: 좌 밝은 면 / 우 본색 + 용마루 + 두꺼운 오른쪽 옆면 + 처마 */
  const gableRoof = (x, y, w, h, mid, top, bot) => {
    const edge = bot || darken(mid, .48);
    const hilite = top || darken(mid, 1.35);
    for (let i = 0; i < h; i++) {
      const inset = Math.round((h - 1 - i) * (w / 2) / h);
      const rw = w - inset * 2;
      if (rw <= 0) continue;
      const half = (rw / 2) | 0;
      r(x + inset, y + i, half, 1, hilite);
      r(x + inset + half, y + i, rw - half, 1, mid);
      if (i === 0) r(x + inset + half - 1, y, 2, 1, darken(hilite, 1.1));
      // 오른쪽 옆면 두께 3px
      if (i >= 1 && i < h - 1) r(x + w - inset - 3, y + i, 3, 1, edge);
    }
    r(x, y + h - 3, w, 3, edge);
    for (let col = 1; col < w - 3; col += 4) r(x + col, y + h - 3, 2, 1, mid);
  };
  /** 벽: 처마 그림자 + 정면 + 두꺼운 오른쪽 옆면 + 왼쪽 하이라이트 + 바닥 그림자 */
  const wallFace = (x, y, w, h, base, shade) => {
    const sh = shade || darken(base, .78);
    const deep = darken(sh, .8);
    r(x, y, w, h, base);
    // 옆면 4~7px — 2×2 집에서도 보이도록
    const side = Math.min(7, Math.max(4, (w / 5) | 0));
    if (w > 8) {
      r(x + w - side, y, side, h, sh);
      r(x + w - side, y, 1, h, deep);
    }
    r(x, y, w, 2, sh);                       // 처마 그림자 두껍게
    r(x, y + 2, 2, h - 2, darken(base, 1.08)); // 왼쪽 하이라이트
    r(x, y + h - 3, w, 3, sh);
    r(x, y + h - 1, w, 1, deep);
  };
  /** 창문: 프레임 + 유리 + 창틀 그림자 (밤엔 불) */
  const win = (x, y, w = 3, h = 3) => {
    const lit = TIME_TINTS[currentTime].ambient < 0.7;
    r(x - 1, y - 1, w + 2, h + 2, '#686860'); // 프레임
    r(x, y, w, h, lit ? '#e8c060' : PAL.winGlass);
    r(x, y, 1, Math.min(2, h), lit ? '#f8e8a0' : PAL.winHilite);
    r(x, y + h - 1, w, 1, lit ? '#c89840' : '#385878'); // 하단
    if (w >= 5) r(x + ((w / 2) | 0), y, 1, h, '#f0ece0'); // 세로 창살
  };
  /** 문: 문틀 + 문짝 + 손잡이 */
  const door = (x, y, w, h, col = PAL.woodDark) => {
    r(x - 1, y - 1, w + 2, h + 1, '#504838');
    r(x, y, w, h, col);
    r(x, y, w, 1, '#786850');
    if (w >= 4) r(x + w - 2, y + ((h / 2) | 0), 1, 2, PAL.gold); // 손잡이
  };
  /** 차양: 윗면 밝게 + 아래 그림자 + 줄무늬 */
  const awning = (c1, y0, hh) => {
    for (let i = 0; i < WPX; i += 4) r(i, y0, 4, hh, (i / 4) % 2 ? PAL.wallCream : c1);
    r(0, y0, WPX, 1, '#fff0d0');
    r(0, y0 + hh - 2, WPX, 1, 'rgba(40,24,16,.25)');
    r(0, y0 + hh - 1, WPX, 1, PAL.outline);
  };
  /** 간판: 검정 테두리 1px + 단색 + 하단 그림자 */
  const sign = (x, y, w, h, col) => {
    r(x - 1, y - 1, w + 2, h + 2, PAL.outline);
    r(x, y, w, h, col);
    r(x, y, w, 1, '#fff8e8');
    r(x, y + h, w, 1, 'rgba(0,0,0,.2)');
  };
  /** 포켓몬마트풍: 파란 지붕 + 흰 벽 + 큰 간판 띠 + 옆면 */
  const martBody = (roof = PAL.martBlue, top = PAL.martTop, bot = PAL.martBot) => {
    const roofH = Math.max(14, Math.round(HPX * 0.5));
    wallFace(5, roofH - 2, WPX - 10, HPX - roofH + 2, '#f8f8f0', '#c0c0b8');
    roofBand(0, 0, WPX, roofH, roof, top, bot);
    // 지붕 아래 흰 간판 띠 (마트 시그니처)
    r(2, roofH - 1, WPX - 4, 5, '#f0f4f8');
    r(3, roofH, WPX - 6, 3, roof);
    win(5, roofH + 7, 6, 6);
    door(WPX - 14, HPX - 12, 9, 12, '#284868');
  };
  const TILE_DARK = PAL.roofDark, TILE_TOP = '#8a5040', TILE_BOT = '#3a2818';

  if (b.s === 'temple') {
    // 사원 (R/S 비율): 벽은 아래 40%, 기와 2단이 넓게 오버행
    wallFace(6, 30, WPX - 12, HPX - 30, PAL.wallCream, PAL.wallShade);
    for (let i = 10; i < WPX - 8; i += 12) r(i, 32, 2, HPX - 34, PAL.wood);
    door(WPX / 2 - 8, HPX - 20, 16, 20);
    roofBand(10, 6, WPX - 20, 14, TILE_DARK, TILE_TOP, TILE_BOT);
    roofBand(0, 20, WPX, 12, TILE_DARK, TILE_TOP, TILE_BOT);
    r(WPX / 2 - 6, 0, 12, 7, PAL.gold);
    r(WPX / 2 - 6, 0, 12, 2, '#e8c890');
  } else if (b.s === 'pagoda') {
    // 탑: 4층 층단 — 기와가 벽보다 넓게, 위로 갈수록 좁게
    for (let i = 0; i < 4; i++) {
      const y0 = i * 14 + 6;
      const shrink = (3 - i) * 2;
      wallFace(12 + shrink, y0 + 5, WPX - 24 - shrink * 2, 9, PAL.wallCream, PAL.wallShade);
      roofBand(2 + shrink, y0, WPX - 4 - shrink * 2, 7, TILE_DARK, TILE_TOP, TILE_BOT);
      win(18 + shrink, y0 + 9, 3, 3); win(WPX - 21 - shrink, y0 + 9, 3, 3);
    }
    r(WPX / 2 - 3, 0, 6, 7, PAL.gold);
  } else if (b.s === 'shopR' || b.s === 'shopG') {
    // 마트풍 상점: 파란 지붕 + 간판 색으로만 구분
    martBody();
    sign(3, 3, WPX - 6, 4, b.s === 'shopR' ? PAL.accentRed : PAL.gold);
  } else if (b.s === 'house' || b.s === 'houseB') {
    // R/S식 주택: 지붕이 높이의 ~50%, 벽보다 넓게 오버행, 옆면 확실히 보이게
    // 지붕색은 R/S 마을처럼 집마다 다르게(빨강/파랑/주황/초록) — 위치 기반 고정
    const ROOFS = b.s === 'house'
      ? [[PAL.roofRed, '#e88888', PAL.roofDark], ['#d88040', '#f0b070', '#804820']]
      : [['#4878b0', '#98c0e8', '#203858'], ['#489060', '#88c890', '#204830']];
    const [rm, rt, rb] = ROOFS[(b.x + b.y) % 2];
    const roofH = Math.max(14, Math.round(HPX * 0.5));
    wallFace(5, roofH - 2, WPX - 10, HPX - roofH + 2, PAL.wallCream, PAL.wallShade);
    gableRoof(0, 0, WPX, roofH, rm, rt, rb);
    // 굴뚝
    r(WPX - 12, 3, 4, Math.max(5, roofH * 0.45), '#8a6a58');
    r(WPX - 12, 3, 4, 1, '#b09080'); r(WPX - 9, 3, 1, Math.max(5, roofH * 0.45), '#5a4038');
    win(7, roofH + 2, 5, 5); win(WPX - 14, roofH + 2, 5, 5);
    door(WPX / 2 - 4, HPX - 10, 8, 10);
    // 문 앞 발판
    r(WPX / 2 - 6, HPX - 2, 12, 2, PAL.pathLight);
  } else if (b.s === 'busStop') {
    const roofH = Math.round(HPX * 0.38);
    wallFace(2, roofH - 2, WPX - 4, HPX - roofH + 2, '#e8e8e0', '#c0c0b8');
    roofBand(0, 0, WPX, roofH, PAL.accentRed, '#e06860', '#902828');
    sign(3, 2, WPX - 6, 4, PAL.gold);
    win(5, roofH + 2, 5, 5); win(WPX - 11, roofH + 2, 5, 5);
    door(WPX / 2 - 5, HPX - 10, 10, 10, '#384048');
  } else if (b.s === 'taxiStand') {
    const roofH = Math.round(HPX * 0.38);
    wallFace(2, roofH - 2, WPX - 4, HPX - roofH + 2, PAL.wallCream, PAL.wallShade);
    roofBand(0, 0, WPX, roofH, PAL.gold, '#e8c890', '#a87848');
    r(WPX / 2 - 5, 1, 10, 5, '#282828'); r(WPX / 2 - 3, 2, 6, 3, '#f0d848');
    win(5, roofH + 2, 5, 5); win(WPX - 11, roofH + 2, 5, 5);
    door(WPX / 2 - 5, HPX - 10, 10, 10, '#384048');
  } else if (['monja', 'matcha', 'sushi', 'ramen', 'yakiniku', 'hoto'].includes(b.s)) {
    const col = { monja: PAL.accentRed, matcha: '#488850', sushi: PAL.navy, ramen: '#d08040', yakiniku: '#584038', hoto: '#987048' }[b.s];
    const traditional = b.s === 'sushi' || b.s === 'hoto';
    const roofY = b.s === 'matcha' ? 12 : 7, roofH = traditional ? 18 : 13;
    wallFace(4, roofY + roofH - 2, WPX - 8, HPX - roofY - roofH + 2, PAL.wallCream, PAL.wallShade);
    if (traditional) gableRoof(0, roofY, WPX, roofH, col);
    else roofBand(1, roofY, WPX - 2, roofH, col);
    if (b.s === 'matcha') { // large tea scoop / cone roof sign
      r(9, 1, 10, 4, '#80b868'); r(7, 5, 14, 5, '#488850'); r(11, 10, 6, 7, PAL.gold);
      awning('#488850', roofY + roofH, 5);
    } else if (b.s === 'yakiniku') {
      r(WPX - 12, 0, 6, 15, PAL.stoneDark); r(WPX - 14, 0, 10, 3, PAL.stoneLight);
      r(7, roofY + roofH + 2, 7, 11, PAL.accentRed); r(9, roofY + roofH + 3, 2, 8, PAL.gold);
    } else if (b.s === 'ramen' || b.s === 'hoto') {
      r(WPX / 2 - 10, 6, 20, 3, PAL.wallCream); r(WPX / 2 - 7, 9, 14, 5, col);
      r(WPX / 2 - 4, 1, 1, 4, PAL.wallCream); r(WPX / 2 + 3, 0, 1, 5, PAL.wallCream);
    } else if (b.s === 'monja') {
      r(6, 0, 16, 8, PAL.stoneDark); r(8, 2, 12, 4, '#c88858');
      awning(PAL.accentRed, roofY + roofH, 5);
    }
    const entranceX = traditional ? WPX / 2 - 5 : WPX - 16;
    door(entranceX, HPX - 15, 10, 15);
    if (b.s === 'sushi') for (let x = 6; x < WPX - 6; x += 7) r(x, HPX - 20, 6, 7, PAL.navy);
    else sign(6, HPX - 20, 13, 5, col);
    win(7, HPX - 12, 7, 6);
  } else if (b.s === 'stall' || b.s === 'stall2') {
    awning(b.s === 'stall' ? PAL.accentRed : PAL.martBlue, 0, 12);
    r(2, 16, WPX - 4, 12, PAL.wood);
    r(2, 16, WPX - 4, 1, '#b08858');
    const fr = b.s === 'stall' ? [PAL.accentRed, PAL.gold, '#488850'] : [PAL.gold, '#488850', PAL.accentRed];
    fr.forEach((col, i) => r(5 + i * 8, 18, 5, 4, col));
  } else if (b.s === 'elec' || b.s === 'elec2' || b.s === 'akihabara') {
    // 전자상가: 회색 박스 + 창문 격자 + 세로 간판 2색
    wallFace(0, 4, WPX, HPX - 4, '#b8bcc0', '#909498');
    r(0, 4, WPX, 2, '#707880');
    for (let y = 10; y < HPX - 18; y += 10)
      for (let x = 5; x < WPX - 18; x += 9) win(x, y, 3, 3);
    r(WPX - 13, 8, 10, HPX - 26, '#282838');
    const neon = b.s === 'elec' ? [PAL.gold, PAL.accentRed] : [PAL.martTop, PAL.gold];
    for (let y = 10, i = 0; y < HPX - 30; y += 8, i++) r(WPX - 11, y, 6, 6, neon[i % 2]);
    door(8, HPX - 14, 20, 14, '#384048');
    r(WPX / 2 - 2, 0, 3, 5, '#707880');
  } else if (b.s === 'fountain') {
    r(2, 2, WPX - 4, HPX - 4, PAL.stoneMid);
    r(2, 2, WPX - 4, 1, PAL.stoneLight);
    r(2, HPX - 3, WPX - 4, 1, PAL.stoneDark);
    r(6, 6, WPX - 12, HPX - 12, PAL.waterLight);
    r(7, 7, 4, 1, PAL.waterHilite);
    r(WPX / 2 - 3, 8, 6, 12, PAL.stoneLight);
  } else if (b.s === 'station') {
    // 역: 큰 네이비 지붕(오버행) + 금색 간판 밴드 + 개찰 문
    // R/S 게이트하우스 느낌: 기둥 2개 + 시계 + 넓은 개찰 입구
    const roofH = Math.round(HPX * 0.42);
    wallFace(2, roofH - 2, WPX - 4, HPX - roofH + 2, '#d8dcd8', '#a8aca8');
    roofBand(0, 0, WPX, roofH, PAL.navy, PAL.navyLight, PAL.navyDeep);
    sign(5, 3, WPX - 10, 5, PAL.gold);
    r(7, 4, WPX - 14, 3, PAL.navy);
    // 시계
    r(WPX / 2 - 4, roofH + 1, 8, 8, '#f8f8f0'); r(WPX / 2 - 3, roofH + 2, 6, 6, '#ffffff');
    r(WPX / 2, roofH + 3, 1, 3, PAL.outline); r(WPX / 2, roofH + 5, 2, 1, PAL.outline);
    for (let x = 6; x < WPX - 12; x += 14) if (Math.abs(x + 2 - WPX / 2) > 7) win(x, roofH + 3, 5, 5);
    // 기둥
    r(4, roofH - 1, 3, HPX - roofH + 1, '#b8bcc0'); r(6, roofH - 1, 1, HPX - roofH + 1, '#888c90');
    r(WPX - 10, roofH - 1, 3, HPX - roofH + 1, '#b8bcc0'); r(WPX - 8, roofH - 1, 1, HPX - roofH + 1, '#888c90');
    door(WPX / 2 - 8, HPX - 14, 16, 14, '#2a3038');
    r(2, HPX - 3, WPX - 4, 2, PAL.gold);
  } else if (b.s === 'hotel') {
    // Section L: stepped apartment block, rooftop plant room and balcony rails.
    wallFace(7, 12, WPX - 14, HPX - 12, '#e4dcc8', '#aaa894');
    roofBand(5, 8, WPX - 10, 8, PAL.navy, PAL.navyLight, PAL.navyDeep);
    roofBand(12, 1, WPX / 2, 8, '#98a8a0', '#c8d4c8', '#586860');
    for (let y = 20; y < HPX - 16; y += 13) {
      for (let x = 12; x < WPX - 14; x += 12) win(x, y, 6, 6);
      r(9, y + 8, WPX - 20, 2, PAL.navy); r(9, y + 6, WPX - 20, 1, '#f4f0dc');
    }
    door(WPX / 2 - 5, HPX - 13, 10, 13, PAL.winGlass);
    roofBand(WPX / 2 - 10, HPX - 18, 20, 6, PAL.navy, PAL.navyLight, PAL.navyDeep);
    sign(WPX - 16, 19, 7, 13, PAL.navy); r(WPX - 14, 22, 2, 7, PAL.wallCream); r(WPX - 14, 27, 4, 2, PAL.wallCream);
  } else if (b.s === 'airport') {
    // 공항 (R/S 비율): 넓은 지붕 + 유리 밴드 + 관제탑(옆면) + 금색 간판
    const roofH = Math.round(HPX * 0.34);
    wallFace(2, roofH + 4, WPX - 4, HPX - roofH - 4, '#d0d4d8', '#a0a4a8');
    roofBand(0, 6, WPX, roofH, '#707888', '#8890a0', '#485058');
    r(4, 0, WPX - 8, 8, '#c8d0d8');           // 관제탑 베이스
    r(WPX / 2 - 4, 0, 8, roofH + 6, '#707888');  // 관제탑
    r(WPX / 2 + 2, 0, 2, roofH + 6, '#485058');  // 관제탑 옆면
    r(WPX / 2 - 8, 2, 16, 4, PAL.winGlass);
    r(WPX / 2 - 8, 2, 16, 1, PAL.winHilite);
    r(6, roofH + 8, WPX - 14, 5, PAL.winGlass);  // 터미널 유리 밴드
    r(6, roofH + 8, WPX - 14, 1, PAL.winHilite);
    sign(WPX / 2 - 12, roofH + 16, 24, 5, PAL.gold);
    door(10, HPX - 10, 18, 10, '#384048');
    r(WPX - 30, HPX - 12, 20, 4, '#e8e8e0');
  } else if (b.s === 'taxi') {
    wallFace(0, 8, WPX, HPX - 8, PAL.wallCream, PAL.wallShade);
    roofBand(0, 0, WPX, 8, PAL.gold, '#e8c890', '#a87848');
    r(6, 12, WPX - 12, 10, '#282828');
    r(8, 14, 6, 4, PAL.winGlass); r(WPX - 14, 14, 6, 4, PAL.winGlass);
    r(WPX / 2 - 4, 18, 8, 3, PAL.gold);
  } else if (b.s === 'market') {
    // Ameyoko gateway: open central alley between two produce stalls.
    r(3, 3, 3, HPX - 3, PAL.accentRed); r(WPX - 6, 3, 3, HPX - 3, PAL.accentRed);
    roofBand(0, 0, WPX, 7, PAL.accentRed, '#e88068', '#782830');
    sign(WPX / 2 - 13, 2, 26, 5, PAL.navy);
    for (let x = WPX / 2 - 10; x < WPX / 2 + 11; x += 5) r(x, 4, 3, 2, PAL.wallCream);
    for (const x of [1, WPX - 23]) {
      roofBand(x, 13, 22, 7, PAL.gold, '#f0d098', '#886040');
      for (let k = 0; k < 20; k += 5) r(x + k, 15, 3, 4, PAL.accentRed);
      wallFace(x + 2, 21, 18, HPX - 21, PAL.wood, PAL.woodDark);

      r(x, y, 5, HPX - y - 3, i % 2 ? '#68c8f0' : '#c878f0');
      r(x+2, y+2, 2, HPX-y-7, '#e4f7ff');
      r(x+1, y+2, 3, 3, '#f0f8ff');
    }
    r(0, HPX - 3, WPX, 3, '#181828');
  } else if (b.s === 'locker') {
    wallFace(0, 2, WPX, HPX - 2, '#c8d0d8', '#98a0a8');
    for (let y = 4; y < HPX - 4; y += 6) {
      r(2, y, WPX - 4, 5, '#e8eef4');
      r(WPX - 5, y + 2, 2, 2, PAL.gold);
    }
  } else if (b.s === 'shelf') {
    wallFace(0, 2, WPX, HPX - 2, '#e8e0d0', '#b8b0a0');
    for (let y = 4; y < HPX - 2; y += 5) {
      r(1, y, WPX - 2, 1, PAL.wood);
      for (let x = 2; x < WPX - 3; x += 4) r(x, y - 3, 3, 3, ['#c84040', '#3868b8', '#48a060', '#e8b848'][(x + y) % 4]);
    }
  } else if (b.s === 'fridge') {
    wallFace(0, 2, WPX, HPX - 2, '#e8f0f8', '#b0c0d0');
    r(2, 4, WPX - 4, HPX - 8, '#d0e0f0');
    r(WPX - 5, 8, 2, 4, '#8898a8');
    r(3, 6, 4, 3, '#68c878'); r(3, 11, 4, 3, '#f0a040');
  } else if (b.s === 'altar') {
    wallFace(4, 10, WPX - 8, HPX - 10, PAL.wallCream, PAL.wallShade);
    roofBand(0, 4, WPX, 8, TILE_DARK, TILE_TOP, TILE_BOT);
    r(WPX / 2 - 4, 0, 8, 5, PAL.gold);
    r(7,14,WPX-14,HPX-19,b.theme==='gajoen'?'#8a503f':'#75433a');
    for(let x=10;x<WPX-10;x+=14){r(x,15,3,HPX-22,'#d3ac58');r(x+4,18,6,7,b.theme==='gajoen'?'#d79c9e':'#f1ce77');}
    r(6,HPX-9,WPX-12,3,'#cfaa65');r(3,HPX-5,WPX-6,3,'#a48b70');
  } else if (b.s === 'pillar') {
    r(WPX / 2 - 3, 0, 6, HPX, PAL.accentRed);
    r(WPX / 2 - 3, 0, 6, 2, '#e06860');
    r(WPX / 2 + 1, 0, 2, HPX, '#902828');
  } else if (b.s === 'flower' && b.theme === 'planets') {
    for (let i=0;i<5;i++) {
      const x=3+(i%3)*9,y=3+Math.floor(i/3)*13;
      r(x+3,y,2,11,'#709680');
      r(x,y+3,8,5,i%2?'#c59cf0':'#ec8cb9');
      r(x+2,y+1,4,9,i%2?'#c59cf0':'#ec8cb9');
      r(x+3,y+4,2,3,'#fff0ba');
    }
  } else if (b.s === 'plant' || b.s === 'flower') {
    r(WPX / 2 - 2, HPX - 6, 4, 6, PAL.wood);
    r(2, 2, WPX - 4, 10, b.s === 'flower' ? '#e878a0' : '#489050');
    r(4, 4, 3, 3, b.s === 'flower' ? '#f0b0c8' : '#68b068');
    r(WPX - 8, 6, 3, 3, b.s === 'flower' ? '#f0d060' : '#307838');
  }

  strokeOuterOutline(q, WPX, HPX);
  return c;
}

/** 바깥 실루엣만 1px outline (창문은 내부 구멍이라 제외) */
function strokeOuterOutline(q, WPX, HPX) {
  const src = q.getImageData(0, 0, WPX, HPX);
  const s = src.data;
  const opaque = (x, y) => {
    if (x < 0 || y < 0 || x >= WPX || y >= HPX) return false;
    return s[(y * WPX + x) * 4 + 3] > 10;
  };
  const ext = new Uint8Array(WPX * HPX);
  const stack = [];
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= WPX || y >= HPX) return;
    const i = y * WPX + x;
    if (ext[i] || opaque(x, y)) return;
    ext[i] = 1;
    stack.push(i);
  };
  for (let x = 0; x < WPX; x++) { push(x, 0); push(x, HPX - 1); }
  for (let y = 0; y < HPX; y++) { push(0, y); push(WPX - 1, y); }
  while (stack.length) {
    const i = stack.pop();
    const x = i % WPX, y = (i / WPX) | 0;
    push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
  }
  for (let y = 0; y < HPX; y++) {
    for (let x = 0; x < WPX; x++) {
      if (!opaque(x, y)) continue;
      const i = y * WPX + x;
      const onEdge = x === 0 || y === 0 || x === WPX - 1 || y === HPX - 1;
      const touchExt = (x > 0 && ext[i - 1]) || (x < WPX - 1 && ext[i + 1])
        || (y > 0 && ext[i - WPX]) || (y < HPX - 1 && ext[i + WPX]);
      if (onEdge || touchExt) {
        const o = i * 4;
        s[o] = 0x2a; s[o + 1] = 0x28; s[o + 2] = 0x22; s[o + 3] = 255;
      }
    }
  }
  q.putImageData(src, 0, 0);
}

/* ═══ 캐릭터 ═══ */
let bounce = 0;
/** 실루엣을 outline 1px로 먼저 찍고 본색을 덮는다 (GBC 외곽선) */
function paintOutlined(ctx, sx, sy, u, rects) {
  const paint = (ox, oy, col) => {
    for (const [x, y, w, h, c] of rects) {
      ctx.fillStyle = col || c;
      ctx.fillRect(sx + (x + ox) * u, sy + (y - 6 + oy) * u, w * u, h * u);
    }
  };
  for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) paint(ox, oy, PAL.outline);
  paint(0, 0);
}

function drawChar(ctx, sx, sy, dir, frame, p, tag) {
  const u = Math.max(4, SCALE + 1);
  const rects = [];
  const r = (x, y, w, h, col) => { rects.push([x, y, w, h, col]); };
  // 그림자는 외곽선 없이
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(sx + 3 * u, sy + (17 - 6) * u, 10 * u, 2 * u);
  if (frame === 0) { r(5, 12, 3, 4, p.pants); r(8, 12, 3, 4, p.pants); }
  else { r(4, 12, 3, 4, p.pants); r(9, 12, 3, 4, p.pants); }
  r(4, 8, 8, 5, p.dress || p.shirt);
  if (p.dress) r(3, 11, 10, 3, p.dress);
  r(3, 9, 1, 3, p.skin); r(12, 9, 1, 3, p.skin);
  r(4, 3, 8, 5, p.skin);
  r(4, 1, 8, 3, p.hair);
  r(3, 2, 1, 4, p.hair); r(12, 2, 1, 4, p.hair);
  if (p.long) { r(2, 3, 2, 7, p.hair); r(12, 3, 2, 7, p.hair); }
  if (p.cap) { r(4, 0, 8, 3, p.cap); if (dir === 'down') r(3, 2, 10, 1, p.cap); }
  if (dir === 'down') { r(6, 5, 1, 2, PAL.outline); r(9, 5, 1, 2, PAL.outline); }
  else if (dir === 'left') r(5, 5, 1, 2, PAL.outline);
  else if (dir === 'right') r(10, 5, 1, 2, PAL.outline);
  paintOutlined(ctx, sx, sy, u, rects);
  if (tag) {
    ctx.font = `bold ${Math.max(11, SCALE * 3.5)}px ${FONT_UI}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const tw = ctx.measureText(tag).width;
    const bx = sx + 7 * u - tw / 2 - 4, by = sy - 2 * u;
    ctx.fillStyle = 'rgba(208,96,56,.95)';
    ctx.fillRect(bx, by - 14, tw + 8, 16);
    ctx.fillStyle = '#5c3418';
    ctx.fillRect(bx, by - 14, tw + 8, 2);
    ctx.fillStyle = '#fff';
    ctx.fillText(tag, sx + 7 * u, by);
    ctx.fillStyle = '#d06038';
    ctx.beginPath();
    const ax = sx + 7 * u, ay = by + 2 + Math.sin(bounce / 160) * 3;
    ctx.moveTo(ax - 5, ay); ctx.lineTo(ax + 5, ay); ctx.lineTo(ax, ay + 7);
    ctx.closePath(); ctx.fill();
  }
}
/* 작애 (JAKAE) — 고퀄 GBC 스프라이트 (사진 턴어라운드 기준) */
function drawJakae(ctx, sx, sy, dir, frame, p, tag) {
  // 사람보다 한 체급 작게 (발은 타일 바닥에 맞춤)
  const uHuman = Math.max(4, SCALE + 1);
  const u = Math.max(2, SCALE - 1);
  sy += (uHuman - u) * 8;
  const rects = [];
  const r = (x, y, w, h, col) => { rects.push([x, y, w, h, col]); };
  // 타원 그림자
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(sx + 2 * u, sy + (18 - 6) * u, 12 * u, 2 * u);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(sx + 4 * u, sy + (17 - 6) * u, 8 * u, 1 * u);

  const walk = frame === 1;
  const bob = walk ? 1 : ((bounce / 400 | 0) % 2);
  const armL = walk ? 1 : 0;
  const armR = walk ? 0 : 1;

  // ── 통통한 빨간 신발 + 흰 스트랩 ──
  const shoe = (x, y) => {
    r(x, y, 5, 3, p.shoe);
    r(x, y, 5, 1, p.shoeHilite);
    r(x + 1, y + 1, 3, 1, p.strap);
    r(x + 2, y + 1, 1, 1, p.buckle);
    r(x, y + 2, 5, 1, p.sole);
  };
  if (!walk) { shoe(3, 15); shoe(8, 15); }
  else { shoe(2, 15); shoe(9, 16); }

  // ── 짧은 다리 ──
  if (!walk) { r(5, 13, 2, 2, p.blue); r(9, 13, 2, 2, p.blue); }
  else { r(4, 13, 2, 2, p.blue); r(10, 13, 2, 1, p.blue); }

  // ── 통통한 몸 + 둥근 배 ──
  r(4, 9, 8, 5, p.blue);
  r(3, 10, 1, 3, p.blue); r(12, 10, 1, 3, p.blue);
  r(4, 9, 8, 1, p.blueHilite);
  r(5, 10, 6, 4, p.belly);
  r(6, 10, 4, 1, p.bellyHilite);
  r(6, 12, 2, 1, p.bellyHilite);

  // ── 짧은 팔 + 통통한 흰 ──
  r(2, 10 + armL, 2, 2, p.blue);
  r(12, 10 + armR, 2, 2, p.blue);
  r(1, 11 + armL, 3, 3, p.glove);
  r(12, 11 + armR, 3, 3, p.glove);
  r(1, 11 + armL, 3, 1, p.gloveCuff);
  r(12, 11 + armR, 3, 1, p.gloveCuff);

  const hy = bob;

  if (dir === 'up') {
    // 등: 부드러운 둥근 가시 3개
    r(4, 3 + hy, 8, 7, p.blue);
    r(3, 5 + hy, 2, 4, p.blue); r(11, 5 + hy, 2, 4, p.blue);
    r(5, 1 + hy, 3, 4, p.quill);
    r(7, 0 + hy, 3, 4, p.quill);
    r(9, 1 + hy, 3, 4, p.quill);
    r(6, 0 + hy, 1, 2, p.blueHilite); r(8, 0 + hy, 1, 2, p.blueHilite);
    r(5, 9 + hy, 6, 1, p.blueShade);
  } else if (dir === 'left') {
    r(6, 3 + hy, 6, 7, p.blue);
    r(10, 1 + hy, 3, 3, p.quill);
    r(11, 3 + hy, 3, 3, p.quill);
    r(11, 6 + hy, 2, 2, p.quill);
    r(10, 1 + hy, 1, 1, p.blueHilite);
    r(8, 2 + hy, 2, 2, p.blue); r(8, 3 + hy, 1, 1, p.earIn);
    r(3, 5 + hy, 5, 4, p.muzzle);
    r(3, 5 + hy, 5, 1, p.muzzleHilite);
    r(3, 7 + hy, 1, 1, p.nose);
    r(4, 8 + hy, 2, 1, p.smile);
    r(5, 4 + hy, 3, 3, p.eyeWhite);
    r(5, 4 + hy, 2, 2, p.eye);
    r(5, 4 + hy, 1, 1, p.pupil);
    r(6, 4 + hy, 1, 1, p.spark);
    r(5, 8 + hy, 2, 1, p.blush);
  } else if (dir === 'right') {
    r(4, 3 + hy, 6, 7, p.blue);
    r(3, 1 + hy, 3, 3, p.quill);
    r(2, 3 + hy, 3, 3, p.quill);
    r(3, 6 + hy, 2, 2, p.quill);
    r(5, 1 + hy, 1, 1, p.blueHilite);
    r(6, 2 + hy, 2, 2, p.blue); r(7, 3 + hy, 1, 1, p.earIn);
    r(8, 5 + hy, 5, 4, p.muzzle);
    r(8, 5 + hy, 5, 1, p.muzzleHilite);
    r(12, 7 + hy, 1, 1, p.nose);
    r(10, 8 + hy, 2, 1, p.smile);
    r(8, 4 + hy, 3, 3, p.eyeWhite);
    r(9, 4 + hy, 2, 2, p.eye);
    r(10, 4 + hy, 1, 1, p.pupil);
    r(9, 4 + hy, 1, 1, p.spark);
    r(9, 8 + hy, 2, 1, p.blush);
  } else {
    // 정면: 큰 둥근 머리 + 부드러운 가시 + 큰 눈 + 미소
    r(4, 2 + hy, 8, 7, p.blue);
    r(3, 3 + hy, 1, 5, p.blue); r(12, 3 + hy, 1, 5, p.blue);
    r(4, 2 + hy, 8, 2, p.blueHilite);
    r(5, 8 + hy, 6, 1, p.blueShade);
    // 둥근 가시 (짧고 통통)
    r(6, 0 + hy, 4, 3, p.quill);
    r(3, 0 + hy, 3, 3, p.quill); r(10, 0 + hy, 3, 3, p.quill);
    r(1, 2 + hy, 3, 3, p.quill); r(12, 2 + hy, 3, 3, p.quill);
    r(7, 0 + hy, 1, 1, p.blueHilite);
    r(4, 0 + hy, 1, 1, p.blueHilite); r(11, 0 + hy, 1, 1, p.blueHilite);
    // 귀
    r(3, 2 + hy, 2, 2, p.blue); r(11, 2 + hy, 2, 2, p.blue);
    r(4, 2 + hy, 1, 1, p.earIn); r(11, 2 + hy, 1, 1, p.earIn);
    // 통통한 주둥이
    r(5, 5 + hy, 6, 4, p.muzzle);
    r(5, 5 + hy, 6, 1, p.muzzleHilite);
    r(7, 6 + hy, 2, 1, p.nose);
    r(6, 8 + hy, 4, 1, p.smile);
    r(5, 8 + hy, 2, 1, p.blush); r(9, 8 + hy, 2, 1, p.blush);
    // 큰 둥근 눈 + 작은 동공
    r(4, 3 + hy, 3, 3, p.eyeWhite); r(9, 3 + hy, 3, 3, p.eyeWhite);
    r(4, 3 + hy, 3, 1, '#fff'); r(9, 3 + hy, 3, 1, '#fff');
    r(5, 3 + hy, 2, 2, p.eye); r(9, 3 + hy, 2, 2, p.eye);
    r(5, 4 + hy, 1, 1, p.pupil); r(10, 4 + hy, 1, 1, p.pupil);
    r(6, 3 + hy, 1, 1, p.spark); r(9, 3 + hy, 1, 1, p.spark);
  }

  paintOutlined(ctx, sx, sy, u, rects);

  if (tag) {
    ctx.font = `bold ${Math.max(10, SCALE * 3)}px ${FONT_UI}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const tw = ctx.measureText(tag).width;
    const bx = sx + 7 * u - tw / 2 - 4, by = sy - 2 * u;
    ctx.fillStyle = 'rgba(90,58,28,.94)';
    ctx.fillRect(bx, by - 12, tw + 8, 14);
    ctx.fillStyle = '#c48a48';
    ctx.fillRect(bx, by - 12, tw + 8, 2);
    ctx.fillStyle = '#fff';
    ctx.fillText(tag, sx + 7 * u, by);
    ctx.fillStyle = '#e8b848';
    ctx.beginPath();
    const ax = sx + 7 * u, ay = by + 2 + Math.sin(bounce / 160) * 2;
    ctx.moveTo(ax - 4, ay); ctx.lineTo(ax + 4, ay); ctx.lineTo(ax, ay + 5);
    ctx.closePath(); ctx.fill();
  }
}

/* ═══ 엔티티 ═══ */
function makeEnt(x, y) {
  return { x, y, fx: x, fy: y, px: x * TS, py: y * TS, dir: 'down', frame: 0, moving: false, t: 0 };
}
const me = makeEnt(2, 2), wife = makeEnt(3, 2), pet = makeEnt(4, 2);

// 일정 스팟 주변의 넓은 잔디·길에 배치. 고정 좌표보다 맵 크기 변화에 안전하다.
function placeNpcs(definitions) {
  for (const definition of definitions) {
    const anchor = (interior && definition.anchor) || TRIG[definition.stop] || TRIG.find(Boolean) || (interior ? [W >> 1, 6] : GATE);
    const candidates = [];
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      // 잔디(0)·보도(1)·풀숲(8)만 — 광장·건물·물 제외 (실내는 돌바닥(2)도 허용)
      if (!interior && g[y][x] !== 0 && g[y][x] !== 1 && g[y][x] !== 8) continue;
      if (npcBlocked.has(y * W + x)) continue;
      if (TRIG.some(t => t && Math.abs(t[0] - x) + Math.abs(t[1] - y) <= 2)) continue;
      if ([me, wife, pet].some(e => Math.abs(e.x - x) + Math.abs(e.y - y) <= 2)) continue;
      if (STATIONS.some(st => x >= st.x - 1 && x <= st.x + st.w &&
        y >= st.y - 1 && y <= st.y + st.h + 2)) continue;
      // 본인 칸 + 사방만 통행 가능하면 충분 (3×3 전면은 너무 빡셈)
      if (!walkable(x, y)) continue;
      let open = true;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        if (!walkable(x + dx, y + dy)) { open = false; break; }
      }
      if (!open) continue;
      if (interior) {
        // An NPC may not turn a furniture aisle into an isolated pocket.
        const reached = new Set(), pending = [[me.x, me.y]];
        while (pending.length) {
          const [cx, cy] = pending.pop(), key = cy * W + cx;
          if ((cx === x && cy === y) || reached.has(key) || !walkable(cx, cy)) continue;
          reached.add(key);
          pending.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
        }
        let count = 0;
        for (let yy=1; yy<H-1; yy++) for (let xx=1; xx<W-1; xx++) if (walkable(xx,yy) && !(xx===x && yy===y)) count++;
        if (reached.size !== count) continue;
      }
      candidates.push({ x, y, distance: Math.abs(anchor[0] - x) + Math.abs(anchor[1] - y) });
    }
    candidates.sort((a, b) => a.distance - b.distance);
    // 같은 스팟에 여러 명이면 가까운 후보를 조금씩 나눠 씀
    const pick = candidates.find((p, i) => {
      if (i < npcs.filter(n => n.stop === definition.stop).length) return false;
      if (findPath(me.x, me.y, p.x, p.y + 1).length) return true;
      if (findPath(me.x, me.y, p.x, p.y - 1).length) return true;
      if (findPath(me.x, me.y, p.x + 1, p.y).length) return true;
      return !!findPath(me.x, me.y, p.x - 1, p.y).length;
    }) || candidates[npcs.length % Math.max(1, candidates.length)] || candidates[0];
    if (!pick) continue;
    const pal = NPC_PALS[(definition.pal ?? npcs.length) % NPC_PALS.length];
    // 실내·가게 점원도 움직임. roam:true = 마을 배회, 그 외/실내 = 집 근처 서성임
    const staffish = /주인|점원|상인|직원|알바|웨이터|스태프|안내|정원사|해설|안내원/.test(definition.name || '');
    const roamRadius = interior ? 5 : (definition.roam ? 40 : staffish ? 4 : 3);
    npcs.push({
      ...makeEnt(pick.x, pick.y),
      ...definition,
      lastLineIndex: -1,
      homeX: pick.x,
      homeY: pick.y,
      roam: true,
      roamRadius,
      path: [],
      wait: 400 + Math.random() * (roamRadius < 10 ? 900 : 1600),
      moveDur: NPC_DUR,
      pal
    });
    npcBlocked.add(pick.y * W + pick.x);
  }
}

function stepNpc(npc, nx, ny) {
  if (npc.moving || dlgOpen || ride) return false;
  if ([me, wife, pet].some(e => e.x === nx && e.y === ny)) return false;
  if (npcs.some(o => o !== npc && o.x === nx && o.y === ny)) return false;
  if (TRIG.some(t => t && t[0] === nx && t[1] === ny)) return false;
  // 서성임 모드: 집(홈)에서 너무 멀리 못 감
  const rad = npc.roamRadius ?? 40;
  if (rad < 30 && Math.abs(nx - npc.homeX) + Math.abs(ny - npc.homeY) > rad) return false;
  npcBlocked.delete(npc.y * W + npc.x);
  const ok = walkable(nx, ny);
  if (!ok) {
    npcBlocked.add(npc.y * W + npc.x);
    return false;
  }
  npc.dir = nx > npc.x ? 'right' : nx < npc.x ? 'left' : ny > npc.y ? 'down' : 'up';
  npc.fx = npc.x; npc.fy = npc.y;
  npc.x = nx; npc.y = ny;
  npc.moving = true; npc.t = 0;
  npcBlocked.add(ny * W + nx);
  return true;
}

function pickNpcWanderTarget(npc) {
  const rad = npc.roamRadius ?? 40;
  const pace = rad < 30;
  const goals = [];
  if (pace) {
    // 가게 앞·실내: 홈 주변만 서성임
    for (let dy = -rad; dy <= rad; dy++) {
      for (let dx = -rad; dx <= rad; dx++) {
        const manh = Math.abs(dx) + Math.abs(dy);
        if (manh < 1 || manh > rad) continue;
        goals.push([npc.homeX + dx, npc.homeY + dy]);
      }
    }
  } else {
    // 마을 전체 배회
    for (const t of TRIG) {
      if (!t) continue;
      const [tx, ty] = t;
      for (const [dx, dy] of [[0, 2], [0, -2], [2, 0], [-2, 0], [1, 1], [-1, 1]]) {
        const x = tx + dx, y = ty + dy;
        if (walkable(x, y) || (g[y] && (g[y][x] === 0 || g[y][x] === 1))) goals.push([x, y]);
      }
    }
    for (let t = 0; t < 12; t++) {
      const x = 2 + ((Math.random() * (W - 4)) | 0);
      const y = 2 + ((Math.random() * (H - 4)) | 0);
      goals.push([x, y]);
    }
  }
  // 자기 칸을 잠깐 열어 길찾기
  npcBlocked.delete(npc.y * W + npc.x);
  let best = null, bestLen = 0;
  const minDist = pace ? 1 : 6;
  const tries = pace ? Math.min(goals.length, 24) : 16;
  for (let i = 0; i < tries; i++) {
    const [gx, gy] = goals[(Math.random() * goals.length) | 0];
    if (!walkable(gx, gy)) continue;
    if (Math.abs(gx - npc.x) + Math.abs(gy - npc.y) < minDist) continue;
    if (pace && Math.abs(gx - npc.homeX) + Math.abs(gy - npc.homeY) > rad) continue;
    const p = findPath(npc.x, npc.y, gx, gy);
    if (p.length > bestLen) { bestLen = p.length; best = p; }
    if (bestLen >= (pace ? 3 : 8)) break;
  }
  npcBlocked.add(npc.y * W + npc.x);
  return best || [];
}

function updateNpcs(dt) {
  for (const npc of npcs) {
    updateEnt(npc, dt);
    if (!npc.roam || npc.moving || dlgOpen || ride) continue;
    if (talkingNpc === npc) continue;

    if (npc.path && npc.path.length) {
      const [nx, ny] = npc.path.shift();
      if (!stepNpc(npc, nx, ny)) npc.path = [];
      else npc.wait = 200 + Math.random() * 260;
      continue;
    }

    npc.wait -= dt;
    if (npc.wait > 0) continue;
    const pace = (npc.roamRadius ?? 40) < 30;
    npc.wait = (pace ? 700 : 1400) + Math.random() * (pace ? 1400 : 2200);

    // 서성임은 거의 항상 한두 칸, 배회는 65% 확률로 긴 경로
    if (pace || Math.random() < 0.65) {
      const path = pickNpcWanderTarget(npc);
      if (path.length) {
        npc.path = path.slice(0, pace ? 5 : 14);
        continue;
      }
    }
    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    for (let i = dirs.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
    }
    for (const [dx, dy] of dirs) {
      if (stepNpc(npc, npc.x + dx, npc.y + dy)) break;
    }
  }
}

function step(ent, nx, ny) {
  if (ent.moving) return false;
  ent.dir = nx > ent.x ? 'right' : nx < ent.x ? 'left' : ny > ent.y ? 'down' : 'up';
  if (!walkable(nx, ny)) return false;
  ent.fx = ent.x; ent.fy = ent.y; ent.x = nx; ent.y = ny;
  ent.moving = true; ent.t = 0;
  return true;
}
function tryMove(dx, dy) {
  const px = me.x, py = me.y;
  me.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
  const wx0 = wife.x, wy0 = wife.y;
  if (step(me, me.x + dx, me.y + dy)) {
    if (wife.x !== px || wife.y !== py) step(wife, px, py);
    if (pet.x !== wx0 || pet.y !== wy0) step(pet, wx0, wy0);
    return true;
  }
  return false;
}
function tryMoveTo(nx, ny) { tryMove(nx - me.x, ny - me.y); }
function teleport(x, y) {
  me.x = me.fx = x; me.y = me.fy = y; me.px = x * TS; me.py = y * TS; me.moving = false;
  const wx = walkable(x + 1, y) ? x + 1 : (walkable(x - 1, y) ? x - 1 : x);
  wife.x = wife.fx = wx; wife.y = wife.fy = y;
  wife.px = wx * TS; wife.py = y * TS; wife.moving = false;
  const tx = walkable(wx + 1, y) ? wx + 1 : (walkable(x, y + 1) ? x : wx);
  const ty = (tx === x) ? y + 1 : y;
  pet.x = pet.fx = tx; pet.y = pet.fy = ty;
  pet.px = tx * TS; pet.py = ty * TS; pet.moving = false;
}

function findPath(sx, sy, tx, ty) {
  const prev = new Map(); const q = [[sx, sy]]; prev.set(sy * W + sx, null);
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) {
      const path = []; let k = ty * W + tx;
      while (k !== null) { path.unshift([k % W, (k / W) | 0]); k = prev.get(k); }
      path.shift(); return path;
    }
    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nx = x + dx, ny = y + dy, key = ny * W + nx;
      if (!prev.has(key) && walkable(nx, ny)) { prev.set(key, y * W + x); q.push([nx, ny]); }
    }
  }
  return [];
}

/** 같은 칸에 트리거가 여러 개일 때(숙소 출발/복귀) 올바른 인덱스 선택 */
function trigAt(x, y, loose = false) {
  const hit = [];
  for (let i = 0; i < TRIG.length; i++) {
    if (!TRIG[i]) continue; // 다른 마을의 스팟
    const [tx, ty] = TRIG[i];
    const d = Math.abs(tx - x) + Math.abs(ty - y);
    if (loose ? d <= 1 : d === 0) hit.push(i);
  }
  if (!hit.length) return -1;
  if (target < TRIG.length && hit.includes(target)) return target;
  return hit[hit.length - 1];
}

/** 이 스팟에서 잠들기(다음날) 가능 — 숙소·하루 마지막 */

  return true;
}
